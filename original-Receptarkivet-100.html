/* Recipe origins and a small, deliberately controlled tag vocabulary */
.origin-flag{display:inline-block;vertical-align:-.08em;font-family:system-ui,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:.58em;letter-spacing:0;margin-right:.34em;line-height:1;white-space:nowrap}
.detail-flag{font-size:.55em;vertical-align:.05em;margin-right:.28em}
.card-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;min-height:21px}
.card-tags span,.detail-tag{display:inline-block;padding:4px 8px;border-radius:99px;background:#f1ece4;color:#756b5f;font-size:10px;font-weight:650;letter-spacing:.01em}
.extra-filters{display:flex;gap:11px;align-items:end;flex-wrap:wrap;margin:0 0 4px}
.filter-field{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:12px;font-weight:700}
.filter-field select{max-width:240px;min-height:37px;border-radius:9px;padding:7px 28px 7px 12px;color:var(--ink);border:1px solid var(--border);background:var(--paper);font-family:inherit;font-size:12px;font-weight:650}
.filter-hint{color:var(--muted);font-size:11px;line-height:1.4;margin:6px 0 0}
.reset-filters{background:transparent;border:0;color:var(--accent);font-weight:700;min-height:37px;font-size:12px;padding:0 8px}
.reset-filters[hidden]{display:none}
.origin-detail{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:14px}
.origin-caption{background:#f1ece4;border-radius:99px;padding:7px 12px;font-size:12px;color:#645e51;font-weight:600;max-width:100%;line-height:1.45}
@media(max-width:650px){.extra-filters{gap:8px}.filter-field{flex:1 1 138px;display:flex;flex-direction:column;align-items:stretch;gap:5px}.filter-field select{max-width:none;width:100%}.card-tags{margin-top:8px}.origin-caption{border-radius:12px}}
.mobile-filter-tip{display:none}@media(max-width:650px){.mobile-filter-tip{display:block;color:var(--muted);font-size:11px;text-align:right;line-height:1;margin-top:-8px}}

/* Diskret, tangentbordsåtkomligt näringsvärde på respektive receptsida. */
.nutrition-details{margin-top:28px;border:1px solid var(--border);border-radius:16px;background:var(--paper);overflow:hidden}
.nutrition-details>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 20px}
.nutrition-details>summary::-webkit-details-marker{display:none}
.nutrition-details>summary strong{font-size:16px;font-weight:750}
.nutrition-details>summary small{display:block;font-size:12px;color:var(--muted);font-weight:450;margin-top:3px}
.nutrition-details>summary:focus-visible{outline:3px solid #cc8963;outline-offset:-3px}
.nutrition-arrow{font-size:24px;color:var(--muted);line-height:1;transition:transform .18s ease}
.nutrition-details[open] .nutrition-arrow{transform:rotate(180deg)}
.nutrition-content{padding:0 20px 20px}
.nutrition-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.nutrition-stat{background:#f5f2eb;border-radius:12px;padding:15px 8px;text-align:center;display:flex;align-items:center;flex-direction:column;gap:2px;min-width:0}
.nutrition-stat>strong{font-size:clamp(17px,2vw,23px);line-height:1.2;color:var(--ink);font-variant-numeric:tabular-nums}
.nutrition-stat>small{font-size:12px;font-weight:600;color:var(--muted)}
.nutrition-stat>span{font-size:11px;color:var(--muted)}
.nutrition-disclaimer{font-size:12px;line-height:1.65;color:var(--muted);margin:15px 0 0}
@media(max-width:520px){.nutrition-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.nutrition-stat{padding:13px 8px}.nutrition-details>summary{padding:16px}.nutrition-content{padding:0 16px 16px}}
@media print{.nutrition-details{border:0;break-inside:avoid}.nutrition-details>summary{padding:6px 0}.nutrition-arrow{display:none}.nutrition-details .nutrition-content{display:block!important;padding:0}.nutrition-grid{grid-template-columns:repeat(4,1fr)}.nutrition-stat{padding:5px}.nutrition-stat strong{font-size:12px}}

/* Inköpsråd visas endast på begäran och stör inte ingredienschecklistan. */
.shopping-details{margin:0 15px 18px;border:1px solid var(--border);background:#f8f6f1;border-radius:12px;overflow:hidden}
.shopping-details>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:650;font-size:13px;padding:12px 14px}
.shopping-details>summary::-webkit-details-marker{display:none}
.shopping-details>summary:focus-visible{outline:3px solid #cc8963;outline-offset:-3px}
.shopping-details[open]>summary>span:last-child{transform:rotate(180deg)}
.shopping-inner{padding:0 14px 14px;color:var(--muted);font-size:12px;line-height:1.65}
.shopping-inner p{margin:0 0 5px}.shopping-inner small{display:block;margin-top:8px;font-size:11px}

kcal":355,"protein":3,"carbs":40,"fat":20,"per":"bit","servings":22,"estimated":true},"shoppingTips":["Kokosmängden 200 g motsvarar ofta en hel påse. Totalt behövs 275 g smör till kakan och toscan."]},{"id":"carbonara","name":"Pasta carbonara","subtitle":"Silkeslen äggsås, guanciale & pecorino","category":"Pasta & pizza","emoji":"🍝","tone":"pasta","badge":"Italiensk klassiker","yieldBase":"4 portioner","yields":[2,0,4,0,8,0],"time":"25–30 min","difficulty":"Medel","temp":"","intro":"Romersk carbonara utan grädde, med fyllig äggula, lagrad ost, knaprigt guanciale och svartpeppar. Tekniken är avgörande för den blanka såsen.","origin":"Egen sammanvägning, inspirerad av Luciano Monosilios metod och klassiska italienska recept. Den exakta versionen är inte separat provlagad. Enklare ersättningar: pancetta eller bacon för guanciale och lagrad parmesan för Pecorino, med tydlig smakskillnad.","groups":[{"title":"Carbonara","items":[{"name":"Spaghetti","qty":320,"unit":"g","extra":"","fixed":""},{"name":"Guanciale","qty":160,"unit":"g","extra":"Om du inte hittar: använd pancetta eller bacon (bacon blir rökigare).","fixed":""},{"name":"Äggulor","qty":5,"unit":"st","extra":"","fixed":""},{"name":"Pecorino Romano, finriven","qty":60,"unit":"g","extra":"Om du inte hittar: välj en lagrad parmesan; smaken blir mildare.","fixed":""},{"name":"Grana Padano, finriven","qty":30,"unit":"g","extra":"","fixed":""},{"name":"Nymalen svartpeppar","qty":null,"unit":"","extra":"","fixed":"1–2 tsk, efter smak"},{"name":"Salt till pastavattnet","qty":null,"unit":"","extra":"","fixed":"En liten mängd"},{"name":"Pastavatten","qty":null,"unit":"","extra":"","fixed":"Ca 1–2 dl, efter behov"}]}],"steps":[{"title":"Förbered","body":"Riv ostarna mycket fint. Skär guanciale i cirka 1 cm tjocka stavar. Lägg äggulorna i en stor värmetålig skål."},{"title":"Stek guanciale","body":"Lägg köttet i en kall stekpanna utan extra fett. Stek på medellåg värme cirka 8–12 minuter tills fettet smält ut och köttet är gyllene. Lyft upp köttet och spara fettet."},{"title":"Gör äggkrämen","body":"Vispa ihop äggulor, ost och svartpeppar. Vispa ner cirka 2 msk avsvalnat guancialefett. Spara resten separat."},{"title":"Koka pastan","body":"Koka spaghettin al dente i lättsaltat vatten, gärna med relativt lite vatten för mer stärkelse. Spara minst 2 dl av pastavattnet."},{"title":"Lösgör krämen","body":"Vispa ner 2–3 msk varmt pastavatten i äggkrämen, lite åt gången, tills den blir smidigare."},{"title":"Vänd ihop","body":"Lägg nykokt pasta och det mesta av guancialen i skålen. Rör kraftigt så att såsen omsluter varje strå."},{"title":"Justera värme och konsistens","body":"Tillsätt varmt pastavatten skedvis. Behövs mer värme: håll skålen över svagt sjudande vatten och rör hela tiden, utan att bottnen vidrör vattnet. Ta bort direkt när såsen är blank och krämig."},{"title":"Servera direkt","body":"Toppa med resterande guanciale, lite extra pecorino och nymalen svartpeppar."}],"tips":[{"title":"Ingen grädde","body":"Krämigheten kommer av en emulsion mellan ägg, ost, fett och pastavatten."},{"title":"Undvik äggröra","body":"Tillsätt inte äggkrämen i en glödhet stekpanna."},{"title":"Finriven ost","body":"Smälter jämnare och minskar risken för klumpar."},{"title":"Rätt såskonsistens","body":"Den ska vara blank och täcka pastan – varken klistrig eller vattnig."}],"sources":[["Luciano Monosilio – La Cucina Italiana","https://www.lacucinaitaliana.it/article/carbonara-trucchi-ricetta-del-re-luciano-monosilio/"],["GialloZafferano – Spaghetti alla Carbonara","https://ricette.giallozafferano.it/Spaghetti-alla-Carbonara.html"]],"tags":["Snabbt","Fläsk & korv","Ost"],"countryCode":"IT","countryName":"Italien","countryFlag":"🇮🇹","countryNote":"Italien – huvudsaklig mattradition för denna version.","nutrition":{"kcal":680,"protein":26,"carbs":58,"fat":38,"per":"portion","servings":4,"estimated":true},"shoppingTips":["Pastan är 320 g – köp en 500 g-förpackning och spara resten torrt. Guanciale kan best cker","body":"Blanda med handvisp eller slickepott. Vispa inte fluffigt."},{"title":"Tillsätt smöret","body":"Rör ner det ljumma smöret."},{"title":"Vänd ner det torra","body":"Sikta i mjöl, kakao, vaniljsocker och salt. Vänd ihop till jämn smet utan att överarbeta."},{"title":"Grädda","body":"Häll i formen. Grädda i mitten cirka 17–20 minuter. Börja kontrollera vid 16 minuter."},{"title":"Ta ut i rätt tid","body":"Kanterna ska ha satt sig och mitten ska fortfarande vara mjuk och dallra försiktigt."},{"title":"Kyl och skär","body":"Låt svalna helt. Kyl gärna 2–4 timmar eller över natten för en tätare, segare konsistens."}],"tips":[{"title":"Bra kakao","body":"En god osötad kakao är den viktigaste smakråvaran."},{"title":"Övergrädda inte","body":"Någon minuts skillnad kan avgöra om kakan blir torr."},{"title":"Kyl den","body":"Kylning ger en fastare och lättare uppskärbar konsistens."},{"title":"Servering","body":"Lättvispad, osötad grädde och färska hallon balanserar sötman."}],"sources":[["ICA – Buffélabbets Bästa kladdkakan","https://www.ica.se/recept/basta-kladdkakan-722753/"],["ICA – Klassisk kladdig kladdkaka","https://www.ica.se/recept/kladdig-kladdkaka-722982/"]],"tags":["Choklad","Ugn"],"countryCode":"SE","countryName":"Sverige","countryFlag":"🇸🇪","countryNote":"Sverige – huvudsaklig mattradition för denna version.","nutrition":{"kcal":250,"protein":4,"carbs":30,"fat":13,"per":"bit","servings":12,"estimated":true},"shoppingTips":["Ingredienserna är vanliga skafferivaror. 150 g smör kan tas från ett vanligt smörpaket; ingen särskild förpackning behöver köpas."]},{"id":"delicatobollar","name":"Delicatobollar","subtitle":"Lena chokladbollar med mocka & kokostäcke","category":"Bakverk & fika","emoji":"🍬","tone":"truffle","badge":"Copycat","yieldBase":"18 st","yields":[9,0,18,0,36,0],"time":"25 min + kylning","difficulty":"Enkel","temp":"Ingen ugn","intro":"Lyxigt lena, Delicato-inspirerade chokladbollar med riktig choklad. Obs: den köpta originalbollen saknar separat chokladskal; välj kokosrullning utan överdrag om du prioriterar originalkänslan.","origin":"Camilla Hamids hemmagjorda Delicatobollar är en lyxig, chokladtäckt tolkning – inte en exakt kopia. Delicatos original är en mjuk, kokosrullad mockaboll UTAN separat chokladskal. För en mer originalnära variant kan du utelämna chokladöverdraget och rulla direkt i kokos. Grundsmeten innehåller dock mer smör och riktig choklad än originalet.","groups":[{"title":"Bollarnas smet","items":[{"name":"Mjölkchoklad","qty":100,"unit":"g","extra":"","fixed":""},{"name":"Havregryn","qty":4,"unit":"dl","extra":"ca 140 g","fixed":""},{"name":"Rumsvarmt smör","qty":150,"unit":"g","extra":"","fixed":""},{"name":"Kakao","qty":0.5,"unit":"dl","extra":"","fixed":""},{"name":"Florsocker","qty":1.5,"unit":"dl","extra":"","fixed":""},{"name":"Kallt starkt bryggkaffe","qty":2,"unit":"msk","extra":"","fixed":""},{"name":"Vaniljsocker","qty":2,"unit":"tsk","extra":"","fixed":""}]},{"title":"Överdrag","items":[{"name":"Mörk choklad till överdrag (enbart lyxvarianten)","qty":250,"unit":"g","extra":"","fixed":""},{"name":"Rapsolja till chokladöverdrag (valfritt)","qty":2,"unit":"tsk","extra":"","fixed":""},{"name":"Riven kokos","qty":null,"unit":"","extra":"","fixed":"Ca 1–2 dl"}]}],"steps":[{"title":"Smält chokladen","body":"Smält mjölkchokladen försiktigt i mikron eller över vattenbad. Låt svalna till ljummen."},{"title":"Mixa smeten helt slät","body":"Mixa havre, smör, kakao, florsocker, kaffe, vaniljsocker och mjölkchoklad i matberedare tills smeten är len utan tydliga havrebitar."},{"title":"Kyl smeten","body":"Ställ kallt i minst 30 minuter så att den går att forma."},{"title":"Forma bollar","body":"Gör 18 jämna bollar eller lätt kupolformade bitar."},{"title":"Kyl igen","body":"Ställ bollarna kallt minst en timme tills de är fasta."},{"title":"Gör chokladöverdrag","body":"Smält mörk choklad försiktigt och rör ner rapsolja. Låt svalna lite."},{"title":"Doppa och strö kokos","body":"Doppa kalla bollar med gaffel, låt överflödig choklad rinna av och strö kokos direkt."},{"title":"Välj vilken Delicatoboll du vill ha","body":"För en mer originalnära kokosboll: hoppa över chokladöverdraget och rulla de kalla bollarna direkt i kokos. För en lyxigare chokladboll: följ nästa steg och doppa i choklad."},{"title":"Låt stelna","body":"Kyl tills chokladen stelnat. Ta gärna ut 10–15 minuter före servering."}],"tips":[{"title":"Mixa länge","body":"Den lena massan skiljer dessa från vanliga grova chokladbollar."},{"title":"Florsocker","body":"Ger mindre risk för sockerkorn."},{"title":"Kaffe","body":"Viktigt för den typiska mockatonen."},{"title":"Inte exakt Delicato","body":"Delicatos original använder bland annat vegetabiliskt fett och en annan typ av överdrag."},{"title":"Originalet saknar separat chokladskal","body":"Delicatos original är en mjuk kokosrullad mockaboll; chokladöverdrag är en extra lyxvariant."}],"sources":[["Camilla Hamid – Hemmagjorda Delicatobollar","https://mykitchenstories.se/hemmagjorda-delicatobollar/"],["Delicato – Originalprodukt","https://www.delicato.se/vara-bakverk/Kondisbitar/Delicatoboll-6-p---1363"],["Delicato – originalbollen","https://www.delicato.se/vara-bakverk/Kondisbitar/Delicatoboll-6-p---1363"]],"tags":["Choklad","Snabbt"],"countryCode":"SE","countryName":"Sverige","countryFlag":"🇸🇪","countryNote":"Sverige – huvudsaklig mattradition för denna version.","nutrition":{"kcal":230,"protein":3,"carbs":22,"fat":14,"per":"styck","servings":18,"estimated":true},"shoppingTips":["Mjölkchokladen är 100 g – en vanlig chokladkaka. Överdragets 250 g choklad är valfritt och ska inte handlas om du väljer kokosvarianten."]},{"id":"korvstroganoff","name":"Korvstroganoff","subtitle":"Brynt falukorv i len tomat- & gräddsås","category":"Svensk husman","emoji":"🥘","tone":"stroganoff","badge":"Vardagsfavorit","yieldBase":"4 portioner","yields":[2,0,4,0,8,0],"time":"25–30 min","difficulty":"Enkel","temp":"","intro":"En extra god svensk korvstroganoff med stekyta på korven och en balanserad sås av tomatpuré, grädde, crème fraiche, dijon och soja.","origin":"Egen sammanvägning av populära svenska recept, bland annat ICA. Kombinationen är inte separat provlagad. Paprikapulver och persilja är frivilligt; smakbasen är brynt falukorv, lök, tomatpuré, grädde, soja och dijon.","groups":[{"title":"Korvstroganoff","items":[{"name":"Falukorv","qty":600,"unit":"g","extra":"","fixed":""},{"name":"Gul lök, stor","qty":1,"unit":"st","extra":"","fixed":""},{"name":"Smör","qty":1,"unit":"msk","extra":"","fixed":""},{"name":"Tomatpuré","qty":3,"unit":"msk","extra":"","fixed":""},{"name":"Vispgrädde","qty":2,"unit":"dl","extra":"","fixed":""},{"name":"Crème fraiche, 34 %","qty":1,"unit":"dl","extra":"","fixed":""},{"name":"Vatten","qty":null,"unit":"","extra":"","fixed":"½–1 dl, efter behov"},{"name":"Japansk soja","qty":2,"unit":"tsk","extra":"","fixed":""},{"name":"Dijonsenap","qty":1,"unit":"tsk","extra":"","fixed":""},{"name":"Paprikapulver","qty":0.5,"unit":"tsk","extra":"","fixed":""},{"name":"Nymalen svartpeppar","qty":null,"unit":"","extra":"","fixed":"Efter smak"},{"name":"Salt","qty":null,"unit":"","extra":"","fixed":"Vid behov"}]},{"title":"Till servering","items":[{"name":"Ris, okokt","qty":3,"unit":"dl","extra":"","fixed":""},{"name":"Saltgurka","qty":null,"unit":"","extra":"","fixed":"Efter smak"},{"name":"Färsk persilja","qty":null,"unit":"","extra":"","fixed":"Valfritt"}]}],"steps":[{"title":"Skär korv och lök","body":"Skär falukorv i stavar, cirka 1 cm tjocka och 4–5 cm långa. Finhacka löken."},{"title":"Bryn korven","body":"Stek i två omgångar i hälften av smöret på medelhög värme, cirka 3–4 minuter per omgång, tills den blir gyllenbrun. Lyft ur."},{"title":"Mjukstek löken","body":"Sänk värmen, tillsätt resten av smöret och stek löken 4–5 minuter tills den är mjuk och lite gyllene."},{"title":"Fräs tomatpurén","body":"Tillsätt tomatpuré och paprikapulver. Fräs försiktigt 1–2 minuter."},{"title":"Gör såsen","body":"Rör ner grädde, crème fraiche, cirka ½ dl vatten, soja och dijonsenap. Skrapa pannans botten och sjud cirka 3 minuter."},{"title":"Värm korven i såsen","body":"Vänd ner den brynta korven och sjud lugnt 5–7 minuter. Späd med vatten om såsen blir för tjock."},{"title":"Smaka av","body":"Justera svartpeppar, senap och eventuellt salt. Korv och soja är redan salta."},{"title":"Servera","body":"Koka riset enligt förpackningen och servera med saltgurka och eventuellt persilja."}],"tips":[{"title":"Välj god falukorv","body":"Korvens kvalitet märks tydligt i en enkel rätt."},{"title":"Stek i omgångar","body":"För mycket korv i pannan ångar snarare än bryner."},{"title":"Grädde + crème fraiche","body":"Ger både rund fyllighet och lätt syra."},{"title":"Inget långkok","body":"När korven är varm och såsen har gått ihop är rätten klar."}],"sources":[["ICA – Korvstroganoff med ris","https://www.ica.se/recept/korvstroganoff-med-ris-533512/"],["Per Morberg – Köket","https://www.koket.se/per-morbergs-korvstroganoff"]],"tags":["Snabbt","Fläsk & korv"],"countryCode":"SE","countryName":"Sverige","countryFlag":"🇸🇪","countryNote":"Svensk husmansvariant av korvrätt med internationella influenser.","nutrition":{"kcal":890,"protein":25,"carbs":65,"fat":59,"per":"portion","servings":4,"estimated":true},"shoppingTips":["Det finns falukorv i 600 g-förpackning. Hittar du bara 550 g kan du använda hela korven med samma sås; blir skillnaden större, frys överbliven korv."]},{"id":"loaded-fries","name":"Loaded fries","subtitle":"Krispiga pommes, cheddarostsås & bacon","category":"Snabbmat & street food","emoji":"🍟","tone":"fries","badge":"Street food","yieldBase":"4 portioner","yields":[2,0,4,0,8,0],"time":"30–40 min","difficulty":"Enkel","temp":"Enligt pommesförpackning","intro":"Amerikanskinspirerade loaded fries med krispiga pommes, varm hemgjord cheddarostsås, bacon, jalapeños, salladslök och syrlig vitlöksdressing.","origin":"Egen kombination från amerikanska loaded fries-recept och svenska ostsåsvarianter. Exakt kombination är inte separat provlagad. Vitlöksdressing, rödlök och örter är extra topping och kan uteslutas för en enklare version med pommes, ostsås, bacon, jalapeño och salladslök.","groups":[{"title":"Pommes & bacon","items":[{"name":"Frysta pommes, gärna crinkle cut","qty":1000,"unit":"g","extra":"En 1 kg-påse – tillaga hela påsen.","fixed":""},{"name":"Bacon","qty":150,"unit":"g","extra":"","fixed":""},{"name":"Rökt paprikapulver","qty":0.5,"unit":"tsk","extra":"","fixed":""},{"name":"Vitlökspulver","qty":0.5,"unit":"tsk","extra":"","fixed":""}]},{"title":"Cheddarostsås","items":[{"name":"Lagrad cheddar från hel bit","qty":150,"unit":"g","extra":"","fixed":""},{"name":"Smör","qty":25,"unit":"g","extra":"","fixed":""},{"name":"Vetemjöl","qty":1,"unit":"msk","extra":"","fixed":""},{"name":"Standardmjölk, 3 %","qty":1.75,"unit":"dl","extra":"","fixed":""},{"name":"Nymalen svartpeppar","qty":null,"unit":"","extra":"","fixed":"Efter smak"}]},{"title":"Vitlöksdressing","items":[{"name":"Gräddfil","qty":1,"unit":"dl","extra":"","fixed":""},{"name":"Majonnäs","qty":0.5,"unit":"dl","extra":"","fixed":""},{"name":"Vitlök","qty":0.5,"unit":"klyfta","extra":"","fixed":""},{"name":"Limejuice","qty":1,"unit":"tsk","extra":"","fixed":""},{"name":"Salt och svartpeppar","qty":null,"unit":"","extra":"","fixed":"Efter smak"}]},{"title":"Toppings","items":[{"name":"Inlagd jalapeño","qty":null,"unit":"","extra":"","fixed":"½–1 dl"},{"name":"Salladslök","qty":2,"unit":"st","extra":"","fixed":""},{"name":"Rödlök","qty":0.5,"unit":"st","extra":"liten","fixed":""},{"name":"Färsk koriander eller persilja","qty":null,"unit":"","extra":"","fixed":"Valfritt"}]}],"steps":[{"title":"Tillaga pommesen","body":"Grädda direkt från frysen enligt förpackningen, helst utspridda på stor plåt. Vänd halvvägs och ge dem ordentlig gyllenbrun färg. Krydda lätt med rökt paprikapulver och vitlökspulver."},{"title":"Stek bacon","body":"Skär i små bitar, stek knaprigt och låt rinna av på hushållspapper."},{"title":"Gör cheddarostsåsen","body":"Riv cheddar fint. Smält smör på låg värme och vispa ner mjöl. Fräs 1 minut. Tillsätt mjölk lite i taget och sjud 1–2 minuter tills såsen tjocknar. Ta från värmen och rör ner osten i omgångar. Späd med mjölk vid behov. Koka inte efter att osten smält."},{"title":"Blanda dressing","body":"Rör ihop gräddfil, majonnäs, finriven vitlök och limejuice. Smaka av med salt och peppar."},{"title":"Hacka toppings","body":"Skiva salladslök tunt, finhacka rödlök och låt jalapeñon rinna av."},{"title":"Montera precis före servering","body":"Sprid de varma pommesen på ett fat. Ringla över halva ostsåsen, lägg på bacon, jalapeño och rödlök. Avsluta med mer ostsås, vitlöksdressing och salladslök. Servera direkt med resten av såserna bredvid."}],"tips":[{"title":"Sås sist","body":"Montera precis före servering för att inte få mjuka pommes."},{"title":"Riv egen ost","body":"Färdigriven ost kan ge mindre slät sås."},{"title":"Syra behövs","body":"Jalapeño och lime hjälper till att balansera ost och bacon."},{"title":"Inte för mycket topping","body":"Hellre luftigt och krispigt än en blöt hög."}],"sources":[["Spend With Pennies – Loaded Cheese Fries","https://www.spendwithpennies.com/loaded-cheese-fries/"],["ICA – Dirty Fries med ostsås","https://www.ica.se/recept/dirty-fries-med-ostsas-729582/"]],"tags":["Potatis","Ost"],"countryCode":"US","countryName":"USA","countryFlag":"🇺🇸","countryNote":"Amerikansk loaded-fries-/cheese-fries-tradition; exakt upphov är omdiskuterat.","nutrition":{"kcal":995,"protein":26,"carbs":95,"fat":57,"per":"portion","servings":4,"estimated":true},"shoppingTips":["Pommesmängden motsvarar nu en hel 1 kg-påse. Bacon 150 g kan ersättas med en 140 g-förpackning utan att receptet behöver justeras."]},{"id":"flygande-jacob","name":"Flygande Jacob","subtitle":"Saftig kyckling, len chilisås, bacon & jordnötter","category":"Svensk husman","emoji":"🍗","tone":"chicken","badge":"Svensk klassiker","yieldBase":"4 portioner","yields":[2,0,4,0,8,0],"time":"45–50 min","difficulty":"Enkel","temp":"225°C","intro":"En klassisk svensk kycklinggratäng med banan, krämig tomatchilisås och knaprigt bacon. Jordnötter och bacon läggs på sist för bästa konsistens.","origin":"Egen välavvägd version som utgår från de klassiska recepten hos ICA, Arla och Köket.se samt originalets smakprofil från 1976. Denna exakta kombination är inte separat provlagad eller blindtestad. Färdiglagad grillad kyckling är ett snabbt alternativ; då är målet att gratängen blir ordentligt genomvarm snarare än att tillaga rå kyckling i formen.","groups":[{"title":"Gratängen","items":[{"name":"Benfri kycklinglårfilé","qty":700,"unit":"g","extra":"","fixed":""},{"name":"Bacon","qty":140,"unit":"g","extra":"","fixed":""},{"name":"Bananer, mogna men fasta","qty":2,"unit":"st","extra":"","fixed":""},{"name":"Vispgrädde, 36–40 %","qty":3,"unit":"dl","extra":"","fixed":""},{"name":"Tomatbaserad chilisås (Heinz-typ)","qty":1,"unit":"dl","extra":"","fixed":""},{"name":"Salt","qty":0.5,"unit":"tsk","extra":"justera efter smak","fixed":""},{"name":"Nymalen svartpeppar","qty":null,"unit":"","extra":"","fixed":"Efter smak"},{"name":"Neutral olja","qty":1,"unit":"msk","extra":"","fixed":""},{"name":"Italiensk salladskrydda","qty":null,"unit":"","extra":"","fixed":"½ tsk, valfritt"}]},{"title":"Topping och servering","items":[{"name":"Rostade saltade jordnötter","qty":1,"unit":"dl","extra":"","fixed":""},{"name":"Basmatiris, okokt","qty":3,"unit":"dl","extra":"","fixed":""},{"name":"Grönsallad","qty":null,"unit":"","extra":"","fixed":"Till servering"}]}],"steps":[{"title":"Sätt ugnen på 225°C","body":"Sätt ugnen på 225°C över- och undervärme. Koka riset enligt anvisningen på förpackningen så att det blir klart samtidigt med gratängen."},{"title":"Stek baconet knaprigt","body":"Skär baconet i små bitar. Stek på medelvärme tills bitarna är ordentligt knapriga. Lyft upp på hushållspapper. Spara baconet till servering så det förblir krispigt."},{"title":"Bryn kycklingen","body":"Putsa och skär kycklinglårfilén i större bitar. Bryn i lite olja i två omgångar i stekpanna på medelhög värme tills bitarna får fin yta. Krydda med salt och svartpeppar. De behöver inte vara helt färdiga ännu, eftersom de ska in i ugnen."},{"title":"Bygg gratängen","body":"Lägg kycklingbitarna i en ugnsform, cirka 20 × 28 cm. Skala och skär bananerna i sneda, relativt tjocka skivor och fördela ovanpå kycklingen."},{"title":"Gör den krämiga chilisåsen","body":"Vispa grädden lätt så att den precis börjar tjockna. Vänd försiktigt ner tomatbaserad chilisås och eventuellt lite italiensk salladskrydda. Smaka av. Använd inte thai sweet chili – den ger en annan, mycket sötare smak."},{"title":"Gratinera","body":"Bred chiligrädden jämnt över kyckling och banan. Grädda mitt i ugnen 15–20 minuter tills det bubblar och ytan fått fin färg. Kontrollera att de största kycklingbitarna är genomlagade, minst 74°C i mitten."},{"title":"Toppa när rätten är klar","body":"Ta ut formen och låt vila ett par minuter. Fördela knaperstekt bacon och rostade saltade jordnötter över gratängen precis före servering."},{"title":"Servera","body":"Servera direkt med nykokt basmatiris och en enkel grönsallad. Lägg gärna extra jordnötter i en skål på bordet."}],"tips":[{"title":"Välj rätt chilisås","body":"Använd den milda, tomatbaserade chilisåsen som brukar stå nära ketchup, inte söt thailändsk chilisås."},{"title":"Kycklinglårfilé ger marginal","body":"Lårfilé är förlåtande och behåller saftigheten bättre än bröstfilé under ugnsgratinerningen. Kontrollera ändå innertemperaturen."},{"title":"Inte för mogen banan","body":"En lagom mogen och fast banan ger tydliga skivor och sötma utan att lösas upp i såsen."},{"title":"Spara bacon och jordnötter","body":"De förlorar snabbt sin krispighet om de bakas under den varma gräddsåsen."},{"title":"Lättvispad grädde","body":"Den klassiska metoden att vispa grädden lätt ger ett jämnt, fylligt täcke. Blanda i chilisåsen med försiktiga tag."}],"sources":[["ICA – Flygande Jacob, klassikern","https://www.ica.se/recept/flygande-jacob-717569/"],["ICA – Flygande Jakob med vispad grädde","https://www.ica.se/recept/flygande-jakob-722383/"],["Arla – Flygande Jakob","https://www.arla.se/recept/flygande-jakob/"],["Köket.se – Flygande Jakob","https://www.koket.se/flygande-jakob"]],"tags":["Kyckling","Ugn","Festmat"],"countryCode":"SE","countryName":"Sverige","countryFlag":"🇸🇪","countryNote":"Sverige – huvudsaklig mattradition för denna version.","nutrition":{"kcal":1055,"protein":47,"carbs":70,"fat":65,"per":"portion","servings":4,"estimated":true},"shoppingTips":["700 g kycklinglårfilé finns som fryst förpackning. Bacon 140 g motsvarar en vanlig liten förpackning."]},{"id":"lasagne","name":"Lasagne","subtitle":"Långkokt ragù, len béchamel & gyllene osttäcke","category":"Pasta & pizza","emoji":"🍲","tone":"lasagne","badge":"Italiensk klassiker","yieldBase":"6–8 portioner","yields":[3,4,6,8,12,16],"time":"Ca 4 timmar","difficulty":"Medel","temp":"190°C","intro":"En fyllig lasagne alla bolognese med långkokt köttsås, silkeslen béchamel och tydliga lager. Låt lasagnen vila innan servering så blir den saftig och håller ihop.","origin":"Egen anpassad kombination inspirerad av RecipeTin Eats, Serious Eats och Bolognas traditionella lasagne. De exakta proportionerna har inte separat provlagats. Mozzarella är valfritt; för ett enklare mer klassiskt osttäcke räcker parmesan. Vinet kan ersättas med mild buljong om nödvändigt.","groups":[{"title":"Långkokt ragù bolognese","items":[{"name":"Nötfärs, gärna 15–20 % fett","qty":800,"unit":"g","extra":"En vanlig svensk 800 g-förpackning.","fixed":""},{"name":"Pancetta, helst orökt","qty":125,"unit":"g","extra":"","fixed":""},{"name":"Gul lök, stor","qty":1,"unit":"st","extra":"","fixed":""},{"name":"Morot, medelstor","qty":1,"unit":"st","extra":"","fixed":""},{"name":"Stjälkselleri","qty":1,"unit":"stjälk","extra":"","fixed":""},{"name":"Olivolja","qty":1,"unit":"msk","extra":"","fixed":""},{"name":"Tomatpassata","qty":400,"unit":"g","extra":"","fixed":""},{"name":"Tomatpuré","qty":2,"unit":"msk","extra":"","fixed":""},{"name":"Torrt vitt vin","qty":1.5,"unit":"dl","extra":"","fixed":""},{"name":"Standardmjölk, 3 %","qty":2,"unit":"dl","extra":"","fixed":""},{"name":"Vatten eller mild köttbuljong","qty":null,"unit":"","extra":"","fixed":"2–3 dl, efter behov"},{"name":"Salt och nymalen svartpeppar","qty":null,"unit":"","extra":"","fixed":"Efter smak"}]},{"title":"Béchamelsås","items":[{"name":"Standardmjölk, 3 %","qty":8,"unit":"dl","extra":"","fixed":""},{"name":"Smör","qty":60,"unit":"g","extra":"","fixed":""},{"name":"Vetemjöl","qty":60,"unit":"g","extra":"ca 1 dl","fixed":""},{"name":"Nyriven muskotnöt","qty":1,"unit":"krm","extra":"","fixed":""},{"name":"Salt och vitpeppar","qty":null,"unit":"","extra":"","fixed":"Efter smak"}]},{"title":"Montering och gratinering","items":[{"name":"Lasagneplattor som inte behöver förkokas","qty":225,"unit":"g","extra":"anpassa till formens storlek","fixed":""},{"name":"Parmigiano Reggiano","qty":100,"unit":"g","extra":"","fixed":""},{"name":"Mozzarella, väl avrunnen","qty":125,"unit":"g","extra":"","fixed":""},{"name":"Smör till formen","qty":null,"unit":"","extra":"","fixed":"Lite"}]}],"steps":[{"title":"Finhacka soffritton","body":"Hacka lök, morot och selleri mycket fint. Skär pancettan i små tärningar. De små grönsaksbitarna ska smälta ihop med köttet under långkoket."},{"title":"Bryn nötfärsen","body":"Värm olivolja i en stor tjockbottnad gryta på medelhög värme. Bryn köttet i två omgångar så att det får stekyta. Lyft upp det och lägg åt sidan."},{"title":"Stek pancetta och grönsaker","body":"Sänk värmen. Stek pancettan 5 minuter så att fettet smälter ut. Tillsätt grönsakerna och stek 10–12 minuter tills de mjuknat utan att brännas."},{"title":"Tillsätt tomatpuré och vin","body":"Lägg tillbaka köttet. Rör i tomatpurén och låt fräsa 1–2 minuter. Häll i vitt vin, skrapa bottnen och reducera tills det mesta av vätskan försvunnit."},{"title":"Långkoka ragùn","body":"Tillsätt passata och 2 dl buljong eller vatten. Sjud mycket försiktigt 2½–3 timmar med locket lite på glänt. Häll i mjölken efter ungefär 1 timme. Rör emellanåt, späd vid behov och smaka av. Ragùn ska vara fyllig men fortfarande saftig nog för pastaplattorna."},{"title":"Gör béchamelsåsen","body":"Smält 60 g smör i en kastrull. Vispa ner 60 g mjöl och låt fräsa försiktigt 1 minut. Vispa gradvis i 8 dl mjölk. Sjud under omrörning i 5–7 minuter tills såsen tjocknat men fortfarande går lätt att hälla. Krydda med muskotnöt, salt och vitpeppar."},{"title":"Förbered montering","body":"Sätt ugnen på 190°C över- och undervärme. Smörj en cirka 22 × 30 cm stor form, minst 6 cm djup. Riv parmesanosten och låt mozzarellan rinna av ordentligt."},{"title":"Bygg lasagnen","body":"Lägg ett tunt lager ragù och béchamel i botten. Lägg på ett lager lasagneplattor och sedan en tredjedel av resten av ragùn, lite béchamel och parmesan. Upprepa tills du har fyra lager plattor och tre lager fyllning mellan dem. Se till att plattornas kanter täcks av sås."},{"title":"Avsluta med osttäcke","body":"Täck översta lagret plattor med resten av béchamelsåsen. Fördela mozzarella och återstående parmesan på toppen."},{"title":"Gratinera","body":"Grädda mitt i ugnen cirka 35–45 minuter tills lasagnen bubblar, har fått gyllene yta och plattorna är mjuka rakt igenom. Lägg på folie om ytan blir för mörk. Följ lasagneplattornas anvisningar om de kräver annan tillagningstid."},{"title":"Låt vila och servera","body":"Låt lasagnen vila i minst 20 minuter innan du skär upp den. Servera gärna med en frisk grönsallad."}],"tips":[{"title":"Långkoket är smaken","body":"2½–3 timmar på låg värme gör ragùn djup och sammanhängande. Det är här den stora skillnaden mot en snabb lasagne skapas."},{"title":"Béchamel istället för crème fraiche","body":"En mjuk béchamel gör de många lagren silkeslena och harmonierar med köttsåsen."},{"title":"Var försiktig med tomaterna","body":"Lasagne alla bolognese ska vara köttdriven snarare än dränkt i tomatsås."},{"title":"Täcka pastan helt","body":"Torra plattor behöver fukt på båda sidor och även utmed formens kanter för att mjukna ordentligt."},{"title":"Vila före uppskärning","body":"20–25 minuter gör det mycket lättare att få tydliga bitar utan att den krämiga såsen rinner ut."},{"title":"Förbered gärna dagen innan","body":"Ragùn kan lagas i förväg, kylas snabbt och förvaras kallt till nästa dag. Då går monteringen snabbare."}],"sources":[["RecipeTin Eats – Lasagna","https://www.recipetineats.com/lasagna/"],["Serious Eats – Lasagna Bolognese","https://www.seriouseats.com/lasagna-bolognese-al-forno-recipe"],["ICA – Klassisk lasagne","https://www.ica.se/recept/klassisk-lasagne-679675/"]],"tags":["Köttfärs","Ugn","Ost"],"countryCode":"IT","countryName":"Italien","countryFlag":"🇮🇹","countryNote":"Italien – huvudsaklig mattradition för denna version.","nutrition":{"kcal":880,"protein":51,"carbs":51,"fat":52,"per":"portion","servings":6,"estimated":true},"shoppingTips":["Nötfärsen är nu 800 g och passar en vanlig 800 g-förpackning. Passatan är 400 g – en 390 eller 400 g-kartong fungerar lika bra."]},{"id":"ost-skinksas","name":"Pasta med ost- och skinksås","subtitle":"Rökt skinka, lagrad prästost & silkeslen sås","category":"Pasta & pizza","emoji":"🧀","tone":"creamy","badge":"Krämig vardagsfavorit","yieldBase":"4 portioner","yields":[2,0,4,0,8,0],"time":"25–30 min","difficulty":"Enkel","temp":"","intro":"En klassisk svensk pastafavorit i extra krämig tappning: mild rökt skinka, lagrad prästost, lite parmesan och färsk gräslök. Ostsåsen är stabil och len utan att bli tung eller grynig.","origin":"Egen sammansättning inspirerad av ICA:s högt betygsatta krämiga ost- och skinksås, Sara Begners variant hos Coop och Arlas skinksås. Teknik för mjuk ostemulsion från The Kitchn. Exakt version är ännu inte provlagad. Dijon och extra parmesan kan uteslutas om du önskar ännu enklare vardagsversion. Lägg osten i såsen först när kastrullen tagits från plattan.","groups":[{"title":"Pasta och skinka","items":[{"name":"Tagliatelle eller fusilli, okokt","qty":350,"unit":"g","extra":"","fixed":""},{"name":"Rökt skinka, strimlad","qty":300,"unit":"g","extra":"","fixed":""},{"name":"Gul lök, medelstor","qty":1,"unit":"st","extra":"","fixed":""},{"name":"Smör","qty":25,"unit":"g","extra":"","fixed":""}]},{"title":"Ostsås","items":[{"name":"Vispgrädde, 36–40 %","qty":2,"unit":"dl","extra":"","fixed":""},{"name":"Standardmjölk, 3 %","qty":2,"unit":"dl","extra":"","fixed":""},{"name":"Vetemjöl","qty":1.5,"unit":"msk","extra":"","fixed":""},{"name":"Lagrad prästost, finriven","qty":120,"unit":"g","extra":"","fixed":""},{"name":"Parmesan, finriven","qty":20,"unit":"g","extra":"","fixed":""},{"name":"Dijonsenap","qty":0.5,"unit":"tsk","extra":"valfritt men gott","fixed":""},{"name":"Nymalen svartpeppar","qty":null,"unit":"","extra":"","fixed":"Efter smak"},{"name":"Salt","qty":null,"unit":"","extra":"","fixed":"Bara vid behov"},{"name":"Pastavatten","qty":null,"unit":"","extra":"","fixed":"0,5–1 dl, efter behov"}]},{"title":"Till servering","items":[{"name":"Färsk gräslök","qty":10,"unit":"g","extra":"","fixed":""},{"name":"Nymalen svartpeppar","qty":null,"unit":"","extra":"","fixed":"Lite extra"},{"name":"Tomatsallad eller gröna ärtor","qty":null,"unit":"","extra":"","fixed":"Valfritt tillbehör"}]}],"steps":[{"title":"Förbered råvarorna","body":"Finhacka löken, skär skinkan i strimlor, riv prästosten och parmesanen mycket fint och finhacka gräslöken."},{"title":"Koka pastan","body":"Koka pastan i lättsaltat vatten tills den är strax före al dente. Spara minst 1 dl pastavatten. Såsen kan du laga medan pastan kokar."},{"title":"Mjuka upp löken","body":"Smält 25 g smör på medellåg värme i en rymlig stekpanna eller kastrull. Fräs löken försiktigt cirka 4–5 minuter tills den är mjuk och söt men inte brynt."},{"title":"Gör den lena såsbasen","body":"Strö 1½ msk vetemjöl över löken och rör omkring 1 minut. Häll i mjölken lite i taget under vispning och tillsätt sedan grädden. Låt sjuda försiktigt 3–5 minuter tills såsen börjar tjockna och mjölsmaken försvunnit."},{"title":"Smält ner osten varsamt","body":"Ta pannan från värmen. Rör i prästost och parmesan i små omgångar tills de smält till en len sås. Tillsätt valfritt ½ tsk dijonsenap och svartpeppar. Låt inte ostsåsen koka efter detta – då kan den bli grynig."},{"title":"Värm skinkan","body":"Vänd ner den strimlade rökta skinkan och låt den bli varm i den färdiga såsen på mycket låg värme. Skinkan behöver inte stekas hårt och riskerar annars att bli torr."},{"title":"Vänd ihop med pastan","body":"Lägg den avrunna pastan i såsen och vänd runt tills den täcks jämnt. Tillsätt lite sparat pastavatten om såsen är för tjock; den ska vara mjuk och blank, inte stabbig. Smaka av och salta bara om det behövs."},{"title":"Servera direkt","body":"Fördela pastan på varma tallrikar. Toppa med gräslök och extra svartpeppar. En enkel tomatsallad eller lite gröna ärtor vid sidan tillför friskhet."}],"tips":[{"title":"Smält osten utanför värmen","body":"Hög värme är vanligaste orsaken till grynig ostsås. Riv osten fint och rör ner den efter att pannan tagits från värmen."},{"title":"Prästost + parmesan","body":"Prästosten ger svensk klassisk ostsmak, och lite parmesan ger extra umami utan att helt ta över."},{"title":"Välj bra rökt skinka","body":"Färdigstrimlad rökt skinka fungerar, men en god skinka från delikatessdisken kan lyfta hela rätten. Undvik alltför salt skinka."},{"title":"Lägg pastan i såsen","body":"Blanda den nykokta pastan med såsen i pannan. Det fördelar smaken jämnt och pastavattnet hjälper konsistensen."},{"title":"Dijon är valfritt","body":"Bara ½ tsk ger lite syra som balanserar fett och sälta utan att såsen börjar smaka senap."},{"title":"Grönsaker vid sidan","body":"Gröna ärtor, broccoli eller en syrlig tomatsallad är goda komplement. Behåll själva ost- och skinksåsen enkel."}],"sources":[["ICA – Pasta med krämig ost- och skinksås","https://www.ica.se/recept/pasta-med-kramig-ost-och-skinksas-725815/"],["Coop – Pasta med ost- och skinksås","https://www.coop.se/recept/pasta-med-ost-och-skinksas/"],["Arla – Skinksås","https://www.arla.se/recept/skinksas/"],["The Kitchn – Cheese Sauce","https://www.thekitchn.com/cheese-sauce-recipe-23198155"]],"tags":["Ost","Fläsk & korv"],"countryCode":"SE","countryName":"Sverige","countryFlag":"🇸🇪","countryNote":"Svensk vardagsvariant av pasta med ost- och skinksås.","nutrition":{"kcal":810,"protein":38,"carbs":72,"fat":41,"per":"portion","servings":4,"estimated":true},"shoppingTips":["350 g pasta tas ur en vanlig 500 g-förpackning. Skinka kan köpas som cirka 300 g i lösvikt eller i flera mindre förpackningar."]},{"id":"chili-con-carne","name":"Chili con carne","subtitle":"Mustig nötfärschili med bönor och mild chipotle","category":"Världens kök","emoji":"🌶️","tone":"ragu","badge":"Långkok","yieldBase":"4 portioner","yields":[2,3,4,6,8,12],"time":"Ca 1 tim 45 min","difficulty":"Enkel–medel","temp":"Sjudning","intro":"En fyllig Tex-Mex-inspirerad chili med brynt färs, bönor och balanserad hetta. Extra kryddor är frivilliga; det viktiga är riktigt bra bryning och försiktig sjudning.","origin":"Egen vardagsanpassad variant med inspiration från RecipeTin Eats, Good Food och Serious Eats. Inte separat smaktestad. Chipotle kan ersättas med lite rökt paprika och valfri chili.","groups":[{"title":"Kött, grönsaker och bönor","items":[{"name":"Nötfärs, gärna 15–20 % fett","qty":500,"unit":"g","extra":"En vanlig 500 g-förpackning.","fixed":""},{"name":"Gul lök","qty":1,"unit":"st","extra":"","fixed":""},{"name":"Vitlöksklyftor","qty":3,"unit":"st","extra":"","fixed":""},{"name":"Röd paprika","qty":1,"unit":"st","extra":"","fixed":""},{"name":"Neutral olja","qty":1,"unit":"msk","extra":"","fixed":""},{"name":"Kidneybönor, avrunnen vikt","qty":230,"unit":"g","extra":"ca 1 burk","fixed":""},{"nam vid behov."},{"title":"Bönor sist","body":"Tillsätt båda bönsorterna när cirka 15–20 minuter återstår. Koka samtidigt riset. Chilin ska vara tjock men saftig."},{"title":"Smaka av och servera","body":"Avsluta med limejuice eller lite vinäger, salt och peppar. Servera med ris, gräddfil och gärna cheddar."}],"tips":[{"title":"Bryn i omgångar","body":"Färsen ska få rostad smak – inte bara ångkoka."},{"title":"Chipotle är frivilligt","body":"Lite rökt paprika och vanlig chili fungerar också från vilken svensk matbutik som helst."},{"title":"Bönor mot slutet","body":"De behåller bättre konsistens och kokar inte sönder."},{"title":"Lite syra på slutet","body":"Lyfter fram tomat- och köttsmaken."}],"sources":[["RecipeTin Eats","https://www.recipetineats.com/chilli-con-carne/"],["Good Food","https://www.bbcgoodfood.com/recipes/chilli-con-carne-recipe"],["Serious Eats","https://www.seriouseats.com/the-best-chili-recipe"]],"tags":["Köttfärs","Långkok"],"countryCode":"US","countryName":"USA","countryFlag":"🇺🇸","countryNote":"Texansk / amerikansk Tex-Mex-tradition, trots det spanskspråkiga namnet.","nutrition":{"kcal":745,"protein":40,"carbs":78,"fat":30,"per":"portion","servings":4,"estimated":true},"shoppingTips":["Nötfärsen är nu 500 g. Bönorna anges i avrunnen vikt: två normalstora konservburkar (en av varje sort) brukar passa."]},{"id":"kottbullar-mos","name":"Köttbullar med potatismos","subtitle":"Smörstekta blandfärsbullar, fluffigt mos & gräddsås","category":"Svensk husman","emoji":"🍽️","tone":"ragu","badge":"Svensk husman","yieldBase":"4 portioner","yields":[2,0,4,0,8,0],"time":"Ca 55 min","difficulty":"Enkel–medel","temp":"Stekpanna","intro":"Klassisk svensk husmanskost med saftiga smörstekta köttbullar, mjukt potatismos och mustig gräddsås på stekskyn. Lingon och gurka balanserar allt det krämiga.","origin":"Nära Catarina Königs beprövade helhetsrecept, med förtydligade moment och lagom mängder tillbehör. Steksky används om den är fin och inte bränd.","groups":[{"tit  pasta eller ris","body":"Koka pasta al dente eller ris enligt paketet under tiden som kycklingen sjuder. Spara gärna lite pastavatten för att vid behov kunna justera såsens konsistens."},{"title":"Basilika sist","body":"Ta pannan från värmen, strimla basilikan och vänd ner. Smaka av med svartpeppar och eventuellt salt. Servera direkt med pasta eller ris och gärna grönsallad."}],"tips":[{"title":"Delade filéer blir saftigare","body":"Jämn tjocklek gör att kycklingen blir klar samtidigt."},{"title":"Lite mjöl räcker","body":"Lätt mjölning hjälper till med bryning och binder såsen utan extra redning."},{"title":"Bryn i tomatoljan","body":"Lite olja från burken ger extra tomatarom och minskar svinn."},{"title":"Finriv parmesan och sjud lugnt","body":"För stark värme riskerar att ost och grädde separerar."},{"title":"Färsk basilika allra sist","body":"Ger fräsch smak som inte kokas bort."},{"title":"Smaka före salt","body":"Kycklingbuljong, parmesan och soltorkade tomater innehåller redan mycket salt."}],"sources":[["ICA – Marry Me Chicken","https://www.ica.se/recept/marry-me-chicken-730140/"],["The Modern Proper","https://themodernproper.com/marry-me-chicken"],["Delish – originalet","https://www.delish.com/cooking/recipe-ideas/a46330/skillet-sicilian-chicken-recipe/"],["Jennie Walldén – Köket","https://www.koket.se/marry-me-chicken"]],"tags":["Kyckling","Snabbt"],"countryCode":"US","countryName":"USA","countryFlag":"🇺🇸","countryNote":"Modern amerikansk kycklingrätt.","nutrition":{"kcal":1135,"protein":53,"carbs":71,"fat":71,"per":"portion","servings":4,"estimated":true},"shoppingTips":["600 g kycklingfilé är ungefär fyra mindre filéer; köp gärna efter vikt. Soltorkade tomater anges som 120 g avrunnet – kontrollera avrunnen vikt på burken."]},{"id":"stuvade-makaroner-falukorv","name":"Stuvade makaroner med falukorv","subtitle":"Krämiga makaroner kokta i mjölk, smörstekt korv","category":"Svensk husman","emoji":"🍝","tone":"creamy","badge":"Svensk husman","yieldBase":"4 p  och eventuellt en liten nypa muskot."},{"title":"Servera genast","body":"Lägg upp makaronerna med den nystekta falukorven. Servera gärna gurka eller morotsstavar till."}],"tips":[{"title":"Välj vanliga makaroner","body":"Snabbmakaroner har annan koktid och blir lätt mosiga när de sjuds länge i mjölk."},{"title":"Rör ofta","body":"Mjölk bränner lätt vid, framför allt när pastastärkelsen tjocknar."},{"title":"Smörstek korven","body":"Låt korven få ordentlig stekyta – det behövs inget avancerat tillbehör."},{"title":"Servera direkt","body":"Stuvningen tjocknar när den står; lite extra mjölk räddar resterna."}],"sources":[["ICA – stuvade makaroner","https://www.ica.se/recept/stuvade-makaroner-716485/"],["ICA – falukorv med stuvade makaroner","https://www.ica.se/recept/falukorv-med-stuvade-makaroner-725260/"],["Arla – stuvade makaroner","https://www.arla.se/recept/stuvade-makaroner/"]],"tags":["Fläsk & korv"],"countryCode":"SE","countryName":"Sverige","countryFlag":"🇸🇪","countryNote":"Sverige – huvudsaklig mattradition för denna version.","nutrition":{"kcal":910,"protein":39,"carbs":96,"fat":41,"per":"portion","servings":4,"estimated":true},"shoppingTips":["Falukorv finns i 600 g-förpackningar. Mjölkmängden är exakt 1 liter."]},{"id":"smashburgare","name":"Smashburgare med hamburgardressing","subtitle":"Dubbel smashburger med stekyta, smältost och pickles","category":"Snabbmat & street food","emoji":"🍔","tone":"fries","badge":"Street food","yieldBase":"4 portioner","yields":[2,0,4,0,8,0],"time":"Ca 25–30 min","difficulty":"Enkel–medel","temp":"Stekpanna","intro":"Dubbla, tunna smashbiffar med mörk stekyta, smält cheddar, smörrostade bröd och en snabb, syrlig hamburgerdressing. En klassisk diner-burgare, inte en överlastad burgare.","origin":"Tekniken bygger på J. Kenji López-Alts ultra-smashed cheeseburger hos Serious Eats. Såsen är en enkel svenskbutiksanpassad majonnäsbaserad dressing och en egen kombination. Kräver en stekpanna i gjutjärn eller rostfritt; hetta inte upp teflon på maximal värme.","groups":[{"title":"Burgare","items":[{"name":"Nötfärs, 15–20 % fett","qty":640,"unit":"g","extra":"8 bollar à 80 g","fixed":""},{"name":"Hamburgerbröd, mjuka","qty":4,"unit":"st","extra":"","fixed":""},{"name":"Hamburgerost/cheddar i skivor","qty":8,"unit":"skivor","extra":"","fixed":""},{"name":"Smör till bröden","qty":20,"unit":"g","extra":"","fixed":""},{"name":"Salt","qty":1,"unit":"tsk","extra":"använd efter smak på biffarna","fixed":""},{"name":"Nymalen svartpeppar","qty":null,"unit":"","extra":"Efter smak","fixed":"Efter smak"}]},{"title":"Snabb hamburgardressing","items":[{"name":"Majonnäs","qty":1,"unit":"dl","extra":"","fixed":""},{"name":"Ketchup","qty":2,"unit":"msk","extra":"","fixed":""},{"name":"Svensk senap","qty":2,"unit":"tsk","extra":"","fixed":""},{"name":"Bostongurka, avrunnen","qty":2,"unit":"msk","extra":"","fixed":""},{"name":"Vitvinsvinäger eller gurkspad","qty":1,"unit":"tsk","extra":"vid behov för syra","fixed":""}]},{"title":"Toppings","items":[{"name":"Saltgurka eller hamburgergurka","qty":8,"unit":"skivor","extra":"","fixed":""},{"name":"Gul lök, liten","qty":1,"unit":"st","extra":"tunt skivad","fixed":""},{"name":"Isbergssallad","qty":4,"unit":"blad","extra":"valfritt","fixed":""}]}],"steps":[{"title":"Gör dressingen","body":"Rör ihop majonnäs, ketchup, senap och bostongurka. Smaka av med lite vinäger eller gurkspad om du vill ha mer syra. Förvara svalt."},{"title":"Förbered allt före stekning","body":"Skiva lök och gurka tunt. Dela bröden och stek snittytorna lätt gyllene i smör. Forma 8 lösa bollar av kall färs, cirka 80 g vardera; platta inte ut dem i förväg."},{"title":"Värm rätt panna","body":"Hetta upp en gjutjärns- eller rostfri stekpanna ordentligt på medelhög till hög värme. Arbeta i små omgångar så att pannan förblir het. Ha en rejäl metallstekspade redo."},{"title":"Smasha en gång","body":"Lägg 1–2 köttbollar i den heta pannan och pressa dem omedelbart tunt med en stabil stekspade, gärna med en liten bit bakplåtspapper emellan. Salta och peppra. Pressa inte igen senare."},{"title":"Få fram skorpan och vänd","body":"Låt ligga ostört cirka 1–2 minuter tills undersidan blivit ordentligt mörkt brynt. Skrapa upp hela stekytan med stekspaden och vänd. Lägg en ostskiva på varje biff och låt andra sidan bli färdig. Biffarna ska vara helt genomstekta utan rå mitten."},{"title":"Bygg burgarna direkt","body":"Bred dressing på bottenbröden. Lägg på eventuell sallad, två biffar med ost per bröd, lök och gurka. Lägg på locken och servera direkt."}],"tips":[{"title":"Hög fetthalt gör skillnad","body":"Färs med 15–20 % fett är bättre anpassad för tunn, hårt stekt burgare än mycket mager färs."},{"title":"Smasha direkt","body":"Den tunna biffen får maximal kontaktyta och smakrik Maillard-yta."},{"title":"Välj rätt panna","body":"Mycket het gjutjärns- eller stålpanna ger bättre skorpa än en nonstickpanna, som inte ska överhettas."},{"title":"Lägg fram allt först","body":"Stekningen går fort; dressingen och bröden ska vara klara innan köttet hamnar i pannan."},{"title":"Måttligt med toppings","body":"Ost, pickles, lök och dressing räcker långt – huvudrollen är köttets stekyta."}],"sources":[["Serious Eats – Ultimate Smash Cheeseburger","https://www.seriouseats.com/ultra-smashed-cheeseburger-recipe-food-lab"],["Serious Eats – burgarsamling","https://www.seriouseats.com/burger-recipes"]],"tags":["Köttfärs","Snabbt","Ost"],"countryCode":"US","countryName":"USA","countryFlag":"🇺🇸","countryNote":"USA – huvudsaklig mattradition för denna version.","nutrition":{"kcal":950,"protein":48,"carbs":44,"fat":65,"per":"portion","servings":4,"estimated":true},"shoppingTips":["Originalets åtta tunna biffar à 80 g kräver 640 g färs. Välj gärna ett 800 g-paket och frys 160 g, eller köp önskad vikt i butikens köttdisk. Ändra inte biffstorleken enbart för att tömma paketet."]},{"id":"tacos-kottfars","name":"Tacos med köttfärs","subtitle":"Svensk tacofredag med egen kryddmix och fräscha tillbehö d":""},{"name":"Riven ost","qty":150,"unit":"g","extra":"","fixed":""},{"name":"Gräddfil","qty":2,"unit":"dl","extra":"","fixed":""},{"name":"Tacosås/salsa","qty":2,"unit":"dl","extra":"","fixed":""}]}],"steps":[{"title":"Förbered grönsakerna","body":"Strimla salladen, tärna tomat och gurka, hacka rödlöken och låt majsen rinna av. Ställ fram gräddfil, ost och salsa."},{"title":"Blanda kryddorna","body":"Blanda spiskummin, paprikapulver, vitlöks- och lökpulver, oregano, salt, chili och svartpeppar i en kopp."},{"title":"Bryn färsen","body":"Finhacka den gula löken. Stek den mjuk någon minut i olja. Höj värmen, lägg i färsen och bryn tills den får fin färg och är genomstekt."},{"title":"Smaksätt och sjud","body":"Tillsätt kryddorna och tomatpurén. Rör om cirka 30 sekunder. Häll på vattnet och låt sjuda 3–5 minuter tills färsen är saftig utan att bli blöt."},{"title":"Värm bröden","body":"Värm tortillas eller tacoskal enligt förpackningen. Mjuka tortillas kan värmas några sekunder per sida i en torr panna."},{"title":"Servera som tacobuffé","body":"Låt alla fylla sina tacos med kött, ost, sallad, grönsaker, salsa och gräddfil. Börja med mindre salsa så att skalet inte blir blött."}],"tips":[{"title":"Kryddmixen kan bytas ut","body":"En vanlig svensk påse tacokrydda är ett fullgott snabbt alternativ; följ då paketets mängd vatten och hoppa över vår kryddmix."},{"title":"Tomatpuré ger fylligare färs","body":"Lite tomatpuré hjälper kryddorna att fästa runt köttet."},{"title":"Smaka av hetta separat","body":"Barnvänlig grund och chili vid bordet är ofta bäst."},{"title":"Varma tortillabröd","body":"Värm dem precis före servering så blir de mjuka och följsamma."}],"sources":[["ICA – klassiska tacos","https://www.ica.se/recept/tacos-722416/"],["RecipeTin Eats – Beef Tacos","https://www.recipetineats.com/ground-beef-tacos-recipe/"],["RecipeTin Eats – taco seasoning","https://www.recipetineats.com/taco-seasoning/"]],"tags":["Köttfärs","Snabbt"],"countryCode":"MX","countryName":"Mexiko","countryFlag":"🇲🇽","countryNote":"Mexikanska tacos är förebilden; det här receptet är en svensk Tex-Mex-variant.","nutrition":{"kcal":1010,"protein":50,"carbs":92,"fat":49,"per":"portion","servings":4,"estimated":true},"shoppingTips":["Nötfärsen är 500 g. Till 12 tortillas kan du köpa en stor förpackning eller kombinera två mindre."]},{"id":"butter-chicken","name":"Butter Chicken","subtitle":"Mild indisk kycklinggryta med yoghurtmarinad och tomatgrädde","category":"Världens kök","emoji":"🍛","tone":"chicken","badge":"Restaurangfavorit","yieldBase":"4 portioner","yields":[2,0,4,0,8,0],"time":"Ca 40 min + marinering","difficulty":"Enkel–medel","temp":"Stekpanna","intro":"Mjuk, mild och mycket smakrik butter chicken med kycklinglårfilé marinerad i yoghurt, ingefära och garam masala. Serveras med basmatiris; naan är frivilligt.","origin":"Nära Nagi Maehashis högt betygsatta recept på RecipeTin Eats, inspirerat av kocken Luke Mangan. Svenska decilitermått är avrundade och kan påverka utfallet marginellt. Marinera helst minst 3 timmar, gärna över natten. Ghee behövs inte – vanligt smör fungerar.","groups":[{"title":"Yoghurtmarinad","items":[{"name":"Kycklinglårfilé, benfri","qty":700,"unit":"g","extra":"En 700 g-förpackning fryst kycklinglårfilé fungerar bra.","fixed":""},{"name":"Turkisk yoghurt, naturell","qty":1.25,"unit":"dl","extra":"","fixed":""},{"name":"Citronjuice","qty":1,"unit":"msk","extra":"","fixed":""},{"name":"Garam masala","qty":2,"unit":"tsk","extra":"","fixed":""},{"name":"Malen spiskummin","qty":1,"unit":"tsk","extra":"","fixed":""},{"name":"Gurkmeja","qty":1,"unit":"tsk","extra":"","fixed":""},{"name":"Cayennepeppar","qty":0.5,"unit":"tsk","extra":"halvera om mildare önskas","fixed":""},{"name":"Färsk ingefära, finriven","qty":1,"unit":"msk","extra":"","fixed":""},{"name":"Vitlöksklyftor","qty":2,"unit":"st","extra":"","fixed":""}]},{"title":"Sås","items":[{"name":"Smör","qty":30,"unit":"g","extra":"","fixed":""},{"name":"Passerade tomater (passata)","qty":2.5,"unit":"dl","extra":"","fixed":""},{"name":"Vispgrädde","qty":2.5,"unit":"dl","extra":"","fixed":""},{"name":"Strösocker","qty":1,"unit":"msk","extra":"","fixed":""},{"name":"Salt","qty":1,"unit":"tsk","extra":"smaka av","fixed":""}]},{"title":"Till servering","items":[{"name":"Basmatiris, okokt","qty":3,"unit":"dl","extra":"","fixed":""},{"name":"Färsk koriander","qty":null,"unit":"","extra":"Valfritt","fixed":"Valfritt"},{"name":"Naanbröd","qty":null,"unit":"","extra":"Valfritt","fixed":"Valfritt"}]}],"steps":[{"title":"Marinera kycklingen","body":"Skär kycklinglårfilén i munsbitar. Blanda yoghurt, citron, garam masala, spiskummin, gurkmeja, chili, ingefära och pressad vitlök. Vänd ner kycklingen; kyl minst 3 timmar, helst över natten."},{"title":"Starta riset","body":"Koka basmatiris enligt anvisningarna på förpackningen när du börjar laga grytan."},{"title":"Fräs kycklingen","body":"Smält smöret i en stor stekpanna på medelhög värme. Lyft upp kycklingen ur marinaden och stek i omgångar cirka 3–4 minuter tills den är vit på ytan och har lätt färg. Spara eventuellt kvarvarande marinad i bunken."},{"title":"Låt såsen sjuda färdigt","body":"Häll i passata, grädde, socker, salt och eventuell marinad som blivit över. Sänk värmen och låt sjuda utan lock cirka 15–20 minuter under omrörning tills såsen är fyllig och kycklingen är helt genomlagad, minst 72°C."},{"title":"Smaka av","body":"Smaka av med salt och eventuellt lite extra citron. Om såsen blir tunn, sjud utan lock några minuter till. Blir den för tjock, tillsätt en liten skvätt vatten."},{"title":"Servera","body":"Lägg upp med basmatiris. Toppa eventuellt med koriander och servera naan vid sidan av."}],"tips":[{"title":"Marinering betyder mest","body":"Yoghurten och kryddorna hjälper till att ge kycklingen god smak och en mör upplevelse."},{"title":"Kycklinglårfilé är förlåtande","body":"Den tål den avslutande sjudningen bättre än magra kycklingbröst."},{"title":"Bryn inte bort all yoghurt","body":"Kycklingen får inte alltid stark stekyta genom marinaden; den ska tillagas färdigt i såsen."},{"title":"Ingen specialbutik behövs","body":"Garam masala, gurkmeja och övriga råvaror finns i vanliga svenska större matbutiker."},{"title":"Var noga med marinaden","body":"All överbliven rå kycklingmarinad måste koka med i såsen och bli ordentligt genomvarm."}],"sources":[["RecipeTin Eats – Butter Chicken","https://www.recipetineats.com/butter-chicken/"]],"tags":["Kyckling","Festmat"],"countryCode":"IN","countryName":"Indien","countryFlag":"🇮🇳","countryNote":"Indisk butter chicken (murgh makhani).","nutrition":{"kcal":865,"protein":41,"carbs":61,"fat":51,"per":"portion","servings":4,"estimated":true},"shoppingTips":["Kycklingen är nu 700 g, en vanlig storlek för fryst lårfilé. Såsens 2½ dl grädde är hälften av ett 5 dl-paket; frys eller använd resten inom hållbarhetstiden."]},{"id":"lax-citronsas","name":"Ugnsbakad lax med citronsås","subtitle":"Saftig ugnslax med len citronsås, potatis och gröna ärtor","category":"Svensk husman","emoji":"🐟","tone":"creamy","badge":"Lättlagad favorit","yieldBase":"4 portioner","yields":[2,0,4,0,8,0],"time":"Ca 35–45 min","difficulty":"Enkel","temp":"175°C","intro":"En mild och saftig lax med krämig citronsås, kokt potatis och gröna ärtor. Ett komplett vardagsrecept med få ingredienser och tydlig temperaturkontroll.","origin":"Nära Arlas lax med citronsås. Originalet använder även broccoli och gräslök; det är frivilligt här för ett enklare grundrecept. Mängden lax är något generösare än Arlas grundrecept; såsmängderna motsvarar originalet.","groups":[{"title":"Lax och potatis","items":[{"name":"Laxfilé, portionsbitar","qty":600,"unit":"g","extra":"4 bitar à cirka 150 g","fixed":""},{"name":"Fast potatis","qty":900,"unit":"g","extra":"","fixed":""},{"name":"Salt och svartpeppar","qty":null,"unit":"","extra":"Efter smak","fixed":"Efter smak"},{"name":"Frysta gröna ärtor","qty":250,"unit":"g","extra":"","fixed":""}]},{"title":"Len citronsås","items":[{"name":"Smör","qty":15,"unit":"g","extra":"","fixed":""},{"name":"Vetemjöl","qty":1,"unit":"msk","extra":"","fixed":""},{"name":"Standardmjölk","qty":3,"unit":"dl","extra":"","fixed":""},{"name":"Vispgrädde","qty":1,"unit":"dl","extra":"","fixed":""},{"name":"Grönsaksbuljongtärning","qty":1,"unit":"st","extra":"","fixed":""},{"name":"Citron","qty":1,"unit":"st","extra":"skal och juice, tillsätt gradvis","fixed":""},{"name":"Färsk gräslök","qty":3,"unit":"msk","extra":"valfritt","fixed":""}]}],"steps":[{"title":"Sätt ugnen och börja med potatisen","body":"Sätt ugnen på 175°C över- och undervärme. Koka potatisen i lättsaltat vatten tills mjuk, omkring 15–25 minuter beroende på storlek."},{"title":"Förbered laxen","body":"Lägg laxbitarna i en liten ugnsform. Torka av och salta och peppra lagom. Tillaga i mitten av ugnen cirka 12–20 minuter beroende på tjocklek tills innertemperaturen är 52–56°C enligt Arlas rekommendation."},{"title":"Gör såsen medan laxen bakas","body":"Smält smöret i en kastrull. Vispa ner mjölet och sedan mjölken gradvis så att det inte blir klumpar. Tillsätt grädden och smula ner buljongtärningen. Låt sjuda 5 minuter."},{"title":"Smaka av med citron","body":"Riv det yttersta gula skalet fint och rör ner. Tillsätt saften från ungefär en halv citron lite åt gången, smaka av med salt och peppar. Vänd ner gräslök om du använder det."},{"title":"Värm ärtorna","body":"Koka upp ärtorna enligt förpackningen, vanligtvis ett par minuter, och häll av."},{"title":"Servera direkt","body":"Lägg upp lax, potatis och ärtor med den varma citronsåsen. Servera extra citron vid bordet."}],"tips":[{"title":"Termometer ger saftig lax","body":"Tjockleken varierar. Använd 52–56°C som riktmärke enligt Arlas recept, snarare än en helt fast ugnstid."},{"title":"Smaka citronen stegvis","body":"Olika citroner är olika sura. Börja med en halv och öka efter smak."},{"title":"Såsen ska sjuda, inte stormkoka","body":"En varsam redning ger en slätare konsistens."},{ atisen","body":"Skär potatisen i stavar cirka 1 cm tjocka. Skölj i kallt vatten, häll av och torka MYCKET noggrant för att undvika stänk från frityroljan."},{"title":"Gör tartarsåsen","body":"Rör ihop majonnäs, gurka, kapris, citron, dill och dijon. Smaka av och ställ kallt."},{"title":"Förfritera potatisen","body":"Hetta upp rapsoljan i en stadig tjockbottnad kastrull till 145–150°C. Fritera potatisen i mindre omgångar 5–7 minuter tills den är mjuk men blek. Låt rinna av på galler."},{"title":"Förbered fisken","body":"Tina fisk helt och torka mycket noga. Skär i fyra stora eller åtta mindre bitar. Salta lätt och pudra tunt med vetemjöl."},{"title":"Vispa ihop frityrsmet","body":"Blanda vetemjöl, majsstärkelse, bakpulver och salt. Häll i 2 dl iskall öl strax före tillagning; blanda hastigt. Smeten ska täcka en sked men fortfarande rinna av."},{"title":"Fritera fisken","body":"Höj oljan till 180–185°C. Doppa fisken i frityrsmet och sänk försiktigt ner i oljan i mindre omgångar. Fritera cirka 4–6 minuter tills fisken är genomlagad och skalet gyllene. Lägg på galler, inte i en stapel."},{"title":"Andra friteringen","body":"Fritera potatisen igen vid 185–190°C i 2–4 minuter tills riktigt gyllene och frasig. Salta genast."},{"title":"Servera","body":"Servera med tartarsås och citron. För mushy peas: värm ärtorna med smör, salta och mosa dem grovt."}],"tips":[{"title":"Torr fisk och potatis","body":"Fukt på ytan kan göra paneringen blöt och få frityroljan att stänka kraftigt."},{"title":"Iskall smet","body":"Kall öl och varm olja ger ett lätt, frasigt skal."},{"title":"Dubbelfritera potatis","body":"Första omgången tillagar insidan, andra skapar en frasig yta."},{"title":"Fritera säkert","body":"Fyll aldrig kastrullen mer än en tredjedel med olja. Ha lock till hands, lämna aldrig oljan ensam och använd ALDRIG vatten på brinnande olja."},{"title":"Enkelt alternativ","body":"Frysta pommes tillagade i ugn eller airfryer sparar mycket jobb. Behåll helst ölsmeten till fisken." åller ihop vid servering."}],"tips":[{"title":"Köttfärssåsen måste vara tjock","body":"För mycket vätska gör gratängen svår att skära."},{"title":"Rosta i stället för att fritera","body":"Mindre fett och färre moment men ändå mjuka auberginer."},{"title":"Lite kanel räcker","body":"En svag varm ton är lagom; den ska inte dominera."},{"title":"Ägg i béchameln","body":"Gör så att den tjocka toppingen stelnar fint."},{"title":"Gör gärna i förväg","body":"Vilotid hjälper strukturen och smakerna."}],"sources":[["My Greek Dish – Traditional Moussaka","https://www.mygreekdish.com/recipe/mousakas/"],["RecipeTin Eats – Moussaka","https://www.recipetineats.com/moussaka-greek-eggplant-beef-bake/"]],"tags":["Köttfärs","Ugn","Festmat"],"countryCode":"GR","countryName":"Grekland","countryFlag":"🇬🇷","countryNote":"Grekisk moussaka-variant med aubergine och béchamel.","nutrition":{"kcal":855,"protein":43,"carbs":49,"fat":54,"per":"portion","servings":4,"estimated":true},"shoppingTips":["Nötfärsen är 500 g och de krossade tomaterna 400 g, båda praktiska hela förpackningar. Aubergine är en viktvara; två stora brukar fungera."]},{"id":"sloppy-joe","name":"Sloppy Joe","subtitle":"Amerikansk köttfärsburgare med sötsyrlig tomatsås och saltgurka","category":"Snabbmat & street food","emoji":"🍔","tone":"fries","badge":"Amerikansk dinerklassiker","yieldBase":"4 portioner","yields":[2,0,4,0,8,0],"time":"35–40 min","difficulty":"Enkel","temp":"Spis","intro":"Brynt nötfärs i en blank, tjock tomat- och senapssås med lagom sötma och syra, serverad i smörrostade bröd med saltgurka.","origin":"Inspirerad av Allrecipes klassiska och RecipeTin Eats fylligare Sloppy Joes. Något mindre ketchup och valfritt extra socker för balans; sammanvägd, ej separat provlagad version.","groups":[{"title":"Köttfärsfyllning","items":[{"name":"Nötfärs","qty":500,"unit":"g","extra":"gärna 10–15 % fett","fixed":""},{"name":"Gul lök","qty":1,"unit":"st","extra":"","fixed":""},{"name":"Grön paprika, liten","qty":1,"unit": gefär 3–4 minuter per sida. Kontrollera att tjockaste biten når 74°C i mitten."},{"title":"Blanda dippen","body":"Blanda majonnäs, mild senap, dijon, honung och citron. Smaka av med salt och peppar."},{"title":"Servera","body":"Låt nuggets rinna av på galler så paneringen förblir frasig. Servera genast med pommes, dipp och eventuellt grönsaksstavar."}],"tips":[{"title":"Panko ger krisp","body":"De större flagorna blir frasigare än vanligt fint ströbröd."},{"title":"Jämnstora bitar","body":"Gör det enklare att få alla genomstekta samtidigt."},{"title":"Lägg på galler","body":"Staplad varm panering mjuknar snabbt av ångan."},{"title":"Undvik att överfylla pannan","body":"Annars sjunker oljetemperaturen och paneringen blir fetare."},{"title":"Airfryer alternativ","body":"Pensla med lite olja och tillaga vid 190°C i cirka 10–14 minuter i ett lager. Kontrollera 74°C i mitten."}],"sources":[["ICA – Crispy Chicken Nuggets med dipp","https://www.ica.se/recept/crispy-chicken-nuggets-med-dipp-722021/"]],"tags":["Kyckling"],"countryCode":"US","countryName":"USA","countryFlag":"🇺🇸","countryNote":"USA – huvudsaklig mattradition för denna version.","nutrition":{"kcal":1060,"protein":55,"carbs":104,"fat":47,"per":"portion","servings":4,"estimated":true},"shoppingTips":["700 g kyckling finns som frysta filé-/innerfiléförpackningar. Pommesmängden 800 g kan tas från en 1 kg-påse."]},{"id":"pytt-i-panna","name":"Pytt i panna","subtitle":"Krögarpytt med krispig potatis, korv, kött, stekt ägg och rödbetor","category":"Svensk husman","emoji":"🥔","tone":"ragu","badge":"Svensk husmanskost","yieldBase":"4 portioner","yields":[2,0,4,0,8,0],"time":"45–55 min","difficulty":"Enkel","temp":"Spis","intro":"Riktig krögarpytt med råstekt gyllene potatis, falukorv, färdigstekt kött och lök. Toppad med stekt ägg, rödbetor och saltgurka.","origin":"Huvudkälla är ICA:s klassiska pytt i panna. Grönsaker och kött steks separat för bättre yta; råstekt potatis tar längre tid än restpytt på färdigkokt potat uellt persilja."},{"title":"Stek ägg och servera","body":"Stek fyra ägg i smör så att vitan stelnar men gulan gärna är lös. Servera med pytt, inlagda rödbetor och saltgurka."}],"tips":[{"title":"Separat stekning","body":"Potatis, lök och korv får bättre textur när de inte ångkokas i en full panna."},{"title":"Låt potatisen ligga still","body":"För mycket omrörning ger sämre stekyta."},{"title":"Rester går utmärkt","body":"Färdigkokt kall potatis förkortar stekningen till cirka 7–10 minuter."},{"title":"Låt äggulan vara såsen","body":"Den mjuka gulan och syrliga rödbetor ger rätt balans utan grädde."}],"sources":[["ICA – Pytt i panna","https://www.ica.se/recept/pytt-i-panna-722178/"]],"tags":["Potatis","Fläsk & korv"],"countryCode":"SE","countryName":"Sverige","countryFlag":"🇸🇪","countryNote":"Sverige – huvudsaklig mattradition för denna version.","nutrition":{"kcal":710,"protein":35,"carbs":59,"fat":38,"per":"portion","servings":4,"estimated":true},"shoppingTips":["Rätten lämpar sig väl för rester: 250 g falukorv plus 250 g tillagat kött. Köp inte ny 600 g-korv bara för pytten om du redan har rester."]},{"id":"aggrora","name":"Äggröra","subtitle":"Mjukt krämig äggröra med smör, crème fraîche och gräslök","category":"Frukost & brunch","emoji":"🍳","tone":"creamy","badge":"Frukostklassiker","yieldBase":"4 portioner","yields":[2,0,4,0,8,0],"time":"10–15 min","difficulty":"Enkel","temp":"Spis","intro":"Ett enkelt restaurangknep för äggröra som är mjuk och smörig i stället för torr: låg värme, varsam omrörning och lite crème fraîche allra sist.","origin":"ICA:s välrecenserade äggröra och restaurangtekniken med låg värme är huvudkällor; crème fraîche vänds ner sist enligt Ramsay-inspirerad metod. Egna exakta proportioner, ej separat provlagade.","groups":[{"title":"Äggröra","items":[{"name":"Ägg, stora","qty":8,"unit":"st","extra":"","fixed":""},{"name":"Smör","qty":30,"unit":"g","extra":"","fixed":""},{"name":"Crème fraîche","qty":2,"unit":"msk","extra":"","fixed":""},{"n ,"estimated":true},"shoppingTips":["Åtta ägg ger fyra rejäla portioner. Brödet kan tas från ett vanligt paket rostbröd och frysas in i skivor."]},{"id":"stekt-laxfile","name":"Stekt laxfilé med brynt citronsmör","subtitle":"Krispigt laxskinn, dillpotatis och nötigt smör med citron","category":"Svensk husman","emoji":"🐟","tone":"creamy","badge":"Snabb fiskklassiker","yieldBase":"4 portioner","yields":[2,0,4,0,8,0],"time":"Ca 30 min","difficulty":"Enkel","temp":"Stekpanna","intro":"Pannstekt lax med riktigt frasigt skinn, saftig mitt och lätt nötig citronsmörsås. Dillpotatis och broccoli gör det till en komplett och enkel middag.","origin":"Utgår från RecipeTin Eats teknik för krispigt laxskinn, med Mathems svenska brynta citronsmör och ICAs dillpotatis. Skiljer sig från ugnsbakad lax med citronsås (recept 25). Kombinerad version ej separat provlagad.","groups":[{"title":"Lax","items":[{"name":"Laxfilé med skinn, fjällfri","qty":650,"unit":"g","extra":"fyra bitar; 600–700 g går bra","fixed":""},{"name":"Rapsolja","qty":2,"unit":"msk","extra":"","fixed":""},{"name":"Salt","qty":0.75,"unit":"tsk","extra":"","fixed":""},{"name":"Svartpeppar","qty":null,"unit":"","extra":"","fixed":"Efter smak"}]},{"title":"Brynt citronsmör","items":[{"name":"Smör","qty":60,"unit":"g","extra":"","fixed":""},{"name":"Citron","qty":1,"unit":"st","extra":"skal och 1 msk saft, resten till servering","fixed":""},{"name":"Hackad dill","qty":1,"unit":"msk","extra":"","fixed":""}]},{"title":"Tillbehör","items":[{"name":"Fast potatis, gärna små","qty":800,"unit":"g","extra":"","fixed":""},{"name":"Broccoli","qty":250,"unit":"g","extra":"","fixed":""},{"name":"Färsk hackad dill","qty":1,"unit":"msk","extra":"","fixed":""},{"name":"Salt","qty":null,"unit":"","extra":"","fixed":"Efter smak"}]}],"steps":[{"title":"Koka potatisen","body":"Koka potatisen mjuk i lättsaltat vatten, cirka 15–20 minuter. Ångkoka eller koka broccolin de sista 3–5 minuterna."},{"title":"Torka laxen noggrant","body":"Tina helt om den är fryst. Se till att skinnet är fjällfritt. Torka torrt med hushållspapper och salta och peppra först strax före stekningen."},{"title":"Stek skinnsidan först","body":"Värm rapsolja i stekpanna på medelhög värme. Lägg laxen med skinnsidan nedåt, tryck försiktigt med stekspaden de första 10 sekunderna, sänk till medelvärme och stek cirka 5–7 minuter."},{"title":"Stek klart","body":"Vänd och stek köttsidan ungefär 1–2 minuter. Sikta på 52–56°C i mitten för saftig tillagad lax; tiden beror på tjockleken. Tillaga mer om du föredrar laxen helt genomstekt eller lagar mat åt särskilt känsliga personer."},{"title":"Bryn smöret","body":"Smält smöret i en liten ljus kastrull. Låt det skumma och bli nötigt gyllenbrunt, ta direkt från värmen. Låt svalna något och rör ner citronjuice, lite finrivet citronskal och hackad dill."},{"title":"Servera","body":"Häll av potatisen och vänd den med dill. Lägg upp laxen med skinnsidan uppåt och servera med potatis, broccoli och brynt citronsmör runt om – inte ovanpå skinnet."}],"tips":[{"title":"Torka skinnet mycket noga","body":"Ett torrt skinn ger bättre kontakt och tydligare krisp."},{"title":"Stek mest på skinnsidan","body":"Skinnet skyddar fiskköttet från för stark direktvärme."},{"title":"Servera skinnsidan upp","body":"Om smör eller sås hälls över skinnet försvinner krispigheten snabbt."},{"title":"Använd termometer","body":"Olika tjocka filéer behöver olika tid; 52–56°C ger saftig tillagad lax."},{"title":"Alternativ utan skinn","body":"Stek cirka 3 minuter per sida på medelvärme och kontrollera temperaturen. Ytan kan bli fint brynt men inte skinnkrispig."}],"sources":[["RecipeTin Eats – Crispy Skin Salmon","https://www.recipetineats.com/crispy-skin-salmon/"],["Mathem – Lax med brynt smör, citron och gurka","https://www.mathem.se/se/recipes/1301-mari-bergman-lax-med-brynt-smor-citron-och-hyvlad-gurka/"],["ICA – Stekt lax med skagenröra och dillpotatis","https://www.ica.se/recept/stekt-lax-med-skagenrora-och-dillpotatis-729322/"]],"tags":["Fisk & skaldjur","Potatis","Snabbt"],"countryCode":"SE","countryName":"Sverige","countryFlag":"🇸🇪","countryNote":"Svensk hemmavariant av pannstekt lax med dillpotatis och brynt smör.","nutrition":{"kcal":670,"protein":39,"carbs":38,"fat":41,"per":"portion","servings":4,"estimated":true},"shoppingTips":["Köp ungefär 600–700 g skinnlax, eller fyra bitar på cirka 150–175 g. Övriga viktvaror behöver inte matcha exakt förpackning."]},{"id":"smorgastarta","name":"Smörgåstårta","subtitle":"Klassisk smörgåstårta med leverpastej, skinka, räkor och ägg","category":"Smörgåsar","emoji":"🥪","tone":"creamy","badge":"Svensk kalasklassiker","yieldBase":"10 portioner","yields":[5,0,10,0,20,0],"time":"55 min + natt i kyl","difficulty":"Medel","temp":"Kallrätt","intro":"Den klassiska svenska kalastårtan: tre krämiga fyllningslager under färskostkräm, med räkor, skinka, ägg och grönsaker på toppen.","origin":"Inspirerad av Köket och ICA Caterings klassiska skinka- och leverpastejvarianter. Lagren och färskosttäcket bygger på receptet som valdes i chatten för nr 41; exakt kombination ej separat provlagad.","groups":[{"title":"Bröd","items":[{"name":"Formfranska, utan kanter","qty":16,"unit":"skivor","extra":"eller 8 skivor landgångsbröd; 4 brödlager","fixed":""}]},{"title":"Leverpastejfyllning – två lager","items":[{"name":"Bredbar leverpastej","qty":350,"unit":"g","extra":"","fixed":""},{"name":"Crème fraîche 34 %","qty":1.5,"unit":"dl","extra":"","fixed":""},{"name":"Saltgurka, finhackad","qty":1,"unit":"dl","extra":"","fixed":""},{"name":"Svartpeppar","qty":null,"unit":"","extra":"","fixed":"Efter smak"}]},{"title":"Skink- och ostfyllning – ett lager","items":[{"name":"Rökt skinka, finhackad","qty":200,"unit":"g","extra":"","fixed":""},{"name":"Lagrad prästost, finriven","qty":100,"unit":"g","extra":"","fixed":""},{"name":"Crème fraîche 34 %","qty":1,"unit":"dl","extra":"","fixed":""},{"name":"Majonnäs","qty":0.5,"unit":"dl","extra":"","fixed":""},{"name":"Dijonsenap
