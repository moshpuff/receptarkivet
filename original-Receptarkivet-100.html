,{"name":"Gul lök","qty":1,"unit":"st","extra":"stor","fixed":""},{"name":"Champinjoner","qty":250,"unit":"g","extra":"","fixed":""},{"name":"Smör","qty":25,"unit":"g","extra":"till stekning","fixed":""},{"name":"Tomatpuré","qty":2,"unit":"msk","extra":"","fixed":""},{"name":"Paprikapulver","qty":2,"unit":"tsk","extra":"milt, inte rökt","fixed":""},{"name":"Dijonsenap","qty":1,"unit":"msk","extra":"","fixed":""},{"name":"Crème fraîche","qty":2,"unit":"dl","extra":"34 %","fixed":""},{"name":"Vispgrädde","qty":1,"unit":"dl","extra":"","fixed":""},{"name":"Vatten","qty":1,"unit":"dl","extra":"","fixed":""},{"name":"Kalvfond","qty":1,"unit":"tsk","extra":"koncentrerad","fixed":""},{"name":"Kinesisk soja","qty":1,"unit":"tsk","extra":"för färg och sälta","fixed":""},{"name":"Salt och svartpeppar","qty":null,"unit":"","extra":"Efter smak","fixed":"Efter smak"}]},{"title":"Servering","items":[{"name":"Ris, okokt","qty":3,"unit":"dl","extra":"cirka 250–260 g","fixed":""},{"name":"Saltgurka","qty":4,"unit":"st","extra":"eller smörgåsgurka","fixed":""},{"name":"Färsk persilja","qty":0.5,"unit":"kruka","extra":"valfritt","fixed":""}]}],"steps":[{"title":"Förbered kött och grönsaker","body":"Skär ryggbiffen i tunna strimlor tvärs över fibrerna. Skiva löken och champinjonerna. Sätt på riset enligt förpackningen."},{"title":"Bryn biffen snabbt","body":"Hetta upp en stor stekpanna. Bryn köttstrimlor i två omgångar i lite av smöret, cirka 1–2 minuter per omgång tills de får färg; salta lätt. Lägg åt sidan. Stek dem inte torra."},{"title":"Stek lök och svamp","body":"Tillsätt resten av smöret. Stek svampen tills vätskan kokat bort och den får färg, vänd därefter ner lök och fräs mjuk."},{"title":"Bygg såsen","body":"Rör ner tomatpuré och paprikapulver och låt fräsa 30–60 sekunder. Häll i vatten och rör loss steksmaken. Tillsätt crème fraîche, grädde, kalvfond, dijon och soja. Sjud varsamt cirka 5 minuter."},{"title":"Tillsätt biffen på slutet","body":"Lägg tillbaka köttet med eventuell köttsaft. Låt bli varmt i såsen under 1–2 minuter utan långkok; smaka av med salt och svartpeppar. Justera med någon matsked vatten om såsen är för tjock."},{"title":"Servera","body":"Lägg upp med nykokt ris och saltgurka. Strö eventuellt lite persilja över."}],"tips":[{"title":"Mör köttdetalj","body":"Ryggbiff gör att stroganoffen kan lagas snabbt; nötbog kräver långkok."},{"title":"Stek i omgångar","body":"Annars svalnar pannan och köttet blir gråkokt."},{"title":"Svampen ska få färg","body":"Det ger mer smak och mindre vattnig sås."},{"title":"Köttet sist","body":"Långkok av mör ryggbiff riskerar att ge torrt kött."}],"sources":[["Arla – Biff Stroganoff","https://www.arla.se/recept/biff-stroganoff/"],["Arla – Biff Stroganoff med syrad grädde","https://www.arla.se/recept/biff-stroganoff-med-syrad-gradde/"],["ICA – Biff Stroganoff (långkok)","https://www.ica.se/recept/biff-stroganoff-713113/"]],"tags":["Nötkött","Festmat"],"countryCode":"RU","countryName":"Ryssland","countryFlag":"🇷🇺","countryNote":"Rysk stroganofftradition, svensk hemanpassning.","nutrition":{"kcal":790,"protein":36,"carbs":63,"fat":41,"per":"portion","servings":4,"estimated":true},"shoppingTips":["500 g ryggbiff är en praktisk inköpsmängd – välj gärna över disk om färdiga bitar har annan vikt.","250 g champinjoner passar ofta en vanlig ask. 2 dl crème fraîche och 1 dl grädde går att handla i svenska mejeriförpackningar; resten av grädden kan frysas i portioner."]},{"id":"semlor","name":"Semlor","subtitle":"Luftiga kardemummabullar med mandelfyllning och vispgrädde","category":"Bakverk & fika","emoji":"🥯","tone":"butter","badge":"Fettisdagsklassiker","yieldBase":"12 stora semlor","yields":[6,0,12,0,24,0],"time":"Cirka 3 tim + svalning","difficulty":"Medel","temp":"225°C","intro":"Stora mjuka kardemummabullar fyllda med krämig mandelmassa, lite bullinkråm och luftig osötad grädde, pudrade med florsocker.","origin":"Utgår från Arlas klassiska semlor med fördeg och deras traditionella fyllning, jämförd med ICA:s klassiska semlor och Arla Pro. Med mer mandelmassa och grädde än Arlas lilla grundfyllning blir detta en generös konditorivariant.","groups":[{"title":"Kardemummabullar","items":[{"name":"Standardmjölk","qty":2.5,"unit":"dl","extra":"rumstempererad","fixed":""},{"name":"Färsk jäst","qty":25,"unit":"g","extra":"för söta degar","fixed":""},{"name":"Vetemjöl special","qty":500,"unit":"g","extra":"börja med cirka 470 g","fixed":""},{"name":"Ägg","qty":1,"unit":"st","extra":"till degen","fixed":""},{"name":"Strösocker","qty":1,"unit":"dl","extra":"cirka 90 g","fixed":""},{"name":"Smör","qty":100,"unit":"g","extra":"rumsvarmt","fixed":""},{"name":"Salt","qty":0.5,"unit":"tsk","extra":"","fixed":""},{"name":"Kardemummakärnor","qty":2,"unit":"tsk","extra":"mortlade","fixed":""}]},{"title":"Pensling","items":[{"name":"Ägg","qty":1,"unit":"st","extra":"uppvispat; allt går kanske inte åt","fixed":""}]},{"title":"Mandelfyllning","items":[{"name":"Mandelmassa","qty":300,"unit":"g","extra":"","fixed":""},{"name":"Standardmjölk","qty":0.75,"unit":"dl","extra":"justera till bredbar konsistens","fixed":""},{"name":"Mandel","qty":40,"unit":"g","extra":"rostad och grovhackad, valfritt","fixed":""}]},{"title":"Grädde och garnering","items":[{"name":"Vispgrädde","qty":5,"unit":"dl","extra":"kall","fixed":""},{"name":"Florsocker","qty":1,"unit":"msk","extra":"till pudring","fixed":""}]}],"steps":[{"title":"Börja med fördeg","body":"Smula jästen i bunke, lös upp i 2,5 dl mjölk. Blanda i cirka 250 g av mjölet och låt stå övertäckt 15–20 minuter."},{"title":"Knåda degen","body":"Tillsätt ägg, socker, salt, mortlad kardemumma och merparten av resterande mjöl. Arbeta in mjukt smör i omgångar. Knåda 8–12 minuter tills slät och elastisk. Tillsätt bara mer mjöl om det behövs."},{"title":"Första jäsning","body":"Låt jäsa övertäckt cirka 35–45 minuter så degen blir märkbart luftig."},{"title":"Rulla jämna bullar","body":"Dela i 12 lika stora delar och rundriv till släta bullar med spänd yta. Lägg glest på papprad plåt."},{"title":"Andra jäsning","body":"Låt jäsa övertäckta cirka 60–90 minuter tills bullarna blivit luftiga och betydligt större. Förvärm ugnen till 225°C över- och undervärme."},{"title":"Pensla och grädda","body":"Pensla tunt med uppvispat ägg. Grädda mitt i ugnen 8–11 minuter tills gyllene och genomgräddade (ungefär 94–98°C i mitten). Låt svalna helt på galler under bakduk."},{"title":"Blanda mandelfyllning","body":"Skär ett trekantigt lock på varje bulle och gröp ur lite inkråm. Riv mandelmassan och rör ihop med lite av inkråmet, mjölk och eventuellt rostad hackad mandel. Fyllningen ska bli mjuk och spritsbar, inte rinnig."},{"title":"Vispa grädden","body":"Vispa 5 dl kylskåpskall grädde till mjuka men hållbara toppar. Fyll bullarna med mandelröra och spritsa sedan grädden ovanpå."},{"title":"Servera","body":"Lägg på lock och sikta över florsocker. Montera helst strax före servering; förvara ofyllda bullar i frys vid behov."}],"tips":[{"title":"Mortlad kardemumma","body":"Hela kärnor som mortlas färska ger tydligare arom än gammalt färdigmalt pulver."},{"title":"Spara på mjölet","body":"En mjuk och välknådad deg ger saftigare bullar."},{"title":"Jäs ordentligt","body":"Stressa inte andra jäsningen; den avgör höjd och luftighet."},{"title":"Gör fyllningen mjuk","body":"Blanda mandelmassa med inkrom och lite mjölk så den inte blir hård."},{"title":"Montera sent","body":"Grädden och mandelfyllningen håller bäst kvalitet när de läggs på nära servering."}],"sources":[["Arla – Semlor","https://www.arla.se/recept/semlor/"],["ICA – Klassiska semlor","https://www.ica.se/recept/klassiska-semlor-292482/"],["Arla – Mandelmassa till semlor","https://www.arla.se/recept/klassisk-fyllning-till-semlor/"]],"tags":["Vegetariskt","Ugn","Festmat"],"countryCode":"SE","countryName":"Sverige","countryFlag":"🇸🇪","countryNote":"Svensk semla och fettisdagsbulle.","nutrition":{"kcal":545,"protein":10,"carbs":58,"fat":31,"per":"styck","servings":12,"estimated":true},"shoppingTips":["25 g jäst motsvarar ett halvt 50 g-paket; resten kan frysas kort eller användas för en annan deg.","Mandelmassa 300 g kan köpas som en hel förpackning eller i större förpackning efter sortiment. Vispgrädde 5 dl är en vanlig storlek."]},{"id":"gulaschsoppa","name":"Gulaschsoppa","subtitle":"Ungersk paprikasoppa med långkokt högrev, potatis och kummin","category":"Världens kök","emoji":"🥘","tone":"chocolate","badge":"Ungersk nationalklassiker","yieldBase":"6 portioner","yields":[3,0,6,0,12,0],"time":"2½–3 tim","difficulty":"Enkel–medel","temp":"Långkok på spis","intro":"Mustig ungersk gulyásleves med långkokt högrev, sött paprikapulver, lök, kummin och potatis. Tydligt en soppa – inte köttfärsgryta eller krämig paprika-stroganoff.","origin":"Huvudkällor från ungersk mattradition: Taste Hungary och Offbeat Budapest, jämförda med ICAs svenska gulaschsoppa. Ungersk paprika och kummin är nyckeln, men ingredienserna finns i svenska matbutiker. Gräddfil är inte del av det traditionella grundreceptet.","groups":[{"title":"Kött och grönsaker","items":[{"name":"Högrev","qty":700,"unit":"g","extra":"benfri, skuren i cirka 2 cm kuber","fixed":""},{"name":"Gul lök","qty":2,"unit":"st","extra":"medelstora","fixed":""},{"name":"Vitlöksklyftor","qty":3,"unit":"st","extra":"","fixed":""},{"name":"Röd paprika","qty":1,"unit":"st","extra":"","fixed":""},{"name":"Gul paprika","qty":1,"unit":"st","extra":"","fixed":""},{"name":"Morötter","qty":2,"unit":"st","extra":"","fixed":""},{"name":"Fast potatis","qty":500,"unit":"g","extra":"","fixed":""},{"name":"Tomater","qty":2,"unit":"st","extra":"medelstora","fixed":""}]},{"title":"Soppa och kryddor","items":[{"name":"Rapsolja","qty":2,"unit":"msk","extra":"","fixed":""},{"name":"Milt paprikapulver","qty":3,"unit":"msk","extra":"gärna ungerskt om lätt att hitta","fixed":""},{"name":"Kummin, malen eller stött","qty":1,"unit":"tsk","extra":"svensk kummin, inte spiskummin","fixed":""},{"name":"Lagerblad","qty":2,"unit":"st","extra":"","fixed":""},{"name":"Köttbuljong","qty":1.5,"unit":"l","extra":"färdigblandad eller vatten + tärningar","fixed":""},{"name":"Salt och svartpeppar","qty":null,"unit":"","extra":"Efter smak","fixed":"Efter smak"},{"name":"Persilja","qty":0.5,"unit":"kruka","extra":"valfritt vid servering","fixed":""}]}],"steps":[{"title":"Förbered råvarorna","body":"Skär högrev i 2 cm tärningar. Finhacka lök och vitlök, tärna paprikor och tomater, skiva morötter och skala potatisen; skär potatisen i större kuber och spara till senare."},{"title":"Mjuka löken","body":"Värm olja i tjockbottnad gryta. Fräs löken på medelvärme 8–10 minuter tills mjuk och glansig, utan mörkbryning. Tillsätt vitlök kort mot slutet."},{"title":"Skydda paprikapulvret","body":"Ta grytan från värmen. Rör ner paprikapulver och kummin snabbt i fettet och häll genast på cirka 1 dl buljong så att kryddorna inte bränns och blir bittra."},{"title":"Tillsätt köttet","body":"Vänd ner högrev och rör om. Tillsätt tomat, paprika, lagerblad och återstående buljong så att köttet täcks väl."},{"title":"Sjud länge","body":"Låt koka upp och sänk värmen. Sjud under delvis pålagt lock cirka 1,5–2 timmar eller tills köttet börjar bli mört. Rör om ibland och späd med vatten om det behövs."},{"title":"Potatis och morötter sist","body":"Tillsätt morötter och potatis. Sjud ytterligare cirka 20–30 minuter tills kött och grönsaker är möra. Ta bort lagerblad. Soppan ska vara buljongig men matig, inte en tjock gryta."},{"title":"Smaka av","body":"Smaka av med salt och svartpeppar och eventuellt lite mer paprikapulver om smaken behöver rundas av. Strö över persilja om du vill och servera med gott bröd."}],"tips":[{"title":"Använd riktig högrev","body":"Långkok gör en billigare och smakrik styckdetalj mör."},{"title":"Bränn inte paprikapulvret","body":"Paprikapulver blir bittert om det steks för hett; rör ner från värmen och späd direkt."},{"title":"Kummin, inte spiskummin","body":"Ungersk caraway motsvarar svensk kummin. Spiskummin ger fel smakprofil."},{"title":"Soppan ska vara buljongig","body":"Gulyásleves är inte samma sak som en tjock pörkölt-gryta."},{"title":"Grönsaker sent","body":"Potatis och morötter ska behålla formen efter långkoket."}],"sources":[["Taste Hungary – Hungarian Gulyás","https://tastehungary.com/journal/hungarian-gulyas-goulash-recipe/"],["Offbeat Budapest – Goulash Soup","https://www.offbeatbudapest.com/hungarian-food-recipes/goulash-soup-guly%C3%A1sleves/"],["ICA – Gulaschsoppa","https://www.ica.se/recept/gulaschsoppa-1414/"]],"tags":["Nötkött","Långkok","Potatis"],"countryCode":"HU","countryName":"Ungern","countryFlag":"🇭🇺","countryNote":"Ungersk gulyásleves – matig paprikasoppa.","nutrition":{"kcal":405,"protein":31,"carbs":26,"fat":19,"per":"portion","servings":6,"estimated":true},"shoppingTips":["Högrev kan köpas efter vikt i köttdisken. Ett paket på cirka 700–800 g är praktiskt och lite extra kött skadar inte balansen.","500 g potatis är halva en 1 kg-påse. Buljong görs enkelt av vatten och koncentrerad fond eller tärning.","Använd vanligt milt paprikapulver och svensk kummin; rökt paprika och spiskummin ger en annan smak."]},{"id":"kalops","name":"Kalops","subtitle":"Långkokt högrev med kryddpeppar, morötter och rödbetor","category":"Svensk husman","emoji":"🥘","tone":"chocolate","badge":"Svenskt långkok","yieldBase":"4 portioner","yields":[2,0,4,0,8,0],"time":"2½–3 tim","difficulty":"Enkel–medel","temp":"Sjudning på spis","intro":"En klassisk svensk kalops där högreven får sjuda långsamt med gul lök, kryddpeppar och lagerblad tills köttet blir smältande mört. Serveras med kokt potatis och inlagda rödbetor.","origin":"Utgår från ICA:s högt betygsatta Klassisk kalops (4,1/5; 908 röster), med kött- och tillagningsteknik jämförd med Arla och Köket. Buljongmängden anpassas för en smakrik sås utan överflödig vätska.","groups":[{"title":"Kalops","items":[{"name":"Högrev, benfri","qty":800,"unit":"g","extra":"i cirka 3 cm tärningar","fixed":""},{"name":"Gula lökar","qty":2,"unit":"st","extra":"skurna i klyftor","fixed":""},{"name":"Morötter","qty":3,"unit":"st","extra":"cirka 300 g, i tjocka skivor","fixed":""},{"name":"Smör","qty":25,"unit":"g","extra":"","fixed":""},{"name":"Rapsolja","qty":1,"unit":"msk","extra":"","fixed":""},{"name":"Kryddpepparkorn","qty":12,"unit":"st","extra":"hela, lätt krossade","fixed":""},{"name":"Lagerblad","qty":2,"unit":"st","extra":"","fixed":""},{"name":"Vatten","qty":7,"unit":"dl","extra":"tillsätt lite mer vid behov","fixed":""},{"name":"Koncentrerad kalvfond","qty":1.5,"unit":"msk","extra":"","fixed":""},{"name":"Vetemjöl","qty":2,"unit":"msk","extra":"till redning","fixed":""},{"name":"Kallt vatten till redning","qty":3,"unit":"msk","extra":"","fixed":""},{"name":"Salt","qty":1,"unit":"tsk","extra":"börja försiktigt; anpassa till fonden","fixed":""},{"name":"Svartpeppar","qty":2,"unit":"krm","extra":"","fixed":""}]},{"title":"Till servering","items":[{"name":"Potatis, fast eller mjölig","qty":800,"unit":"g","extra":"","fixed":""},{"name":"Inlagda rödbetor","qty":200,"unit":"g","extra":"cirka en liten burk eller del av större","fixed":""},{"name":"Färsk persilja","qty":null,"unit":"","extra":"Valfri garnering","fixed":"Valfri garnering"}]}],"steps":[{"title":"Förbered","body":"Skär högreven i jämna tärningar och torka köttet. Klyfta löken och skiva morötterna. Ta fram en tjockbottnad gryta."},{"title":"Bryn köttet","body":"Hetta upp smör och olja. Bryn köttet i två omgångar tills det får fin stekyta; salta lätt. Lägg tillbaka allt kött i grytan."},{"title":"Bygg grytan","body":"Tillsätt lök, lagerblad och lätt krossad kryddpeppar. Häll på vatten och kalvfond och skrapa upp steksmaken. Vätskan ska nästan täcka köttet."},{"title":"Sjud tills mört","body":"Låt koka upp och skumma av om det behövs. Sänk värmen, lägg på lock på glänt och sjud mycket försiktigt 1½–2 timmar tills köttet börjar bli mört. Rör om ibland."},{"title":"Tillsätt morötter","body":"Lägg i morötterna och sjud cirka 20–30 minuter till, tills både kött och morötter är möra."},{"title":"Red såsen","body":"Rör mjöl slätt med kallt vatten. Häll ner lite i taget under omrörning och sjud minst 5 minuter så att mjölsmaken försvinner och såsen blir lagom simmig. Späd vid behov."},{"title":"Koka potatisen","body":"Koka skalad potatis mjuk i saltat vatten under tiden grytan färdigställs. Häll av och låt ånga av."},{"title":"Smaka av och servera","body":"Plocka bort lagerblad. Smaka av med salt och svartpeppar. Servera kalopsen med potatis och inlagda rödbetor."}],"tips":[{"title":"Tålamod gör högreven mör","body":"Sjud långsamt och bedöm köttet med gaffel i stället för att gå enbart på tiden."},{"title":"Kryddpeppar är signaturen","body":"Använd kryddpeppar och lagerblad; spiskummin och paprikapulver hör inte till klassisk kalops."},{"title":"Salta efter fond","body":"Koncentrerad fond kan vara salt. Smaka därför av i slutet."},{"title":"Koka inte hårt","body":"Kraftigt kok kan göra högreven torrare innan bindväven hunnit mjukna."}],"sources":[["ICA – Klassisk kalops","https://www.ica.se/recept/klassisk-kalops-632631/"],["Arla – Kalops","https://www.arla.se/recept/kalops/"]],"tags":["Långkok","Potatis"],"countryCode":"SE","countryName":"Sverige","countryFlag":"🇸🇪","countryNote":"Traditionell svensk husmanskost.","nutrition":{"kcal":710,"protein":51,"carbs":62,"fat":28,"per":"portion","servings":4,"estimated":true},"shoppingTips":["Köp cirka 800 g benfri högrev; butiksförpackningar varierar, så köp över disk om det passar bättre.","En 1 kg-påse potatis räcker och ger lite marginal. Kryddpeppar säljs i kryddhyllan; välj hel och krossa lätt.","Rödbetor på burk är ett smidigt tillbehör."]},{"id":"janssons-frestelse","name":"Janssons frestelse","subtitle":"Krämig potatisgratäng med ansjovis, lök och gyllene täcke","category":"Svensk husman","emoji":"🥔","tone":"butter","badge":"Svensk högtidsklassiker","yieldBase":"8 bufféportioner","yields":[4,0,8,0,16,0],"time":"2–2½ tim + vila","difficulty":"Enkel–medel","temp":"175°C","intro":"Klassisk, långsamt gräddad Jansson där potatis, mjukstekt lök och svensk ansjovis kokar ihop till en rik, krämig gratäng med frasigt ströbrödstäcke.","origin":"Bygger på ICA:s Janssons frestelse (4,0/5; 698 röster), jämförd med deras gammaldags variant (4,6/5; 79 röster). Lång gräddning och gott om vilotid är viktigare än att skruva upp ugnsvärmen.","groups":[{"title":"Gratäng","items":[{"name":"Fast potatis","qty":1500,"unit":"g","extra":"i tunna stavar, inte riven","fixed":""},{"name":"Gula lökar","qty":3,"unit":"st","extra":"stora, tunt skivade","fixed":""},{"name":"Svenska ansjovisfiléer","qty":300,"unit":"g","extra":"3 burkar à 100 g med spad; använd även ansjovisspadet","fixed":""},{"name":"Vispgrädde","qty":4,"unit":"dl","extra":"","fixed":""},{"name":"Standardmjölk","qty":2,"unit":"dl","extra":"","fixed":""},{"name":"Smör","qty":75,"unit":"g","extra":"25 g till lök/form, resten på toppen","fixed":""},{"name":"Ströbröd","qty":2,"unit":"msk","extra":"","fixed":""},{"name":"Vitpeppar","qty":1,"unit":"krm","extra":"salt behövs sällan med ansjovisen","fixed":""}]}],"steps":[{"title":"Förbered","body":"Sätt ugnen på 175°C över- och undervärme. Smöra en ugnsform cirka 22 × 30 cm. Skala potatis och lök."},{"title":"Strimla potatis","body":"Skär potatisen i tunna tändsticksstavar, ungefär 3–4 mm. Skölj inte efteråt – stärkelsen hjälper gratängen att binda."},{"title":"Mjuka löken","body":"Skiva lök tunt och stek mjuk och genomskinlig i cirka 25 g smör på låg–medelvärme utan att bryna."},{"title":"Varva","body":"Häll av ansjovisburkarna och spara spadet. Varva potatis, lök och ansjovis i formen. Lägg potatis underst och överst. Krydda sparsamt med vitpeppar."},{"title":"Slå på gräddmjölk","body":"Värm grädde och mjölk till precis under kokning. Blanda med ansjovisspadet och häll jämnt över formen."},{"title":"Toppa","body":"Strö ströbröd över potatisen och klicka ut resterande smör."},{"title":"Baka långsamt","body":"Grädda i nedre delen av ugnen cirka 1½–2 timmar tills potatisstavarna är helt mjuka och ytan gyllene. Täck löst med folie om toppen får färg för tidigt."},{"title":"Låt vila","body":"Ta ut gratängen och låt vila 20–30 minuter innan servering. Då sätter sig såsen och blir krämig i stället för rinnig."}],"tips":[{"title":"Rätt ansjovis","body":"Svensk ansjovis är kryddad skarpsill, inte salta sardellfiléer eller italienska anchovies. Smaken blir annars helt annan."},{"title":"Inte för hög värme","body":"Långsam tillagning hjälper potatisen att mjukna utan att grädden skär sig."},{"title":"Förbered dagen före","body":"Kan bakas i förväg, kylas snabbt och värmas varsamt med lite extra grädde."},{"title":"Rätt portionsstorlek","body":"Åtta bufféportioner eller cirka 4–6 större portioner som huvudrätt."}],"sources":[["ICA – Janssons frestelse","https://www.ica.se/recept/janssons-frestelse-3682/"],["ICA – Gammaldags Janssons frestelse","https://www.ica.se/recept/gammaldags-janssons-frestelse-724714/"]],"tags":["Ugn","Potatis","Festmat","Fisk & skaldjur"],"countryCode":"SE","countryName":"Sverige","countryFlag":"🇸🇪","countryNote":"Svensk julbords- och vickningsklassiker.","nutrition":{"kcal":520,"protein":11,"carbs":43,"fat":33,"per":"portion","servings":8,"estimated":true},"shoppingTips":["Tre 100 g-burkar svensk ansjovis ger rätt proportion för stor gratäng; glöm inte att spara spadet.","1,5 kg fast potatis passar ofta en större påse. Köp minst 5 dl vispgrädde och använd 4 dl.","Välj finmalet vanligt ströbröd, inte pankoströbröd."]},{"id":"fransk-loksoppa","name":"Fransk löksoppa","subtitle":"Söt karamelliserad lök i mustig buljong med ostgratinerat bröd","category":"Världens kök","emoji":"🧅","tone":"chocolate","badge":"Fransk bistroklassiker","yieldBase":"4 portioner","yields":[2,0,4,0,8,0],"time":"75–90 min","difficulty":"Enkel–medel","temp":"Spis + grill","intro":"Djupt gyllene, långsamt karamelliserad lök ger naturlig sötma och mustig smak till en klassisk fransk löksoppa. Servera med frasigt ostgratinerat baguettebröd.","origin":"Utgår från ICA:s franska löksoppa (4,5/5; 109 röster) och fransk bistroteknik för långsam lökkaramellisering. Vår version använder grönsaksbuljong för en vegetarisk huvudrätt.","groups":[{"title":"Löksoppa","items":[{"name":"Gul lök","qty":1000,"unit":"g","extra":"cirka 7–8 medelstora","fixed":""},{"name":"Smör","qty":50,"unit":"g","extra":"","fixed":""},{"name":"Olivolja","qty":1,"unit":"msk","extra":"","fixed":""},{"name":"Vitlöksklyftor","qty":2,"unit":"st","extra":"","fixed":""},{"name":"Torkad timjan","qty":1,"unit":"tsk","extra":"eller cirka 1 msk färsk","fixed":""},{"name":"Strösocker","qty":1,"unit":"tsk","extra":"valfritt, bara om löken behöver hjälp","fixed":""},{"name":"Torrt vitt vin","qty":2,"unit":"dl","extra":"alternativ: alkoholfritt vitt vin","fixed":""},{"name":"Grönsaksbuljong","qty":12,"unit":"dl","extra":"gärna fyllig, färdigblandad","fixed":""},{"name":"Lagerblad","qty":2,"unit":"st","extra":"","fixed":""},{"name":"Vitvinsvinäger","qty":2,"unit":"tsk","extra":"","fixed":""},{"name":"Salt och svartpeppar","qty":null,"unit":"","extra":"Efter smak","fixed":"Efter smak"}]},{"title":"Ostgratinerade bröd","items":[{"name":"Baguette","qty":0.5,"unit":"st","extra":"cirka 8 skivor","fixed":""},{"name":"Lagrad ost","qty":120,"unit":"g","extra":"gärna Gruyère eller annan smakrik ost; välj vegetarisk ystenzym om så önskas","fixed":""}]}],"steps":[{"title":"Skiva löken","body":"Skala löken och skiva jämnt och tunt. Det ser mycket ut men den sjunker ihop kraftigt."},{"title":"Karamellisera ordentligt","body":"Smält smör med olivolja i en stor tjockbottnad gryta. Stek löken med en nypa salt på medellåg värme 35–50 minuter under omrörning tills djupt gyllene och mjuk. Sänk värmen om den hotar att brännas."},{"title":"Tillsätt smak","body":"Rör ner finhackad vitlök, timjan och eventuellt lite socker. Fräs kort. Häll i vinet och skrapa loss den rostade löksmaken från bottnen. Låt reducera någon minut."},{"title":"Sjud soppan","body":"Tillsätt grönsaksbuljong och lagerblad. Låt sjuda lugnt cirka 20 minuter. Ta bort lagerbladen och smaka av med vitvinsvinäger, salt och peppar."},{"title":"Rosta brödet","body":"Sätt ugnens grillelement på. Rosta baguetteskivorna lätt på båda sidor i ugnen så att de inte suger upp soppan lika snabbt."},{"title":"Gratinera","body":"Fördela varm soppa i fyra ugnståliga skålar. Lägg brödet ovanpå och fördela riven ost. Gratinera högt upp 2–4 minuter tills osten bubblar och fått färg. Alternativt gratinera ostbröden på plåt och lägg ovanpå soppan."},{"title":"Servera","body":"Servera genast och var försiktig med heta skålar."}],"tips":[{"title":"Tiden på löken är avgörande","body":"Hoppa inte över långsam karamellisering; en hastigt stekt lök ger mycket grundare smak."},{"title":"Vegetarisk buljong","body":"Grönsaksbuljong fungerar bra; traditionella bistrorecept kan även använda nötbuljong."},{"title":"Brödet först i ugnen","body":"Förrostat bröd ger bättre yta och mindre risk för blöt skorpa."},{"title":"Ost med rätt sälta","body":"Smaka av soppan innan osten läggs på – lagrad ost tillför mycket sälta."}],"sources":[["ICA – Fransk löksoppa","https://www.ica.se/recept/fransk-loksoppa-730017/"],["BBC Good Food – French onion soup","https://www.bbcgoodfood.com/recipes/french-onion-soup"]],"tags":["Vegetariskt","Ost","Ugn"],"countryCode":"FR","countryName":"Frankrike","countryFlag":"🇫🇷","countryNote":"Fransk bistrosoppa; grönsaksbuljong i denna variant.","nutrition":{"kcal":480,"protein":15,"carbs":46,"fat":24,"per":"portion","servings":4,"estimated":true},"shoppingTips":["1 kg gul lök är praktiskt att köpa i påse. Köp en halv baguette eller frys in resten.","En ost i bit på cirka 150 g räcker; för strikt vegetarisk version, kontrollera att ystenzymet inte är animaliskt.","Torrt vitt matlagningsvin finns i matbutiken; använd alkoholfritt om önskat."]},{"id":"pad-thai","name":"Pad Thai med räkor","subtitle":"Thailändska risnudlar med tamarind, räkor, jordnötter och lime","category":"Världens kök","emoji":"🍜","tone":"butter","badge":"Thailändsk klassiker","yieldBase":"4 portioner","yields":[2,0,4,0,8,0],"time":"45–60 min","difficulty":"Medel","temp":"Wok på spis","intro":"Pad Thai med balanserad syrlig, söt och salt sås, saftiga räkor, ägg, böngroddar, krossade jordnötter och lime. Vår svenska butiksvariant använder riktiga risnudlar och tamarind när det går att hitta.","origin":"Källjämförelse: RecipeTin Eats Pad Thai (4,93/5; 453 röster) och Pailin Chongchitnants Hot Thai Kitchen Authentic Pad Thai (4,8/5; 122 recensioner), med The Woks of Life som komplettering. Receptet är en förenklad men tamarindbaserad hemtolkning.","groups":[{"title":"Nudlar och protein","items":[{"name":"Risnudlar, platta","qty":250,"unit":"g","extra":"cirka 3–5 mm breda","fixed":""},{"name":"Skalade råa räkor","qty":400,"unit":"g","extra":"tinade om frysta; färdigkokta läggs i allra sist","fixed":""},{"name":"Ägg","qty":3,"unit":"st","extra":"","fixed":""},{"name":"Fast tofu","qty":200,"unit":"g","extra":"valfritt för mer traditionell textur","fixed":""},{"name":"Böngroddar","qty":150,"unit":"g","extra":"","fixed":""},{"name":"Salladslök","qty":4,"unit":"st","extra":"eller kinesisk gräslök","fixed":""},{"name":"Schalottenlök","qty":2,"unit":"st","extra":"","fixed":""},{"name":"Vitlöksklyftor","qty":3,"unit":"st","extra":"","fixed":""},{"name":"Neutral olja","qty":3,"unit":"msk","extra":"","fixed":""}]},{"title":"Pad Thai-sås","items":[{"name":"Tamarindpuré för thailändsk mat","qty":4,"unit":"msk","extra":"flytande, INTE koncentrerad svart tamarindpasta","fixed":""},{"name":"Fisksås","qty":4,"unit":"msk","extra":"","fixed":""},{"name":"Farinsocker","qty":4,"unit":"msk","extra":"eller motsvarande palmsocker","fixed":""},{"name":"Ostronsås","qty":1.5,"unit":"msk","extra":"ger rundare restaurangsmak","fixed":""},{"name":"Vatten","qty":0.5,"unit":"dl","extra":"till såsen vid behov","fixed":""}]},{"title":"Topping","items":[{"name":"Jordnötter, rostade osaltade","qty":75,"unit":"g","extra":"grovhackade","fixed":""},{"name":"Lime","qty":2,"unit":"st","extra":"i klyftor","fixed":""},{"name":"Chiliflakes","qty":1,"unit":"tsk","extra":"efter smak","fixed":""}]}],"steps":[{"title":"Blötlägg nudlarna","body":"Lägg risnudlar i ljummet vatten enligt förpackningens anvisning tills de böjer sig lätt men fortfarande är lite fasta. Häll av ordentligt – koka inte sönder dem i förväg."},{"title":"Gör såsen","body":"Rör samman tamarindpuré, fisksås, farinsocker och ostronsås. Smaka av: tydligt syrligt, sött och salt. Om tamarinden är koncentrerad behöver mängden justeras ned kraftigt; följ produktens instruktioner."},{"title":"Förbered allt","body":"Hacka schalottenlök och vitlök, skär salladslök, tärna tofu och grovhacka nötter. Tina och torka räkorna ordentligt. Ställ allt inom räckhåll."},{"title":"Tillaga i två omgångar","body":"Dela ingredienserna i två lika stora delar. En överfull panna ångkokar nudlarna; använd helst en stor wok på hög värme."},{"title":"Stek räkor och tofu","body":"Hetta upp lite olja och stek råa räkor snabbt tills de är ogenomskinliga och genomstekta. Lyft upp. Bryn tofun lätt om du använder den."},{"title":"Bygg woken","body":"Fräs schalottenlök och vitlök kort i mer olja. Lägg i hälften av nudlarna och såsen. Vänd energiskt och tillsätt en skvätt vatten om det behövs, tills nudlarna är mjuka och har tagit upp såsen."},{"title":"Ägg och grönsaker","body":"Skjut nudlarna åt sidan, knäck ner äggen (fördela mellan omgångarna) och låt stelna lätt innan de vänds ihop med nudlarna. Rör ner böngroddar, salladslök, tofu och räkor i slutet. Upprepa med resterande ingredienser."},{"title":"Servera genast","body":"Lägg upp och strö över jordnötter och lite chili. Pressa rikligt med lime över vid bordet. Pad Thai blir bäst direkt från pannan."}],"tips":[{"title":"Viktig tamarindskillnad","body":"Thailändsk flytande tamarindpuré är betydligt mildare än mörk indisk koncentrerad pasta. Byt inte 1:1."},{"title":"Woka inte för mycket samtidigt","body":"Två omgångar ger rätt stekyta och hindrar nudlarna från att bli degiga."},{"title":"Räkor får inte överstekas","body":"Råa räkor tillagas snabbt; om du använder redan kokta räkor ska de bara värmas kort på slutet."},{"title":"Ingen ketchup i grundreceptet","body":"Tamarind, fisksås och socker ger den klassiska grundsmaken."},{"title":"Svensk tillgång","body":"Om tamarind saknas i närmaste butik är det bättre att planera inköp i asiatisk livsmedelsbutik än att påstå att lime och ketchup ger identiskt resultat."}],"sources":[["RecipeTin Eats – Pad Thai","https://www.recipetineats.com/chicken-pad-thai/"],["Hot Thai Kitchen – Authentic Pad Thai","https://hot-thai-kitchen.com/best-pad-thai/"],["The Woks of Life – Shrimp Pad Thai","https://thewoksoflife.com/shrimp-pad-thai/"]],"tags":["Fisk & skaldjur","Snabbt"],"countryCode":"TH","countryName":"Thailand","countryFlag":"🇹🇭","countryNote":"Thailändsk wokklassiker; förenklad hemanpassning.","nutrition":{"kcal":675,"protein":38,"carbs":79,"fat":23,"per":"portion","servings":4,"estimated":true},"shoppingTips":["Risnudlar finns ofta i påsar på 200–250 g. Ta en 250 g-påse; komplettera med råa frysta skalade räkor, cirka 400 g.","Tamarindpuré och fisksås kan finnas på större ICA/Coop och i asiatiska butiker. Välj en flytande thailändsk eller vietnamesisk puré, inte koncentrerad indisk pasta.","Tofu är frivilligt och kan köpas i cirka 200 g-förpackning. Böngroddar och salladslök används direkt för bästa fräschör."]},{"id":"svamprisotto","name":"Krämig svamprisotto","subtitle":"Gyllenstekt svamp, arborioris, parmesan och smör","category":"Världens kök","emoji":"🍄","tone":"butter","badge":"Italiensk risottoklassiker","yieldBase":"4 portioner","yields":[2,0,4,0,8,0],"time":"45–55 min","difficulty":"Medel","temp":"Spis","intro":"En klassisk italiensk risotto med mjuka risgryn i naturligt krämig sås, mustigt gyllenstekt svamp, vitt vin, smör och lagrad hårdost. Ingen grädde behövs för rätt konsistens.","origin":"Utgår från ICA:s Svamprisotto (4,3/5; 87 röster) och internationell risottoteknik. Jämförd med RecipeTin Eats svamprisotto och en långsamt avslutad risotto med smör och parmesan. Svampen steks separat för djupare smak.","groups":[{"title":"Svamp","items":[{"name":"Färska champinjoner eller skogschampinjoner","qty":500,"unit":"g","extra":"skivade","fixed":""},{"name":"Smör","qty":25,"unit":"g","extra":"till svampen","fixed":""},{"name":"Olivolja","qty":1,"unit":"msk","extra":"till svampen","fixed":""},{"name":"Vitlöksklyftor","qty":2,"unit":"st","extra":"","fixed":""},{"name":"Färsk timjan","qty":0.5,"unit":"kruka","extra":"eller 1 tsk torkad","fixed":""}]},{"title":"Risotto","items":[{"name":"Arborioris eller carnaroliris","qty":320,"unit":"g","extra":"cirka 4 dl, okokt","fixed":""},{"name":"Schalottenlök","qty":2,"unit":"st","extra":"finhackade","fixed":""},{"name":"Olivolja","qty":1,"unit":"msk","extra":"","fixed":""},{"name":"Torrt vitt vin","qty":1.5,"unit":"dl","extra":"","fixed":""},{"name":"Grönsaksbuljong","qty":10,"unit":"dl","extra":"varm; ha lite extra vatten redo","fixed":""},{"name":"Smör","qty":40,"unit":"g","extra":"kallt, att avsluta med","fixed":""},{"name":"Parmesan eller vegetarisk lagrad hårdost","qty":80,"unit":"g","extra":"finriven","fixed":""},{"name":"Salt och svartpeppar","qty":null,"unit":"","extra":"Efter smak","fixed":"Efter smak"},{"name":"Färsk persilja","qty":0.5,"unit":"kruka","extra":"hackad, valfri","fixed":""}]}],"steps":[{"title":"Förbered buljongen","body":"Värm grönsaksbuljongen i en kastrull och håll den varm på låg värme. Skiva svampen, finhacka schalottenlök och vitlök."},{"title":"Stek svampen ordentligt","body":"Hetta upp 25 g smör och 1 msk olivolja i en stor panna. Stek svampen i omgångar på medelhög värme tills vätskan avdunstat och bitarna är gyllenbruna. Tillsätt vitlök och timjan sista minuten; salta lätt. Ta upp en tredjedel till topping."},{"title":"Fräs lök och ris","body":"Hetta upp 1 msk olivolja i en bred gryta. Fräs schalottenlök mjuk på medelvärme utan att bryna. Tillsätt riset och rör 1–2 minuter tills grynen blivit lätt genomskinliga i kanterna."},{"title":"Häll i vin","body":"Tillsätt vitt vin och rör tills det nästan kokat in."},{"title":"Koka risotton","body":"Häll på varm buljong 1–2 dl åt gången, rör då och då och fyll på när vätskan börjar tas upp. Fortsätt cirka 17–22 minuter tills riset är al dente. Det ska finnas lite vätska kvar som kan röra sig mjukt i grytan."},{"title":"Vänd ner svampen","body":"När riset nästan är klart, vänd ner huvuddelen av svampen. Tillsätt eventuellt mer varm buljong så konsistensen är lös och krämig, inte kompakt."},{"title":"Avsluta med smör och ost","body":"Dra av från värmen. Rör kraftigt ner det kalla smöret och finriven ost tills risotton blir blank och sammanhängande. Smaka av med salt och peppar."},{"title":"Servera omedelbart","body":"Fördela i varma tallrikar, toppa med resten av svampen och eventuell persilja. Risotton ska sakta flyta ut på tallriken, inte stå som en hög."}],"tips":[{"title":"Ingen grädde behövs","body":"Riset släpper stärkelse; buljong, smör och ost skapar den traditionella krämigheten."},{"title":"Bryn svampen separat","body":"Svamp som steks för tätt kokar i sin egen vätska och får mindre rostad smak."},{"title":"Späd efter behov","body":"Buljongmängden varierar med rissort och värme. Ha mer varmt vatten redo."},{"title":"Servera direkt","body":"Risotto stelnar när den väntar. Servera hellre gästerna än låt risotton stå."},{"title":"Vegetarisk ost","body":"Äkta Parmigiano Reggiano använder animaliskt löpe; välj en hårdost med vegetariskt ystenzym om du vill ha en vegetarisk måltid."}],"sources":[["ICA – Svamprisotto","https://www.ica.se/recept/svamprisotto-1205/"],["RecipeTin Eats – Mushroom Risotto","https://www.recipetineats.com/mushroom-risotto/"],["ICA – Svamprisotto med vitlöksstekt broccoli","https://www.ica.se/recept/svamprisotto-med-vitloksstekt-broccoli-727264/"]],"tags":["Vegetariskt","Ost"],"countryCode":"IT","countryName":"Italien","countryFlag":"🇮🇹","countryNote":"Italiensk risottotradition; vegetariskt med ost utan animaliskt löpe.","nutrition":{"kcal":615,"protein":17,"carbs":76,"fat":26,"per":"portion","servings":4,"estimated":true},"shoppingTips":["500 g champinjoner motsvarar exempelvis två askar à 250 g.","Arborioris finns vanligtvis i 500 g-paket; använd 320 g och spara resten.","80 g lagrad ost kan köpas i bit och rivas vid tillagning. Vitt matlagningsvin fungerar."]},{"id":"chicken-parmesan","name":"Chicken Parmesan","subtitle":"Krispig panerad kyckling med tomatsås, mozzarella och parmesan","category":"Världens kök","emoji":"🍗","tone":"tomato","badge":"Italiensk-amerikansk klassiker","yieldBase":"4 portioner","yields":[2,0,4,0,8,0],"time":"55–70 min","difficulty":"Medel","temp":"Stekpanna + 225°C","intro":"Krispigt panerad saftig kyckling, fyllig italiensk tomatsås, smält mozzarella och parmesan. Servera med spaghetti för en klassisk italiensk-amerikansk middag.","origin":"Metod jämförd med RecipeTin Eats Chicken Parmigiana (uppdaterad 2026) och La Cucina Italiana. Panerad kyckling steks först, sås läggs på sparsamt och osten gratineras kort för att paneringen ska behålla krispigheten.","groups":[{"title":"Kyckling och panering","items":[{"name":"Kycklingbröstfilé","qty":600,"unit":"g","extra":"cirka 2 stora, delade på längden till 4 tunna filéer","fixed":""},{"name":"Vetemjöl","qty":1,"unit":"dl","extra":"","fixed":""},{"name":"Ägg","qty":2,"unit":"st","extra":"","fixed":""},{"name":"Pankoströbröd","qty":2,"unit":"dl","extra":"","fixed":""},{"name":"Parmesanost, finriven","qty":40,"unit":"g","extra":"till paneringen","fixed":""},{"name":"Torkad oregano","qty":1,"unit":"tsk","extra":"","fixed":""},{"name":"Salt","qty":1,"unit":"tsk","extra":"fördelas mellan kyckling, panering och sås","fixed":""},{"name":"Svartpeppar","qty":2,"unit":"krm","extra":"","fixed":""},{"name":"Olivolja eller rapsolja","qty":3,"unit":"msk","extra":"för stekning","fixed":""}]},{"title":"Tomatsås och ost","items":[{"name":"Krossade tomater","qty":400,"unit":"g","extra":"1 burk","fixed":""},{"name":"Gul lök","qty":1,"unit":"st","extra":"liten","fixed":""},{"name":"Vitlöksklyftor","qty":2,"unit":"st","extra":"","fixed":""},{"name":"Tomatpuré","qty":1,"unit":"msk","extra":"","fixed":""},{"name":"Olivolja","qty":1,"unit":"msk","extra":"","fixed":""},{"name":"Strösocker","qty":1,"unit":"tsk","extra":"endast vid behov, för att balansera tomaterna","fixed":""},{"name":"Färsk basilika","qty":0.5,"unit":"kruka","extra":"","fixed":""},{"name":"Mozzarella","qty":250,"unit":"g","extra":"2 bollar à 125 g, avrunna och skivade","fixed":""},{"name":"Parmesanost, finriven","qty":30,"unit":"g","extra":"ovanpå","fixed":""}]},{"title":"Servering","items":[{"name":"Spaghetti, okokt","qty":320,"unit":"g","extra":"","fixed":""},{"name":"Grönsallad","qty":null,"unit":"","extra":"Valfritt till servering","fixed":"Valfritt till servering"}]}],"steps":[{"title":"Gör tomatsåsen först","body":"Finhacka lök och vitlök. Fräs löken mjuk i olivolja cirka 5 minuter. Tillsätt vitlök och tomatpuré och fräs kort. Häll på krossade tomater och sjud 15–20 minuter tills såsen tjocknat. Rör ner hackad basilika och smaka av med salt, peppar och eventuellt lite socker."},{"title":"Förbered kycklingen","body":"Dela kycklingbrösten på längden till fyra tunna filéer. Banka lätt mellan bakplåtspapper till jämn tjocklek, cirka 1–1,5 cm. Torka torra och krydda med salt och peppar."},{"title":"Panera i tre steg","body":"Lägg mjöl i en tallrik, uppvispade ägg i en annan och panko blandat med 40 g parmesan och oregano i en tredje. Vänd kycklingen i mjöl, ägg och sist pankoblandningen. Tryck till lätt."},{"title":"Stek frasigt","body":"Hetta upp stekoljan i stor stekpanna på medelhög värme. Stek kycklingen i omgångar 2–3 minuter per sida tills gyllene. De behöver inte vara färdiga helt inuti ännu; de eftersteks i ugnen."},{"title":"Gratinera kort","body":"Värm ugnen till 225°C. Lägg de panerade filéerna i en ugnsform. Skeda bara lite tjock tomatsås mitt på varje filé så kanterna förblir krispiga. Fördela skivad, avtorkad mozzarella och 30 g parmesan ovanpå."},{"title":"Kontrollera temperaturen","body":"Gratinera cirka 8–12 minuter tills osten bubblar och kycklingens tjockaste del är genomstekt, helst minst 72°C i kärnan. Grilla eventuellt 1 minut mot slutet för färg, men vakta noggrant."},{"title":"Koka spaghetti","body":"Koka pastan al dente i saltat vatten medan kycklingen gratineras. Vänd med resterande tomatsås och lite pastavatten."},{"title":"Servera direkt","body":"Lägg upp pasta, toppa med Chicken Parmesan och färsk basilika. Servera genast för krispigaste panering."}],"tips":[{"title":"Krispig panering kräver lite sås","body":"Täck inte hela schnitzeln med tomatsås; lägg en klick i mitten och resten till pastan."},{"title":"Torka mozzarella","body":"Avrunnen mozzarella ger mindre vätska som annars mjukar upp paneringen."},{"title":"Jämn tjocklek","body":"Tunnt bankad kyckling hinner bli klar utan att paneringen bränns."},{"title":"Stek och gratinera direkt","body":"Rätten är bäst nygräddad; värmning dagen därpå ger mjukare panering."}],"sources":[["RecipeTin Eats – Chicken Parmigiana","https://www.recipetineats.com/chicken-parmigiana/"],["La Cucina Italiana – Chicken Parmigiana","https://www.lacucinaitaliana.com/italian-food/how-to-cook/how-to-make-chicken-parmigiana-italian-american-at-home"]],"tags":["Kyckling","Ost","Ugn"],"countryCode":"US","countryName":"USA","countryFlag":"🇺🇸","countryNote":"Italiensk-amerikansk kycklingparmigiana.","nutrition":{"kcal":940,"protein":65,"carbs":82,"fat":35,"per":"portion","servings":4,"estimated":true},"shoppingTips":["600 g kyckling passar två större bröst eller en mindre familjeförpackning; dela så alla filéer blir tunna.","Två mozzarella à 125 g används helt. Köp gärna en 400 g-burk krossade tomater.","Panko säljs ofta på asiatiska hyllan och ger krispigare panering än vanligt ströbröd."]},{"id":"kebabtallrik","name":"Kebabtallrik med pommes och egna såser","subtitle":"Svensk pizzeriaklassiker med krispiga pommes, sallad och röd/vit sås","category":"Snabbmat & street food","emoji":"🥙","tone":"tomato","badge":"Svensk pizzeriaklassiker","yieldBase":"4 portioner","yields":[2,0,4,0,8,0],"time":"50–60 min","difficulty":"Enkel","temp":"Ugn + stekpanna","intro":"Kebabtallrik i svensk pizzeriastil: rejält stekt kebabkött, frasiga pommes, isbergssallad och tomat med både vit vitlökssås och kryddig röd tomatsås.","origin":"Utgår från ICA:s Kebabtallrik med pommes (4,4/5; 22 röster), med egna såser baserade på ICA:s vita och röda kebabsåser. Två färdiga kebabförpackningar ger ett bra och realistiskt hemmarecept utan avancerad roterande grill.","groups":[{"title":"Kebab och tillbehör","items":[{"name":"Frysta pommes frites","qty":1000,"unit":"g","extra":"1 kg-påse","fixed":""},{"name":"Färdigt skivat kebabkött","qty":550,"unit":"g","extra":"exempelvis 2 förpackningar à 275 g","fixed":""},{"name":"Rapsolja","qty":2,"unit":"msk","extra":"till kebaben","fixed":""},{"name":"Isbergssallad","qty":0.5,"unit":"st","extra":"","fixed":""},{"name":"Tomater","qty":3,"unit":"st","extra":"","fixed":""},{"name":"Gurka","qty":0.5,"unit":"st","extra":"","fixed":""},{"name":"Rödlök","qty":1,"unit":"st","extra":"","fixed":""},{"name":"Feferoni, inlagd","qty":1,"unit":"dl","extra":"","fixed":""}]},{"title":"Vit kebabsås","items":[{"name":"Grekisk yoghurt 10 %","qty":2,"unit":"dl","extra":"","fixed":""},{"name":"Majonnäs","qty":1,"unit":"dl","extra":"","fixed":""},{"name":"Vitlöksklyftor","qty":2,"unit":"st","extra":"","fixed":""},{"name":"Flytande honung","qty":1,"unit":"tsk","extra":"","fixed":""},{"name":"Vatten","qty":1.5,"unit":"msk","extra":"","fixed":""},{"name":"Salt och svartpeppar","qty":null,"unit":"","extra":"Efter smak","fixed":"Efter smak"}]},{"title":"Röd kebabsås","items":[{"name":"Krossade tomater","qty":400,"unit":"g","extra":"1 burk","fixed":""},{"name":"Gul lök","qty":1,"unit":"st","extra":"liten, finhackad","fixed":""},{"name":"Vitlöksklyfta","qty":1,"unit":"st","extra":"","fixed":""},{"name":"Röd färsk chili","qty":1,"unit":"st","extra":"justera efter styrka","fixed":""},{"name":"Tomatpuré","qty":1,"unit":"msk","extra":"","fixed":""},{"name":"Rapsolja","qty":2,"unit":"tsk","extra":"","fixed":""},{"name":"Spiskummin","qty":1,"unit":"tsk","extra":"","fixed":""},{"name":"Strösocker","qty":1,"unit":"msk","extra":"","fixed":""},{"name":"Rödvinsvinäger","qty":2,"unit":"tsk","extra":"","fixed":""},{"name":"Salt","qty":0.5,"unit":"tsk","extra":"smaka av","fixed":""}]}],"steps":[{"title":"Röd sås först","body":"Hacka liten gul lök, vitlök och chili. Fräs i 2 tsk olja några minuter. Rör ner spiskummin och tomatpuré och fräs 30 sekunder. Tillsätt krossade tomater och sjud cirka 10–15 minuter."},{"title":"Avsluta röda såsen","body":"Rör ner socker, rödvinsvinäger och salt. Mixa såsen slät med stavmixer och låt svalna. Smaka av syra och hetta."},{"title":"Rör ihop vit sås","body":"Blanda yoghurt, majonnäs, finriven vitlök, honung och vatten. Smaka av med salt och peppar. Låt gärna stå kallt 20–30 minuter."},{"title":"Krispiga pommes","body":"Sätt ugnen på den temperatur som anges på pommespåsen, ofta 225°C. Fördela på två plåtar om det behövs; låt dem inte ligga för tätt. Grädda tills riktigt gyllene och frasiga, vänd efter halva tiden."},{"title":"Förbered salladen","body":"Strimla isbergssalladen, skiva tomater, gurka och rödlök tunt. Låt feferonin rinna av."},{"title":"Stek kebabköttet","body":"Hetta upp en stor stekpanna ordentligt med rapsolja. Stek kebabköttet i två omgångar så det får yta och är hett rakt igenom. Följ produktens tillagningsanvisning."},{"title":"Bygg tallrikarna","body":"Lägg pommes på fyra tallrikar, fördela kebaben ovanpå och lägg grönsaker och feferoni bredvid. Ringla rikligt med vit sås och en mindre mängd röd sås över."},{"title":"Servera direkt","body":"Servera omedelbart innan pommesen mjuknar av såsen. Ställ extra sås på bordet."}],"tips":[{"title":"Pommes i luftiga lager","body":"För mycket på samma plåt ångar potatisen och gör den mjuk."},{"title":"Hög värme för kebaben","body":"Kort, het stekning ger mer pizzerialiknande stekyta än försiktig uppvärmning."},{"title":"Såserna avgör","body":"Röd sås bidrar med syra och hetta, vit sås med fyllighet och vitlök."},{"title":"Köttet varierar","body":"Färdig kebab finns i flera varianter med olika kryddning och fetthalt; smaka innan extra salt tillsätts."}],"sources":[["ICA – Kebabtallrik med pommes","https://www.ica.se/recept/kebabtallrik-med-pommes-729795/"],["ICA – Vit kebabsås","https://www.ica.se/recept/vit-kebabsas-729378/"],["ICA – Röd kebabsås","https://www.ica.se/recept/rod-kebabsas-720372/"]],"tags":["Kött","Potatis","Snabbt"],"countryCode":"SE","countryName":"Sverige","countryFlag":"🇸🇪","countryNote":"Svensk pizzeriakultur med kebabinfluenser.","nutrition":{"kcal":1100,"protein":38,"carbs":99,"fat":60,"per":"portion","servings":4,"estimated":true},"shoppingTips":["En 1 kg-påse frysta pommes används helt. Två 275 g-förpackningar kebabkött räcker till fyra normalstora portioner.","400 g krossade tomater används helt i röda såsen; gör gärna hela såsen och spara eventuellt överblivet kallt.","Majonnäs och grekisk yoghurt går åt till vita såsen och kan köpas i vanliga butiksförpackningar."]},{"id":"hallongrottor","name":"Hallongrottor","subtitle":"Möra smörkakor med en kärna av hallonsylt","category":"Bakverk & fika","emoji":"🍪","tone":"butter","badge":"Svensk småkaksklassiker","yieldBase":"22 kakor","yields":[11,0,22,0,44,0],"time":"35–45 min","difficulty":"Enkel","temp":"200°C","intro":"Ljuvligt möra svenska småkakor som nästan smälter i munnen med ett litet syltöga av sötsyrliga hallon. Minimal arbetsinsats och mycket god hållbarhet.","origin":"Följer ICA:s välbeprövade Hallongrottor (4,1/5; 4 452 röster) med kylning av degen och exakt inköpsvänliga proportioner. Metod jämförd med klassiska svenska bakkällor.","groups":[{"title":"Mördeg","items":[{"name":"Vetemjöl","qty":270,"unit":"g","extra":"cirka 4½ dl, väg gärna","fixed":""},{"name":"Strösocker","qty":1,"unit":"dl","extra":"cirka 90 g","fixed":""},{"name":"Bakpulver","qty":1,"unit":"tsk","extra":"","fixed":""},{"name":"Vaniljsocker","qty":2,"unit":"tsk","extra":"","fixed":""},{"name":"Smör","qty":200,"unit":"g","extra":"kallt, i kuber","fixed":""}]},{"title":"Fyllning","items":[{"name":"Fast hallonsylt","qty":1,"unit":"dl","extra":"cirka 120 g","fixed":""}]}],"steps":[{"title":"Förbered","body":"Sätt ugnen på 200°C över- och undervärme. Ställ ut cirka 22 små pappersformar på en bakplåt. Små stabila formar ger fin form."},{"title":"Blanda torrt","body":"Rör ihop vetemjöl, strösocker, bakpulver och vaniljsocker i en bunke."},{"title":"Gör mördeg","body":"Tillsätt smöret i kuber och arbeta snabbt ihop i matberedare eller med fingertopparna till en sammanhängande deg. Knåda bara precis tills den håller ihop."},{"title":"Kyl kort","body":"Låt degen vila i kylskåp cirka 15–20 minuter om den känns mjuk eller kladdig."},{"title":"Forma","body":"Dela degen i 22 lika stora bitar och rulla till bollar. Lägg en boll i varje pappersform. Gör en tydlig fördjupning med fingret eller skaftet på en träslev, men inte hela vägen genom bottnen."},{"title":"Fyll","body":"Klicka cirka ¾ tsk fast hallonsylt i varje fördjupning utan att överfylla."},{"title":"Grädda","body":"Grädda mitt i ugnen cirka 10–13 minuter tills kakornas kanter bara börjar bli ljust gyllene. De ska inte bli mörkt bruna."},{"title":"Låt svalna","body":"Låt kakorna ligga stilla i formarna tills de svalnat; varma hallongrottor är mycket sköra."}],"tips":[{"title":"Kallt smör och kort blandning","body":"Ger möra kakor utan att degen blir seg."},{"title":"Fast sylt","body":"En för lös sylt kan rinna över kakornas kanter."},{"title":"Övergrädda inte","body":"Ljust gyllene kanter räcker. Kakorna hårdnar och stabiliseras när de kallnar."},{"title":"Förvaring","body":"Lufttät burk i rumstemperatur cirka en vecka, eller frys upp till tre månader."}],"sources":[["ICA – Hallongrottor","https://www.ica.se/recept/hallongrottor-4871/"]],"tags":["Vegetariskt","Ugn"],"countryCode":"SE","countryName":"Sverige","countryFlag":"🇸🇪","countryNote":"Svensk traditionell småkaka.","nutrition":{"kcal":135,"protein":1,"carbs":15,"fat":8,"per":"styck","servings":22,"estimated":true},"shoppingTips":["200 g smör går enkelt ur ett vanligt 250 g-paket.","En burk hallonsylt räcker till flera omgångar; välj gärna fast sylt med tydlig hallonsmak.","Små pappersformar (småkaksformar) hjälper kakorna att hålla formen."]},{"id":"prinsesstarta","name":"Prinsesstårta","subtitle":"Luftig tårtbotten, vaniljkräm, hallon, grädde och grönt marsipanlock","category":"Bakverk & fika","emoji":"🎂","tone":"butter","badge":"Svensk konditoriklassiker","yieldBase":"12 bitar","yields":[6,0,12,0,24,0],"time":"3–4 tim + kylning","difficulty":"Medel–avancerad","temp":"175°C","intro":"En klassisk, hög svensk gräddtårta med tre luftiga bottnar, len hemgjord vaniljkräm, ett tunt lager hallonsylt, generös osötad grädde och ett tunt grönt marsipanlock.","origin":"Jämfört med ICA:s Prinsesstårta (4,3/5; 59 röster) och Köket med professionella konditoritekniker. Hallonsylt används här enligt vanlig modern konditoripraxis; det finns olika historiska varianter.","groups":[{"title":"Luftig tårtbotten","items":[{"name":"Ägg","qty":4,"unit":"st","extra":"rumstempererade","fixed":""},{"name":"Strösocker","qty":2,"unit":"dl","extra":"","fixed":""},{"name":"Vetemjöl","qty":1,"unit":"dl","extra":"","fixed":""},{"name":"Potatismjöl","qty":1,"unit":"dl","extra":"","fixed":""},{"name":"Bakpulver","qty":2,"unit":"tsk","extra":"","fixed":""},{"name":"Smör till formen","qty":10,"unit":"g","extra":"","fixed":""},{"name":"Ströbröd till formen","qty":1,"unit":"msk","extra":"","fixed":""}]},{"title":"Vaniljkräm","items":[{"name":"Standardmjölk","qty":2.5,"unit":"dl","extra":"","fixed":""},{"name":"Äggulor","qty":3,"unit":"st","extra":"","fixed":""},{"name":"Strösocker","qty":0.5,"unit":"dl","extra":"","fixed":""},{"name":"Majsstärkelse","qty":2,"unit":"msk","extra":"","fixed":""},{"name":"Vaniljstång","qty":1,"unit":"st","extra":"eller 2 tsk vaniljsocker","fixed":""},{"name":"Smör","qty":15,"unit":"g","extra":"","fixed":""}]},{"title":"Fyllning och täcke","items":[{"name":"Hallonsylt","qty":1,"unit":"dl","extra":"helst fast och syrlig","fixed":""},{"name":"Vispgrädde","qty":5,"unit":"dl","extra":"kylskåpskall","fixed":""},{"name":"Grönt marsipanlock","qty":1,"unit":"st","extra":"färdigkavlat, cirka 200–250 g","fixed":""},{"name":"Florsocker","qty":1,"unit":"msk","extra":"till garnering","fixed":""}]}],"steps":[{"title":"Baka bottnen","body":"Värm ugnen till 175°C. Smöra och bröa en rund form cirka 22–24 cm. Vispa 4 hela ägg och 2 dl socker ljust och mycket fluffigt 5–7 minuter."},{"title":"Vänd in mjölet","body":"Blanda vetemjöl, potatismjöl och bakpulver. Sikta över äggvispet och vänd varsamt med slickepott. Häll i formen och grädda i nedre/mellersta delen av ugnen cirka 30–40 minuter tills provsticka är torr. Låt kallna helt, helst inslagen till nästa dag."},{"title":"Koka vaniljkrämen","body":"Värm mjölken med urskrapad vaniljstång och frön. Vispa 3 äggulor, ½ dl socker och majsstärkelse i skål. Häll varm mjölk långsamt över under vispning och häll tillbaka i kastrullen."},{"title":"Tjockna varsamt","body":"Värm vaniljkrämen under konstant vispning tills den blir tjock och börjar bubbla försiktigt; låt sjuda kort så majsstärkelsen tillagas. Ta från värmen, rör ner 15 g smör, täck direkt mot ytan och kyl helt. Använder du vaniljsocker tillsätts det efter kokning."},{"title":"Dela bottnarna","body":"Skär den helt kalla tårtbottnen horisontellt i tre jämna lager med en lång sågtandad kniv."},{"title":"Bygg fyllningarna","body":"Lägg första botten på tårtfat och bred över vaniljkrämen. Lägg på nästa botten och bred över hallonsylt. Vispa grädden till stadiga men fortfarande lena toppar."},{"title":"Forma gräddkupolen","body":"Bred en del grädde över hallonen och lägg på översta botten. Forma resten av grädden till en mjuk kupol över tårtans ovansida och tunna kanter. Kyl cirka 30 minuter så den sätter sig."},{"title":"Lägg på marsipan","body":"Rulla försiktigt ut marsipanlocket över den kalla tårtan. Släta varsamt ut från toppen och nedåt utan att dra hårt. Skär bort överskott vid kanten."},{"title":"Servera","body":"Sikta över lite florsocker strax före servering. Skär med lång vass kniv och torka av mellan bitarna."}],"tips":[{"title":"Allt måste vara kallt vid montering","body":"Varm tårtbotten eller vaniljkräm gör grädden instabil."},{"title":"Vispa inte grädden för hårt","body":"En mjuk grädde går lättare att forma till jämn kupol."},{"title":"Marsipanlock underlättar","body":"Färdigkavlat grönt marsipanlock är smidigare än att kavla tunn marsipan själv."},{"title":"Syrlig sylt balanserar","body":"Ett tunt lager hallon ger fräschör utan att dominera vanilj- och gräddsmaken."},{"title":"Förbered dagen före","body":"Botten och vaniljkräm går bra att göra i förväg; montera på serveringsdagen för bäst marsipanyta."}],"sources":[["ICA – Prinsesstårta","https://www.ica.se/recept/prinsesstarta-722067/"],["Köket – Prinsesstårta","https://www.koket.se/prinsesstarta"],["ICA – Prinsesstårta på konditorsvis","https://www.ica.se/artikel/prinsesstarta-pa-konditorvis/"]],"tags":["Festmat","Vegetariskt","Ugn"],"countryCode":"SE","countryName":"Sverige","countryFlag":"🇸🇪","countryNote":"Svensk konditoriklassiker från 1900-talet; hallonsylt är en modern vanlig variant.","nutrition":{"kcal":405,"protein":7,"carbs":43,"fat":23,"per":"bit","servings":12,"estimated":true},"shoppingTips":["Ett färdigkavlat grönt marsipanlock à cirka 200–250 g är smidigast. Kontrollera diametern mot formen.","5 dl vispgrädde är en vanlig förpackning. Potatismjöl och Maizena fyller olika funktioner: potatismjöl i botten, majsstärkelse i krämen.","Totalt går 7 ägg åt om äggulorna tas från tre separata ägg; spara äggvitorna till maräng."]},{"id":"new-york-cheesecake","name":"New York Cheesecake","subtitle":"Tät, sammetslen bakad cheesecake med vanilj och digestivebotten","category":"Efterrätter","emoji":"🍰","tone":"butter","badge":"Amerikansk dessertklassiker","yieldBase":"12 bitar","yields":[6,0,12,0,24,0],"time":"Cirka 2 tim + minst 6 tim kylning","difficulty":"Medel","temp":"160°C","intro":"Hög, fyllig och sammetslen New York Cheesecake med smörig digestivebotten och tydlig färskostsmak. Ugnsbakad på låg temperatur för att bli precis krämig snarare än fluffig.","origin":"Huvudkälla Sally’s Baking Classic Cheesecake (4,9/5; 647 recensioner), jämförd med ICA New York cheesecake (4,5/5; 50 röster). Proportionerna är anpassade till fyra svenska 200 g-färskostpaket; den exakta varianten är inte separat provbakad.","groups":[{"title":"Digestivebotten","items":[{"name":"Digestivekex","qty":180,"unit":"g","extra":"","fixed":""},{"name":"Smör","qty":75,"unit":"g","extra":"smält","fixed":""},{"name":"Strösocker","qty":2,"unit":"msk","extra":"","fixed":""}]},{"title":"Cheesecakefyllning","items":[{"name":"Naturell färskost, fullfet","qty":800,"unit":"g","extra":"4 × 200 g, rumstempererad","fixed":""},{"name":"Strösocker","qty":180,"unit":"g","extra":"cirka 2 dl","fixed":""},{"name":"Crème fraîche 34 %","qty":200,"unit":"g","extra":"rumstempererad","fixed":""},{"name":"Ägg","qty":4,"unit":"st","extra":"stora, rumstempererade","fixed":""},{"name":"Vaniljsocker","qty":2,"unit":"tsk","extra":"eller 2 tsk vaniljextrakt","fixed":""},{"name":"Färsk citronjuice","qty":1,"unit":"msk","extra":"","fixed":""},{"name":"Vetemjöl","qty":1.5,"unit":"msk","extra":"hjälper stabilisera fyllningen","fixed":""},{"name":"Salt","qty":1,"unit":"krm","extra":"","fixed":""}]},{"title":"Valfri servering","items":[{"name":"Färska bär","qty":200,"unit":"g","extra":"hallon eller blåbär, valfritt","fixed":""}]}],"steps":[{"title":"Förbered form och ingredienser","body":"Låt färskost, crème fraîche och ägg bli rumstempererade. Sätt ugnen på 175°C över- och undervärme. Klä botten av en springform cirka 22–23 cm med bakplåtspapper. Klä gärna formens utsida noggrant med folie om du använder vattenbad."},{"title":"Gör kexbotten","body":"Mixa digestivekexen fint, blanda med smält smör och 2 msk socker. Pressa smulorna hårt över botten och lite uppåt kanterna. Förgrädda 10 minuter och låt svalna. Sänk ugnsvärmen till 160°C."},{"title":"Blanda ostsmet","body":"Rör färskost och 180 g socker långsamt till helt slätt med elvisp på låg fart eller en slickepott. Blanda ner crème fraîche, vaniljsocker, citronjuice, mjöl och salt. Undvik att vispa in mycket luft."},{"title":"Tillsätt äggen","body":"Rör ner ett ägg i taget på låg hastighet, bara tills det precis blandats in. Skrapa ner smeten från bunkens kanter och rör jämnt."},{"title":"Förbered vattenbad","body":"Häll smeten över kexbotten. Ställ formen i en större långpanna och häll försiktigt hett vatten i långpannan, cirka 2–3 cm djupt. Alternativt ställ en separat form med hett vatten på nedersta falsen om springformen riskerar att läcka."},{"title":"Baka långsamt","body":"Baka vid 160°C i cirka 60–80 minuter. Kanterna ska ha stelnat, medan mitten fortfarande dallrar lätt som gelé om du skakar formen försiktigt. Den ska inte vara rinnande. Tid varierar med form och ugn."},{"title":"Svalna varsamt","body":"Stäng av ugnen, öppna luckan lite och låt kakan stå 45–60 minuter. Ta ur vattenbadet och låt sedan svalna ytterligare på galler innan kylning."},{"title":"Kyl ordentligt","body":"Täck när kakan inte längre avger värme och låt stå i kylskåp minst 6 timmar, helst över natten. Det är då den rätta täta, krämiga konsistensen utvecklas."},{"title":"Skär snygga bitar","body":"Lossa kanten försiktigt. Skär med en vass kniv som doppas i varmt vatten och torkas ren mellan varje bit. Servera kall, gärna med några färska bär."}],"tips":[{"title":"Rumstempererade ingredienser","body":"Minskar klumpar och gör att du slipper vispa in överflödig luft i smeten."},{"title":"Kraftig vispning skapar sprickor","body":"Blanda långsamt, särskilt efter att äggen kommit i."},{"title":"Vattenbad ger mildare värme","body":"Fuktig, jämn värme minskar risken för sprickor och överbakad kant. Täta formen noggrant."},{"title":"Mittens darr är normalt","body":"Kakan sätter sig under avsvalning och kylning. Grädda inte tills den är helt fast i mitten."},{"title":"Gör dagen före","body":"New York Cheesecake behöver lång kylning och blir ofta bättre dagen efter."}],"sources":[["Sally’s Baking – Classic Cheesecake","https://sallysbakingaddiction.com/classic-cheesecake/"],["ICA – New York cheesecake","https://www.ica.se/recept/new-york-cheesecake-730043/"]],"tags":["Vegetariskt","Festmat","Ugn"],"countryCode":"US","countryName":"USA","countryFlag":"🇺🇸","countryNote":"New York-style baked cheesecake.","nutrition":{"kcal":480,"protein":9,"carbs":37,"fat":33,"per":"bit","servings":12,"estimated":true},"shoppingTips":["Fyra 200 g-paket naturell fullfet färskost ger 800 g utan svinn. Undvik light-färskost för den här konsistensen.","En 200 g-förpackning crème fraîche går åt helt. Digestivekexen finns vanligen i större påse; resten kan användas till Banoffeepaj.","Planera för kylning över natten och köp bär endast om du vill garnera."]},{"id":"stekt-flask-loksas","name":"Stekt fläsk med löksås","subtitle":"Krispigt rimmat fläsk, långsamt mjukstekt lök och kokt potatis","category":"Svensk husman","emoji":"🥓","tone":"chocolate","badge":"Svensk husmansklassiker","yieldBase":"4 portioner","yields":[2,0,4,0,8,0],"time":"40–50 min","difficulty":"Enkel","temp":"Stekpanna","intro":"Knaprigt stekt rimmat fläsk med en mild, fyllig löksås där lite av fläskets stekfett ger extra smak. Serveras med nykokt potatis och persilja.","origin":"Bygger på ICA:s högt betygsatta Stekt fläsk med löksås (4,6/5; 48 röster) och ICA Löksås (4,5/5; 411 röster).","groups":[{"title":"Fläsk och potatis","items":[{"name":"Rimmat skivat sidfläsk utan svål","qty":500,"unit":"g","extra":"","fixed":""},{"name":"Fast potatis","qty":900,"unit":"g","extra":"","fixed":""},{"name":"Färsk persilja","qty":0.5,"unit":"kruka","extra":"valfritt","fixed":""}]},{"title":"Löksås","items":[{"name":"Gula lökar","qty":3,"unit":"st","extra":"tunt skivade","fixed":""},{"name":"Smör","qty":25,"unit":"g","extra":"","fixed":""},{"name":"Vetemjöl","qty":2.5,"unit":"msk","extra":"","fixed":""},{"name":"Standardmjölk","qty":3.5,"unit":"dl","extra":"","fixed":""},{"name":"Vispgrädde","qty":2,"unit":"dl","extra":"","fixed":""},{"name":"Köttbuljongtärning","qty":0.5,"unit":"st","extra":"","fixed":""},{"name":"Vitpeppar","qty":1,"unit":"krm","extra":"","fixed":""},{"name":"Salt","qty":null,"unit":"","extra":"smaka av efter fläskfettet","fixed":"smaka av efter fläskfettet"}]}],"steps":[{"title":"Koka potatis","body":"Skala och koka potatisen i saltat vatten tills den är mjuk, cirka 15–20 minuter. Låt ånga av."},{"title":"Mjuka löken","body":"Skala och skiva lökarna tunt. Stek i 25 g smör på medellåg värme 12–15 minuter tills mjuk och lätt gyllene, inte bränd."},{"title":"Red såsen","body":"Pudra mjöl över löken och rör runt. Tillsätt mjölk och grädde lite i taget under omrörning. Smula ner buljongtärningen."},{"title":"Låt sjuda","body":"Sjud såsen 7–10 minuter under omrörning tills mjölsmaken försvunnit och konsistensen är krämig. Späd med mjölk vid behov."},{"title":"Stek fläsket","body":"Stek sidfläsket i torr, het panna i omgångar så skivorna får ordentligt med färg och knapriga kanter. Lägg på galler eller hushållspapper."},{"title":"Smaka av såsen","body":"Rör ner 1–2 msk av det goda stekfettet från fläsket i löksåsen. Smaka av med vitpeppar och salt först nu."},{"title":"Servera","body":"Servera genast med kokt potatis, generöst med löksås och eventuellt hackad persilja."}],"tips":[{"title":"Stek i omgångar","body":"För mycket fläsk på samma gång blir ångkokt i stället för knaprigt."},{"title":"Ta vara på stekfettet","body":"En liten sked stekfett i såsen tillför mycket smak; använd inte allt fett."},{"title":"Löken ska vara mjuk","body":"Låt löken få tid före redningen för en rund, söt löksmak."}],"sources":[["ICA – Stekt fläsk med löksås","https://www.ica.se/recept/stekt-flask-med-loksas-740434/"],["ICA – Löksås","https://www.ica.se/recept/loksas-724253/"]],"tags":["Fläsk & korv","Potatis"],"countryCode":"SE","countryName":"Sverige","countryFlag":"🇸🇪","countryNote":"Bygger på ICA:s högt betygsatta Stekt fläsk med löksås (4,6/5; 48 röster) och ICA Löksås (4,5/5; 411 röster).","nutrition":{"kcal":960,"protein":29,"carbs":59,"fat":67,"per":"portion","servings":4,"estimated":true},"shoppingTips":["500 g rimmat, skivat sidfläsk passar ofta ett stort paket eller två små; använd inte bacon om du vill ha klassisk fläsksmak.","En 1 kg-påse potatis räcker. Köp minst 2 dl vispgrädde och standardmjölk till såsen."]},{"id":"potatisgratang","name":"Krämig potatisgratäng","subtitle":"Tunna potatisskivor i vitlöksdoftande gräddmjölk med gyllene osttäcke","category":"Världens kök","emoji":"🥔","tone":"butter","badge":"Klassiskt tillbehör","yieldBase":"6 portioner","yields":[3,0,6,0,12,0],"time":"70–85 min inklusive vila","difficulty":"Enkel–medel","temp":"200°C","intro":"Krämig och smakrik potatisgratäng som håller ihop vid servering: potatisen förkokas i gräddmjölk och gratineras med ost. Perfekt till stekt kött, kyckling eller en sallad.","origin":"Utgår från ICA:s vältestade Potatisgratäng (grundrecept), 4,6/5 från 430 röster, och Arla Pro:s metod för att förkoka potatis i grädde.","groups":[{"title":"Potatisgratäng","items":[{"name":"Fast potatis","qty":1500,"unit":"g","extra":"tunna 3 mm-skivor","fixed":""},{"name":"Vitlöksklyftor","qty":3,"unit":"st","extra":"finrivna","fixed":""},{"name":"Vispgrädde","qty":4,"unit":"dl","extra":"","fixed":""},{"name":"Standardmjölk","qty":3,"unit":"dl","extra":"","fixed":""},{"name":"Salt","qty":2,"unit":"tsk","extra":"justera efter smak","fixed":""},{"name":"Svartpeppar","qty":2,"unit":"krm","extra":"","fixed":""},{"name":"Lagrad riven ost","qty":150,"unit":"g","extra":"exempelvis prästost","fixed":""},{"name":"Smör","qty":15,"unit":"g","extra":"till formen","fixed":""}]}],"steps":[{"title":"Förbered","body":"Sätt ugnen på 200°C över- och undervärme. Smöra en ugnsform cirka 25 × 30 cm."},{"title":"Skiva potatis","body":"Skala potatisen och skär i tunna 2–3 mm-skivor, gärna med mandolin. Skölj inte skivorna; stärkelsen binder såsen."},{"title":"Värm gräddmjölken","body":"Häll grädde och mjölk i en rymlig kastrull. Tillsätt finriven vitlök, salt och peppar. Värm försiktigt till sjudning."},{"title":"Förkoka potatis","body":"Vänd ner potatisskivorna och sjud försiktigt cirka 12–18 minuter under ofta omrörning, tills skivorna börjar mjukna och gräddmjölken tjocknat. Se upp så det inte fastnar."},{"title":"Gratinera","body":"Häll försiktigt potatis och all gräddmjölk i formen. Fördela osten jämnt ovanpå. Grädda mitt i ugnen cirka 20–30 minuter tills bubblig och gyllene; potatisen ska vara helt mjuk."},{"title":"Låt vila","body":"Låt gratängen vila 15–20 minuter före uppskärning. Såsen sätter sig och blir krämig."},{"title":"Servera","body":"Servera som tillbehör till valfri rätt. Värm eventuella rester varsamt under folie."}],"tips":[{"title":"Potatisen binder såsen","body":"Spola inte av stärkelsen efter skivningen."},{"title":"Förkokning sparar tid","body":"Ger jämnare konsistens än att sätta in helt rå potatis i ugn."},{"title":"Vila före servering","body":"Varm gratäng direkt från ugnen kan verka rinnig, men tjocknar efter en stund."}],"sources":[["ICA – Potatisgratäng grundrecept","https://www.ica.se/recept/potatisgratang-grundrecept-721833/"],["Arla – Potatisgratäng","https://www.arla.se/recept/potatisgratang/"]],"tags":["Potatis","Ost","Vegetariskt","Ugn"],"countryCode":"FR","countryName":"Frankrike","countryFlag":"🇫🇷","countryNote":"Utgår från ICA:s vältestade Potatisgratäng ( mixning."},{"title":"Mixa smeten","body":"Kör kikärtor, lök, vitlök, persilja och kryddor i matberedare i omgångar tills finfördelat men fortfarande lite grynigt. Tryck ihop en sked smet: den ska hålla formen."},{"title":"Låt vila kallt","body":"Låt smeten stå i kylskåp 30 minuter. Rör sedan ner bakpulvret precis innan formning."},{"title":"Gör såsen och salladen","body":"Blanda yoghurt, tahini, pressad vitlök, citron och salt. Späd med lite vatten till ringlingsbar konsistens. Strimla sallad och skiva tomat, gurka och rödlök."},{"title":"Värm oljan","body":"Hetta upp rapsoljan i en djup, stadig kastrull till cirka 170–175°C. Fyll högst en tredjedel av kastrullen och ha lock i närheten. Lämna aldrig het olja utan uppsikt."},{"title":"Fritera falafel","body":"Forma 20–24 små bollar med fuktade händer eller sked. Fritera i små omgångar cirka 4–5 minuter tills djupt gyllene och genomvarma. Låt rinna av på galler/papper."},{"title":"Servera i pita","body":"Värm pitabröden. Fyll med sallad, grönsaker och 5–6 falafel per portion. Skeda över generöst med vitlökssås."}],"tips":[{"title":"Torkade kikärtor är nyckeln","body":"Kokta konserverade kikärtor blir ofta för blöta för klassisk friterad falafel."},{"title":"Testfritera först","body":"Om en provboll faller sönder: mixa smeten lite finare och krama den tätare."},{"title":"Tahini ger djup","body":"Yoghurt, citron och tahini ger frisk vitlökssås som inte blir tung."},{"title":"Hantera fritös säkert","body":"Håll vatten borta från varm olja, fritera små mängder och ha brandskyddet i åtanke."}],"sources":[["Zeinas Kitchen – Grymt goda falafel","https://zeinaskitchen.se/grymt-goda-falafel/"],["Zeinas Kitchen – Falafel och tahinasås","https://zeinaskitchen.se/falafel/"]],"tags":["Vegetariskt","Festmat"],"countryCode":"LB","countryName":"Libanon","countryFlag":"🇱🇧","countryNote":"Bygger på Zeinas Kitchens välbeprövade falafelmetod med blötlagda torkade kikärtor. Konserverade kokta kikärtor rekommenderas inte för klassiska fala :[{"title":"Gör mördegen","body":"Nyp ihop mjöl, kallt smör och socker till smulor. Tillsätt äggulan och eventuellt lite kallt vatten. Arbeta precis ihop till deg."},{"title":"Kyl","body":"Platta till och låt mördegen vila i kylskåp cirka 30 minuter."},{"title":"Blanda fyllningen","body":"Riv mandelmassan. Rör ihop den med mjukt smör till slätt, tillsätt äggen ett i taget och sist 1 msk vetemjöl."},{"title":"Klä formarna","body":"Sätt ugnen på 190°C över- och undervärme. Dela mördegen i 16 lika bitar och tryck tunt i smorda mazarinformar eller stadiga små aluminiumformar."},{"title":"Fyll","body":"Fördela mandelfyllningen jämnt, cirka två tredjedelar upp i varje form."},{"title":"Grädda","body":"Grädda mitt i ugnen 15–20 minuter tills kanterna är ljust gyllene och fyllningen har satt sig. Låt svalna helt."},{"title":"Glasera","body":"Blanda florsocker med lite kallt vatten till tjock men bredbar glasyr. Bred ett tunt lager på kalla mazariner."},{"title":"Låt stelna","body":"Låt glasyren stelna innan servering. Förvara svalt och frys gärna utan glasyr."}],"tips":[{"title":"Färdig mandelmassa fungerar bra","body":"Sparar moment utan att förlora den klassiska smaken."},{"title":"Tryck degen jämnt","body":"För tjock botten ger en tung mazarin; tunt skal blir mörare."},{"title":"Glasera kallt","body":"Annars smälter glasyren och försvinner in i fyllningen."}],"sources":[["Arla – Mazariner","https://www.arla.se/recept/mazariner/"],["Recepten.se – Mazariner","https://www.recepten.se/recept/mazariner.html"]],"tags":["Vegetariskt","Ugn"],"countryCode":"SE","countryName":"Sverige","countryFlag":"🇸🇪","countryNote":"Metod jämförd med Arlas Mazariner och Recepten.se. Färdig mandelmassa ersätter malning av mandel och bittermandel för enklare svensk handel.","nutrition":{"kcal":290,"protein":5,"carbs":31,"fat":16,"per":"st","servings":16,"estimated":true},"shoppingTips":["200 g mandelmassa är ett vanligt paket; riv den kall så blandar den sig enklare med smöret.","Små stadiga aluminiumformar kan användas om riktiga mazarinformar saknas.","Totalt behövs 200 g smör. Spara äggvitan från mördegen till annat bak."]},{"id":"sockerkaka","name":"Klassisk sockerkaka","subtitle":"Saftig, fluffig svensk sockerkaka med smör och vanilj","category":"Bakverk & fika","emoji":"🍰","tone":"butter","badge":"Svensk fikaklassiker","yieldBase":"12 bitar","yields":[6,0,12,0,24,0],"time":"55–65 min","difficulty":"Enkel","temp":"175°C","intro":"En ljus, hög och saftig sockerkaka med smörsmak och vanilj. Ett användbart grundrecept som också passar till dammsugare om några skivor blir över.","origin":"Bygger nära på ICA Saftig sockerkaka (4,4/5 från 4 167 röster) och Arlas klassiska metod. Vaniljsocker används i grundvarianten.","groups":[{"title":"Sockerkaka","items":[{"name":"Ägg","qty":3,"unit":"st","extra":"","fixed":""},{"name":"Strösocker","qty":3,"unit":"dl","extra":"","fixed":""},{"name":"Vetemjöl","qty":3.5,"unit":"dl","extra":"cirka 210 g","fixed":""},{"name":"Bakpulver","qty":2,"unit":"tsk","extra":"","fixed":""},{"name":"Vaniljsocker","qty":2,"unit":"tsk","extra":"","fixed":""},{"name":"Standardmjölk","qty":1.5,"unit":"dl","extra":"","fixed":""},{"name":"Smör","qty":50,"unit":"g","extra":"till smeten","fixed":""},{"name":"Smör","qty":15,"unit":"g","extra":"till formen","fixed":""},{"name":"Ströbröd","qty":2,"unit":"msk","extra":"till formen","fixed":""}]}],"steps":[{"title":"Förbered formen","body":"Sätt ugnen på 175°C över- och undervärme. Smöra noggrant och bröa en sockerkaksform på cirka 1½–2 liter."},{"title":"Smält smör","body":"Smält 50 g smör och rör ner mjölken. Låt blandningen bli ljummen."},{"title":"Vispa ägg och socker","body":"Vispa ägg och strösocker riktigt ljust och pösigt med elvisp cirka 5–7 minuter."},{"title":"Blanda torrt","body":"Blanda vetemjöl, bakpulver och vaniljsocker i en separat skål. Sikta gärna ner i äggvispet."},{"title":"Vänd ihop","body":"Vänd varsamt ner mjölblandningen och sedan den ljumma smörmjölken. Rör bara tills smeten är jämn."},{"title":"Grädda","body":"Häll i formen och grädda i nedre delen av ugnen cirka 35–45 minuter. Testa med sticka; den ska komma ut utan rå smet."},{"title":"Låt vila","body":"Låt kakan stå i formen 10 minuter, lossa försiktigt och stjälp upp på galler. Låt svalna under bakduk."},{"title":"Servera","body":"Skär i 12 skivor och servera till kaffe eller med bär och grädde."}],"tips":[{"title":"Vispa ägg och socker ordentligt","body":"Det ger luftig volym utan att kakan blir kompakt."},{"title":"Överarbeta inte mjölet","body":"Vänd bara tills smeten går ihop så bevaras luften."},{"title":"Välj rätt form","body":"För stor form ger låg kaka; för liten kan svämma över."}],"sources":[["ICA – Saftig sockerkaka","https://www.ica.se/recept/saftig-sockerkaka-670957/"],["Arla – Sockerkaka","https://www.arla.se/recept/sockerkaka/"]],"tags":["Vegetariskt","Ugn"],"countryCode":"SE","countryName":"Sverige","countryFlag":"🇸🇪","countryNote":"Bygger nära på ICA Saftig sockerkaka (4,4/5 från 4 167 röster) och Arlas klassiska metod. Vaniljsocker används i grundvarianten.","nutrition":{"kcal":250,"protein":4,"carbs":37,"fat":9,"per":"bit","servings":12,"estimated":true},"shoppingTips":["Vanliga basvaror räcker: mjöl, socker, bakpulver, smör, standardmjölk och ägg.","En form på cirka 1½–2 liter är lagom. Rester går att använda som kaksmulor i dammsugare."]},{"id":"toscakaka","name":"Toscakaka","subtitle":"Saftig sockerkaksbotten med knäckigt mandeltäcke","category":"Bakverk & fika","emoji":"🍯","tone":"butter","badge":"Svensk fikaklassiker","yieldBase":"10 bitar","yields":[5,0,10,0,20,0],"time":"60–70 min + svalning","difficulty":"Enkel–medel","temp":"175°C","intro":"Klassisk toscakaka med mjuk ljus sockerkaksbotten och ett rejält knäckigt karamell- och mandeltäcke. Tydligt annorlunda än vår Ryttarkaka med kokostosca.","origin":"Huvudkälla ICA Toscakaka (4,4/5 från 749 röster), jämförd med Arlas mandelvariant. Mandeltäcket tillagas separat och bakas sedan fast på kakan.","group
