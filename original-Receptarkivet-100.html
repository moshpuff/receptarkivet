a täcket","body":"Sockret kan gå från gyllene till bränt ganska fort mot slutet."},{"title":"Vänta innan uppskärning","body":"Karamellglasyren sätter sig när den svalnar."}],"sources":[["ICA – Toscakaka","https://www.ica.se/recept/toscakaka-716486/"],["Arla – Toscakaka","https://www.arla.se/recept/toscakaka/"]],"tags":["Vegetariskt","Ugn"],"countryCode":"SE","countryName":"Sverige","countryFlag":"🇸🇪","countryNote":"Huvudkälla ICA Toscakaka (4,4/5 från 749 röster), jämförd med Arlas mandelvariant. Mandeltäcket tillagas separat och bakas sedan fast på kakan.","nutrition":{"kcal":370,"protein":6,"carbs":35,"fat":24,"per":"bit","servings":10,"estimated":true},"shoppingTips":["200 g smör används till kakan och täcket tillsammans.","Mandelspån på 100 g går ofta att köpa som en påse, kontrollera innehållet eftersom förpackningar kan variera."]},{"id":"rulltarta","name":"Rulltårta med hallonsylt","subtitle":"Luftig, tunn sockerkaksrulle med syrlig hallonsylt","category":"Bakverk & fika","emoji":"🍓","tone":"butter","badge":"Svensk fikaklassiker","yieldBase":"20 bitar","yields":[10,0,20,0,40,0],"time":"25–35 min","difficulty":"Enkel","temp":"250°C","intro":"Mjuk, tunn rulltårta med lätt luftig sockerkaksbotten och god hallonsylt. Snabb att göra med få ingredienser och perfekt att servera till fika.","origin":"Utgår från ICA Rulltårta (3,8/5 från 1 680 röster) och Arlas råd om mycket luftig äggsmet. Fylls och rullas medan botten fortfarande är varm.","groups":[{"title":"Botten","items":[{"name":"Ägg","qty":3,"unit":"st","extra":"","fixed":""},{"name":"Strösocker","qty":1.5,"unit":"dl","extra":"","fixed":""},{"name":"Vetemjöl","qty":2,"unit":"dl","extra":"cirka 120 g","fixed":""},{"name":"Bakpulver","qty":1,"unit":"tsk","extra":"","fixed":""},{"name":"Standardmjölk","qty":0.5,"unit":"dl","extra":"","fixed":""}]},{"title":"Fyllning och uppstjälpning","items":[{"name":"Hallonsylt","qty":2,"unit":"dl","extra":"gärna fast och med tydlig hallonsmak","fixed":""},{"name":"Strösocker","qty":2,"unit":"msk","extra":"att strö på bakplåtspapper","fixed":""}]}],"steps":[{"title":"Förbered","body":"Sätt ugnen på 250°C över- och undervärme. Lägg bakplåtspapper i en långpanna cirka 30 × 40 cm."},{"title":"Vispa fluffigt","body":"Vispa ägg och 1½ dl strösocker ljust och mycket luftigt med elvisp cirka 5 minuter."},{"title":"Vänd i mjölet","body":"Blanda mjöl och bakpulver. Sikta ner och vänd varsamt i äggsmeten. Tillsätt mjölken och rör precis jämnt."},{"title":"Grädda snabbt","body":"Bred smeten tunt och jämnt i långpannan. Grädda mitt i ugnen ungefär 5 minuter tills ytan är gyllene och kakan precis stelnat. Grädda inte för länge."},{"title":"Stjälp upp","body":"Strö 2 msk socker på ett nytt bakplåtspapper. Stjälp upp den heta botten på det sockrade papperet och dra försiktigt bort bakpapperet från undersidan."},{"title":"Fyll direkt","body":"Bred hallonsylt i ett jämnt, inte alltför tjockt lager på den fortfarande varma kakan."},{"title":"Rulla","body":"Rulla ihop från långsidan med hjälp av papperet. Låt svalna inrullad med skarven nedåt."},{"title":"Skär","body":"Skär i cirka 20 tunna bitar med en vass kniv. Förvara täckt så den inte torkar."}],"tips":[{"title":"Värme och tid är kritiska","body":"Tunn rulltårtsbotten torkar fort. Kontrollera efter fyra minuter."},{"title":"Rulla varm","body":"Då spricker botten mindre lätt."},{"title":"Använd fast sylt","body":"För mycket lös sylt gör rulltårtan blöt och svår att skära."}],"sources":[["ICA – Rulltårta","https://www.ica.se/recept/rulltarta-715912/"],["Arla – Rulltårta","https://www.arla.se/recept/rulltarta/"]],"tags":["Vegetariskt","Ugn"],"countryCode":"SE","countryName":"Sverige","countryFlag":"🇸🇪","countryNote":"Utgår från ICA Rulltårta (3,8/5 från 1 680 röster) och Arlas råd om mycket luftig äggsmet. Fylls och rullas medan botten fortfarande är varm.","nutrition":{"kcal":95,"protein":2,"carbs":18,"fat":2,"per":"bit","servings":20,"estimated":true},"shoppingTips":["Tre ägg och cirka 120 g vetemjöl räcker till en hel ugnsplåt.","Hallonsylt säljs i större burk; rester går till pannkakor, hallongrottor eller tårtor."]},{"id":"vaniljhjartan","name":"Vaniljhjärtan","subtitle":"Möra hjärtformade mördegskakor fyllda med äkta vaniljkräm","category":"Bakverk & fika","emoji":"🤍","tone":"butter","badge":"Svensk konditoriklassiker","yieldBase":"16 st","yields":[8,0,16,0,32,0],"time":"90 min + kylning","difficulty":"Medel–avancerad","temp":"200°C","intro":"Traditionella vaniljhjärtan med spröd smörmördeg, fyllig hemkokt vaniljkräm och ett fint lager florsocker. De kräver hjärtformade bakformar för klassiskt utseende.","origin":"Huvudkälla Arla Vaniljhjärtan; jämförd med ICA:s klassiska vaniljhjärtan (3,1/5 från 68 röster). Majsstärkelse ger en stabil vaniljkräm som går att baka in.","groups":[{"title":"Mördeg","items":[{"name":"Vetemjöl","qty":4.5,"unit":"dl","extra":"","fixed":""},{"name":"Florsocker","qty":1.5,"unit":"dl","extra":"","fixed":""},{"name":"Potatismjöl","qty":0.5,"unit":"dl","extra":"","fixed":""},{"name":"Vaniljsocker","qty":1,"unit":"tsk","extra":"","fixed":""},{"name":"Salt","qty":1,"unit":"krm","extra":"","fixed":""},{"name":"Smör","qty":200,"unit":"g","extra":"kallt, tärnat","fixed":""},{"name":"Äggula","qty":1,"unit":"st","extra":"","fixed":""},{"name":"Kallt vatten","qty":1,"unit":"tsk","extra":"","fixed":""}]},{"title":"Vaniljkräm","items":[{"name":"Standardmjölk","qty":4,"unit":"dl","extra":"","fixed":""},{"name":"Äggulor","qty":2,"unit":"st","extra":"","fixed":""},{"name":"Strösocker","qty":0.5,"unit":"dl","extra":"","fixed":""},{"name":"Majsstärkelse","qty":0.5,"unit":"dl","extra":"","fixed":""},{"name":"Vaniljsocker","qty":2,"unit":"tsk","extra":"eller frön från en halv vaniljstång","fixed":""}]},{"title":"Garnering","items":[{"name":"Florsocker","qty":0.5,"unit":"dl","extra":"att sikta över","fixed":""}]}],"steps":[{"title":"Gör mördegen","body":"Blanda mjöl, florsocker, potatismjöl, vaniljsocker och salt. Nyp eller mixa ner tärnat kallt smör tills det blir smulor. Tillsätt äggula och kallt vatten och arbeta snabbt ihop."},{"title":"Kyl degen","body":"Platta till degen, täck och låt vila i kylskåp minst 30 minuter."},{"title":"Koka vaniljkräm","body":"Vispa mjölk, äggulor, socker och majsstärkelse i en kastrull. Värm på medelvärme under konstant vispning tills krämen tjocknat ordentligt och bubblat försiktigt kort. Ta av värmen och smaksätt med vaniljsocker."},{"title":"Kyl krämen","body":"Häll krämen i en skål och täck med plastfilm tätt mot ytan. Kyl snabbt tills den är helt kall och stadig."},{"title":"Kavla och klä","body":"Sätt ugnen på 200°C över- och undervärme. Kavla mördegen cirka 2–3 mm tunn. Klä 16 lätt smorda hjärtformade metallformar med deg."},{"title":"Fyll och täck","body":"Fördela en lagom klick kall vaniljkräm i formarna. Stansa eller skär deglock, lägg på och nyp ihop kanterna noggrant. Skär bort överskott."},{"title":"Grädda","body":"Grädda mitt i ugnen cirka 12–15 minuter tills kakorna bara är svagt gyllene och genomgräddade."},{"title":"Svalna och servera","body":"Låt vila i formarna några minuter, lossa sedan försiktigt. Låt svalna helt och sikta över florsocker före servering."}],"tips":[{"title":"Rätt formar","body":"För riktig hjärtform behövs vaniljhjärteformar. Små metalltarteletter kan fungera men ger annan form."},{"title":"Krämen måste vara kall","body":"Varm eller lös vaniljkräm kan läcka ut under gräddning."},{"title":"Förslut noggrant","body":"Nyp ihop deglock och kanter så fyllningen stannar inuti."},{"title":"Möra kakor","body":"Baka bara tills lätt gyllene, annars blir mördegen hård."}],"sources":[["Arla – Vaniljhjärtan","https://www.arla.se/recept/vaniljhjartan/"],["ICA – Vaniljhjärtan","https://www.ica.se/recept/vaniljhjartan-276591/"]],"tags":["Vegetariskt","Ugn"],"countryCode":"SE","countryName":"Sverige","countryFlag":"🇸🇪","countryNote":"Huvudkälla Arla Vaniljhjärtan; jämförd med ICA:s klassiska vaniljhjärtan (3,1/5 från 68 röster). Majsstärkelse ger en stabil vaniljkräm som går att ba","nutrition":{"kcal":240,"protein":3,"carbs":30,"fat":12,"per":"st","servings":16,"estimated":true},"shoppingTips":["200 g smör, majsstärkelse och potatismjöl finns i vanliga svenska butiker.","Hjärtformade bakformar är specialutrustning: saknas de fungerar stabila små mördegsformar men resultatet blir inte hjärtformat.","Totalt behövs tre äggulor; spara äggvitorna till maräng."]},{"id":"potatis-purjolokssoppa","name":"Krämig potatis- och purjolökssoppa","subtitle":"Len purjolök, mjölig potatis, grädde och färsk gräslök","category":"Världens kök","emoji":"🥣","tone":"sage","badge":"Fransk soppklassiker","yieldBase":"4 portioner","yields":[2,0,4,0,8,0],"time":"35–40 min","difficulty":"Enkel","temp":"Spis","intro":"Len och smakrik potatis- och purjolökssoppa med långsamt smörfräst purjo, mild vitlök, grönsaksbuljong och vispgrädde. Mjuk, fyllig och god med en bit nybakad focaccia.","origin":"Egen svensk handelsanpassning med ICA:s krämiga potatis- och purjolökssoppa (4,4/5; 2 177 röster) som svensk bas, och teknik från RecipeTin Eats (4,98/5; 151 röster) och Arla. Soppan är en franskinspirerad varm potatis- och purjolökssoppa, inte kall Vichyssoise. Anpassningen är inte separat provlagad.","groups":[{"title":"Soppa","items":[{"name":"Mjölig potatis","qty":600,"unit":"g","extra":"t.ex. King Edward; cirka 6 medelstora","fixed":""},{"name":"Purjolök","qty":1,"unit":"st","extra":"stor, cirka 300 g; använd vit och ljusgrön del","fixed":""},{"name":"Vitlöksklyfta","qty":1,"unit":"st","extra":"finhackad","fixed":""},{"name":"Smör","qty":25,"unit":"g","extra":"till att mjuksteka purjolöken","fixed":""},{"name":"Torkad timjan","qty":0.5,"unit":"tsk","extra":"eller 1 tsk färsk","fixed":""},{"name":"Grönsaksbuljong","qty":8,"unit":"dl","extra":"8 dl vatten och cirka 2 buljongtärningar; justera sältan efter fabrikat","fixed":""},{"name":"Vispgrädde","qty":2,"unit":"dl","extra":"40 %","fixed":""},{"name":"Färskpressad citronsaft","qty":1,"unit":"tsk","extra":"smaka av; valfritt för balanserad friskhet","fixed":""},{"name":"Salt och nymalen svartpeppar","qty":null,"unit":"","extra":"Smaka av på slutet","fixed":"Efter smak"}]},{"title":"Till servering","items":[{"name":"Gräslök","qty":2,"unit":"msk","extra":"finskuren, eller persilja","fixed":""},{"name":"Focaccia eller annat gott bröd","qty":null,"unit":"","extra":"gärna recept #100","fixed":"Efter smak"},{"name":"Knaprig bacon","qty":null,"unit":"","extra":"valfritt för köttvariant; annars är soppan vegetarisk","fixed":"Valfritt"}]}],"steps":[{"title":"Ansa purjolöken","body":"Dela purjolöken på längden och skölj noggrant mellan bladen så att ingen jord är kvar. Skär den vita och ljusgröna delen i tunna skivor. Hacka vitlöken. Skala potatisen och skär i jämnstora bitar, cirka 2 cm."},{"title":"Låt purjon bli söt i smör","body":"Smält smöret i en rymlig kastrull på medellåg värme. Lägg i purjolöken och låt den mjukna långsamt 8–10 minuter under omrörning utan att få färg. Detta är nyckeln till en mild, djup purjosmak. Tillsätt vitlöken och timjan under sista minuten."},{"title":"Koka potatisen mjuk","body":"Lägg i potatisen och häll på grönsaksbuljongen. Koka upp och sjud under lock cirka 15–20 minuter, tills potatisen är helt mjuk. Använd inte högre värme än nödvändigt."},{"title":"Mixa lagom – inte för länge","body":"Ta kastrullen från värmen. Mixa försiktigt med stavmixer i korta omgångar tills soppan är slät, eller mosa med potatisstöt för mer rustik konsistens. Mixa inte längre än nödvändigt: för mycket mixning kan göra potatisen klistrig."},{"title":"Runda av med grädde","body":"Rör ner vispgrädden och värm soppan försiktigt några minuter utan kraftig kokning. Justera tjockleken med lite vatten eller buljong om du vill ha den mer lättflytande."},{"title":"Smaka av","body":"Smaka av med nymalen svartpeppar och salt först när du har provsmakat buljongen. Tillsätt eventuellt 1 tsk citronsaft för att ge soppan en försiktig friskhet."},{"title":"Servera","body":"Häll upp i varma skålar. Toppa med gräslök eller persilja och servera genast med nybakt focaccia (#100). Vill du ha en icke-vegetarisk variant passar knaperstekt bacon som extra topping."}],"tips":[{"title":"Purjon ska inte brynas","body":"Låt den svettas långsamt i smör; brun lök ger en annan smak och färg."},{"title":"Var sparsam med stavmixern","body":"Blanda bara tills soppan är len. Lång mixning frigör potatisstärkelse och kan ge seg, klistrig konsistens."},{"title":"Balans mellan buljong och grädde","body":"Smaka av efter tillsatt grädde. Buljongtärningar varierar mycket i sälta; tillsätt därför extra salt sist."},{"title":"Utmärkt att förbereda","body":"Soppan håller ungefär 3 dagar i kyl vid snabb nedkylning. Värm varsamt och späd vid behov; gräddbaserad soppa kan få något ändrad konsistens efter frysning."},{"title":"Bäst tillsammans","body":"Servera med färsk focaccia ur recept #100 för en enkel, komplett sopplunch."}],"sources":[["ICA – Krämig potatis- och purjolökssoppa","https://www.ica.se/recept/kramig-potatis-och-purjolokssoppa-716077/"],["RecipeTin Eats – Leek and Potato Soup","https://www.recipetineats.com/leek-and-potato-soup/"],["Arla – Potatis- och purjolökssoppa","https://www.arla.se/recept/potatis--och-purjolokssoppa/"],["Stefan Ekengren – Potatis- och purjolökssoppa","https://www.koket.se/stefans-potatis-och-purjolokssoppa"]],"tags":["Vegetariskt","Potatis","Snabbt"],"countryCode":"FR","countryName":"Frankrike","countryFlag":"🇫🇷","countryNote":"Frankrike – franskinspirerad varm potatis- och purjolökssoppa, populär i svensk vardagsmat.","nutrition":{"kcal":375,"protein":6,"carbs":34,"fat":24,"per":"portion","servings":4,"estimated":true},"shoppingTips":["En stor purjolök på cirka 300 g och cirka 600 g mjölig potatis räcker till fyra portioner; köp gärna en 1-kilospåse potatis och använd resten i en annan rätt.","En 2,5 dl-förpackning vispgrädde räcker till soppans 2 dl, med lite kvar att ringla över vid servering.","Välj grönsaksbuljong för att behålla rätten vegetarisk. En buljongtärning till 5 dl vatten är vanligt, men följ gärna förpackningens anvisning och smaka av."]},{"id":"focaccia-rosmarin","name":"Focaccia med rosmarin och flingsalt","subtitle":"Luftigt italienskt bröd med krispig olivoljeskorpa","category":"Bröd & tillbehör","emoji":"🍞","tone":"butter","badge":"Italiensk brödklassiker","yieldBase":"8 stora bitar (1 bröd)","yields":[4,0,8,0,16,0],"time":"Ca 3½–4 tim, varav 25 min aktivt arbete","difficulty":"Enkel–medel","temp":"240°C","intro":"Luftig, bubblig focaccia med mjukt inkråm, gyllene och knapriga kanter, generöst med god olivolja, doftande rosmarin och flingsalt. Degen viks i bunken utan klassisk knådning.","origin":"Huvudkälla King Arthur Baking Big and Bubbly Focaccia (4,8/5; över 500 recensioner), med jämförelse mot King Arthurs No-Fuss Focaccia (4,7/5; 475 recensioner) och ICA:s Saftig focaccia (4,3/5; 103 röster). Mängder och vikmetod är svensk anpassning med färsk jäst eller torrjäst, rosmarin och svensk metallform. Ej separat provbakad.","groups":[{"title":"Focacciadeg","items":[{"name":"Vetemjöl","qty":360,"unit":"g","extra":"cirka 6 dl; gärna vetemjöl special för extra bra struktur","fixed":""},{"name":"Ljummet vatten","qty":285,"unit":"g","extra":"motsvarar cirka 2,85 dl; cirka 35–38°C vid färsk jäst","fixed":""},{"name":"Färsk jäst","qty":10,"unit":"g","extra":"eller 3 g instanttorrjäst; se tips om jästsort","fixed":""},{"name":"Salt, fint","qty":9,"unit":"g","extra":"cirka 1½ tsk","fixed":""},{"name":"Strösocker","qty":1,"unit":"tsk","extra":"hjälper jäsningen","fixed":""},{"name":"Extra jungfruolivolja till degen","qty":1.5,"unit":"msk","extra":"cirka 20 g","fixed":""}]},{"title":"Till form och topping","items":[{"name":"Extra jungfruolivolja","qty":2,"unit":"msk","extra":"hälften i formen och hälften på brödet","fixed":""},{"name":"Färsk rosmarin","qty":1,"unit":"msk","extra":"nålar finhackade; eller 1 tsk torkad","fixed":""},{"name":"Flingsalt","qty":0.5,"unit":"tsk","extra":"strö jämt över, gärna Maldon","fixed":""}]}],"steps":[{"title":"Blanda den lösa degen","body":"Häll ljummet vatten i en stor bunke. Smula i färsk jäst och rör tills den lösts upp. Använder du instanttorrjäst kan den blandas direkt med mjölet. Tillsätt vetemjöl, salt, strösocker och olivolja. Rör med stadig slev eller slickepott tills allt mjöl gått in. Degen ska vara mycket mjuk och klibbig – tillsätt inte extra mjöl. Täck och låt vila 15 minuter."},{"title":"Vik degen första gången","body":"Fukta ena handen med vatten. Ta tag i en degkant, lyft försiktigt upp och vik in mot mitten. Vrid bunken och upprepa 8–12 gånger runt om. Täck och vila 15 minuter."},{"title":"Vik ytterligare tre gånger","body":"Upprepa samma vikning tre gånger till med cirka 15 minuters vila mellan varje omgång. Degen ska successivt bli slätare och mer elastisk utan att du behöver knåda på bänken."},{"title":"Första jäsningen","body":"Låt degen jäsa övertäckt i rumstemperatur cirka 60 minuter efter sista vikningen, tills den är tydligt puffig och nästan fördubblad. Tiden beror på hur varmt du har hemma."},{"title":"Flytta till oljad form","body":"Ta en metallform cirka 23 × 23 cm, gärna med löstagbar botten eller en remsa bakplåtspapper som handtag. Fördela 1 msk olivolja på botten och sidorna. För försiktigt över degen utan att pressa ut luften och vänd varsamt en gång så att den täcks av lite olja. Sträck lätt mot hörnen; den behöver inte fylla hela formen än."},{"title":"Andra jäsningen","body":"Täck formen och låt degen jäsa ytterligare cirka 60–90 minuter tills den ser riktigt luftig och lätt dallrig ut och nästan når formens kanter. Mot slutet: sätt ugnen på 240°C över- och undervärme."},{"title":"Gör de klassiska groparna","body":"Olja fingertopparna och tryck bestämt men varsamt hål hela vägen mot formens botten med 3–4 cm mellanrum. Häll över resterande 1 msk olivolja och strö på rosmarin samt flingsalt. Undvik att platta ut degen mer än nödvändigt."},{"title":"Grädda gyllenbrunt","body":"Grädda på den nedre halvan av ugnen i cirka 17–22 minuter, tills ytan är ordentligt gyllene och kanterna fått färg. Kontrollera tidigare om din ugn är kraftig. Täck löst med folie om rosmarinen mörknar innan brödet är klart."},{"title":"Gör skorpan krispig","body":"Lyft focaccian ur formen och lägg på galler. För extra krispiga kanter kan du ställa tillbaka brödet direkt på ugnsgallret i den avstängda men varma ugnen 3–5 minuter. Låt svalna 10–15 minuter före uppskärning så att inkråmet hinner sätta sig."},{"title":"Servera","body":"Skär i åtta bitar och servera gärna ljummen till potatis- och purjolökssoppan i recept #99, eller som tillbehör till pastarätter, sallader och grytor."}],"tips":[{"title":"Bubblorna kommer av hög vätskemängd","body":"Degen är betydligt lösare än vanlig vetedeg. Det är meningen. Att tillsätta extra mjöl gör brödet kompaktare."},{"title":"Färsk jäst eller torrjäst","body":"10 g färsk jäst motsvarar ungefär 3 g instanttorrjäst. Vanlig svensk torrjäst fungerar också enligt paketets instruktioner, men följ jästens aktivering och räkna med att jästiden kan variera."},{"title":"Metallform ger bättre yta","body":"En metallform kring 23 × 23 cm ger tjock, fluffig focaccia med jämn bryning. En större form ger tunnare bröd och kortare gräddtid."},{"title":"Kalljäsning ger mer smak","body":"Efter vikningarna kan du täcka och ställa degen i kyl 8–24 timmar. Lägg sedan kall deg i oljad form och låt jäsa i rumstemperatur cirka 2–3 timmar innan gräddning."},{"title":"Bäst samma dag","body":"Focaccia är godast nygräddad. Frys gärna in bitar samma dag och värm på 180°C tills genomvarma, så blir ytan krispig igen."},{"title":"Perfekt ihop med recept #99","body":"Det här brödet passar till potatis- och purjolökssoppan men också till våra italienska pastarätter och gratänger."}],"sources":[["King Arthur Baking – Big and Bubbly Focaccia","https://www.kingarthurbaking.com/recipes/big-and-bubbly-focaccia-recipe"],["King Arthur Baking – No-Fuss Focaccia","https://www.kingarthurbaking.com/recipes/no-fuss-focaccia-recipe"],["ICA – Saftig focaccia","https://www.ica.se/recept/saftig-focaccia-basta-receptet-729872/"]],"tags":["Vegetariskt","Ugn","Bröd"],"countryCode":"IT","countryName":"Italien","countryFlag":"🇮🇹","countryNote":"Italien – klassiskt olivoljebröd från italiensk baktradition.","nutrition":{"kcal":225,"protein":5,"carbs":35,"fat":7,"per":"bit","servings":8,"estimated":true},"shoppingTips":["360 g vetemjöl ryms utan problem i en vanlig 1–2 kg-påse. Vetemjöl special är bra men vanligt vetemjöl fungerar enligt King Arthur-receptets princip.","Köp ett 50 g-paket färsk jäst och använd 10 g, eller ta 3 g ur en 12 g-påse instanttorrjäst. Förvara återstoden enligt förpackningen.","Olivolja behövs totalt cirka 3½ msk. En kruka rosmarin ger mer än nog till topping; resten kan frysas eller användas till andra rätter."]}]</script><script>

const normalize=s=>String(s).toLocaleLowerCase('sv-SE').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function setNav(which){document.querySelectorAll('.navlink').forEach(el=>el.setAttribute('aria-current',el.dataset.nav===which?'page':'false'));$('#bagcount').textContent=bag.size||'';$('#bagcount').style.display=bag.size?'inline-grid':'none'}
function home(){setNav('home');$('#content').innerHTML=`<section class="wrap"><div class="hero"><div><div class="eyebrow">Din personliga receptsamling · ${data.length} recept</div><h1>Goda recept.<br><em>På ett ställe.</em></h1><p>Utvalda recept, smarta tillagningstips och ingredienser du enkelt kan hitta i svenska matbutiker. Från vardagsmiddagar till riktigt bra bakverk.</p></div><div class="hero-art" aria-hidden="true"><div class="circle"></div><div class="sprig">✶ ✳</div><div class="note">Lagat med omsorg ✦</div></div></div><div class="rule"></div><div class="toolbar"><label class="searchbox"><span class="glass" aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Sök bland recept och ingredienser..." value="${escapeHtml(query)}" aria-label="Sök recept"></label><div class="filters" id="filters"></div><span class="mobile-filter-tip" aria-hidden="true">Svep för fler kategorier →</span></div><div class="extra-filters"><label class="filter-field" for="tag-filter"><span>Tagg</span><select id="tag-filter" aria-label="Filtrera efter tagg"></select></label><label class="filter-field" for="country-filter"><span>Ursprung</span><select id="country-filter" aria-label="Filtrera efter land"></select></label><button type="button" class="reset-filters" id="reset-filters" data-action="clear-filter" hidden>Rensa filter ×</button></div><p class="filter-hint">Flaggan visar receptets främsta mattradition. Vissa rätter har flera ursprung eller är lokala tolkningar.</p><div class="section-title"><h2 id="section-heading">Alla recept</h2><span id="result-count"></span></div><div class="cards" id="cards"></div></section>`;renderCards()}
function renderCards(){
 const cats=['Alla','Svensk husman','Pasta & pizza','Världens kök','Snabbmat & street food','Smörgåsar','Frukost & brunch','Bakverk & fika','Bröd & tillbehör','Efterrätter'];
 $('#filters').innerHTML=cats.map(c=>`<button class="pill ${category===c?'active':''}" data-action="filter" data-value="${escapeHtml(c)}" aria-pressed="${category===c}">${escapeHtml(c)}</button>`).join('')+`<button class="pill ${onlyFavs?'active':''}" data-action="favorites" aria-pressed="${onlyFavs}">♥ Sparade</button>`;
 const tags=['Alla','Snabbt','Köttfärs','Nötkött','Kyckling','Fisk & skaldjur','Fläsk & korv','Vegetariskt','Potatis','Ost','Ugn','Långkok','Festmat','Choklad','Bröd'];
 $('#tag-filter').innerHTML=tags.map(t=>`<option value="${escapeHtml(t)}" ${activeTag===t?'selected':''}>${t==='Alla'?'Alla taggar':escapeHtml(t)}</option>`).join('');
 const countries=Object.values(data.reduce((a,r)=>(a[r.countryCode]={code:r.countryCode,flag:r.countryFlag,name:r.countryName},a),{})).sort((a,b)=>a.name.localeCompare(b.name,'sv'));
 $('#country-filter').innerHTML='<option value="Alla">Alla länder</option>'+countries.map(c=>`<option value="${c.code}" ${activeCountry===c.code?'selected':''}>${c.flag} ${escapeHtml(c.name)}</option>`).join('');
 const filtered=data.filter(r=>(category==='Alla'||r.category===category)&&(activeTag==='Alla'||r.tags.includes(activeTag))&&(activeCountry==='Alla'||r.countryCode===activeCountry)&&(!onlyFavs||favs.has(r.id))&&normalize([r.name,r.subtitle,r.intro,r.category,r.countryName,r.countryNote,...r.tags,...r.groups.flatMap(g=>g.items.map(i=>i.name))].join(' ')).includes(normalize(query)));
 $('#result-count').textContent=filtered.length+' av '+data.length+' recept';
 $('#section-heading').textContent=onlyFavs?'Dina sparade recept':category==='Alla'?'Alla recept':category;
 $('#reset-filters').hidden=category==='Alla'&&activeTag==='Alla'&&activeCountry==='Alla'&&!onlyFavs&&!query;
 $('#cards').innerHTML=filtered.length?filtered.map(card).join(''):`<div class="empty" style="grid-column:1/-1"><div class="big">⌕</div><h3>Inga recept hittades</h3><p>Prova ett annat sökord eller välj en annan kategori, tagg eller ett annat land.</p><button class="btn secondary" data-action="clear-filter">Visa alla recept</button></div>`;
}
function card(r){return `<article class="recipe-card"><button class="fav ${favs.has(r.id)?'on':''}" data-action="favorite" data-id="${r.id}" aria-label="${favs.has(r.id)?'Ta bort från sparade':'Spara receptet'}" aria-pressed="${favs.has(r.id)}">${favs.has(r.id)?'♥':'♡'}</button><a class="card-link" href="#recept/${r.id}"><div class="card-art ${r.tone}"><span class="card-badge">${escapeHtml(r.badge)}</span><span class="card-emoji" aria-hidden="true">${r.emoji}</span></div><div class="card-body"><div class="card-category">${escapeHtml(r.category)}</div><h3 class="card-title"><span class="origin-flag" role="img" aria-label="${escapeHtml(r.countryNote)}" title="${escapeHtml(r.countryNote)}">${r.countryFlag}</span>${escapeHtml(r.name)}</h3><p class="card-desc">${escapeHtml(r.subtitle)}</p><div class="card-tags">${r.tags.slice(0,2).map(t=>`<span>${escapeHtml(t)}</span>`).join('')}</div><div class="card-bottom"><span>◷ ${escapeHtml(r.time)}</span><span>◉ ${escapeHtml(r.difficulty)}</span><span aria-hidden="true">↗</span></div></div></a></article>`}
// Näringsvärden är överslagsberäkningar per standardportion. Ändrad sats ger motsvarande antal portioner.
// Svenska inköpsråd beskriver vanliga förpackningar utan att ändra receptets smakbalans.
// Råden avser alltid grundsatsen; receptets egna ingrediensmängder skalas separat.
function shoppingHtml(r,m){
  if(!r.shoppingTips?.length)return '';
  return `<details class="shopping-details"><summary><span>🛒 Smarta inköp</span><span aria-hidden="true">⌄</span></summary><div class="shopping-inner">${r.shoppingTips.map(t=>`<p>${escapeHtml(t)}</p>`).join('')}${m!==1?'<small>Inköpsråden avser 1 sats. Anpassa antalet förpackningar till den valda satsstorleken.</small>':''}</div></details>`;
}
function nutritionHtml(r,m){
  const n=r.nutrition;
  if(!n)return '';
  const unit=n.per==='bit'?'bit':n.per==='styck'?'styck':'portion';
  const howMany=yieldText(r,m);
  return `<details class="nutrition-details"><summary><span><strong>Ungefärligt näringsvärde</strong><small>Per ${unit} · beräknad uppskattning</small></span><span class="nutrition-arrow" aria-hidden="true">⌄</span></summary><div class="nutrition-content"><div class="nutrition-grid"><div class="nutrition-stat"><strong>${n.kcal}</strong><small>kcal</small><span>Energi</span></div><div class="nutrition-stat"><strong>${n.protein} g</strong><small>Protein</small></div><div class="nutrition-stat"><strong>${n.carbs} g</strong><small>Kolhydrater</small></div><div class="nutrition-stat"><strong>${n.fat} g</strong><small>Fett</small></div></div><p class="nutrition-disclaimer">Per ${unit}, baserat på angivet grundrecept (cirka ${n.servings} ${n.per==='bit'?'bitar':n.per==='styck'?'stycken':'portioner'}). När du väljer ½ eller 2 satser ändras totalmängden men normalt inte värdet per ${unit}. <strong>Uppskattat</strong> från representativa livsmedelsvärden och antagna standardvikter; valfria tillbehör är oftast inte inräknade. Varumärken, tillagning, oljeförbrukning och portionsstorlek kan ge betydande skillnader. Inte ett laboratorievärde eller en näringsdeklaration.</p></div></details>`;
}
function detail(r){setNav('home');let m=multiplier(r.id);let selected=bag.has(r.id);$('#content').innerHTML=`<article class="wrap"><div class="detail-head"><button class="back" data-action="back">← Till alla recept</button><div class="detail-header"><div><div class="eyebrow">${escapeHtml(r.category)} / ${escapeHtml(r.badge)}</div><h1><span class="origin-flag detail-flag" role="img" aria-label="${escapeHtml(r.countryNote)}" title="${escapeHtml(r.countryNote)}">${r.countryFlag}</span>${escapeHtml(r.name)}</h1><p>${escapeHtml(r.intro)}</p><div class="origin-detail"><span class="origin-caption" title="${escapeHtml(r.countryNote)}">${r.countryFlag} ${escapeHtml(r.countryName)} <span aria-hidden="true">·</span> ${escapeHtml(r.countryNote)}</span>${r.tags.map(t=>`<span class="detail-tag">${escapeHtml(t)}</span>`).join('')}</div></div><div class="detail-visual ${r.tone}" aria-hidden="true"><span>${r.emoji}</span></div></div><div class="detail-meta"><span class="meta">◷ ${escapeHtml(r.time)}</span><span class="meta">♧ ${escapeHtml(yieldText(r,m))}</span><span class="meta">◉ ${escapeHtml(r.difficulty)}</span>${r.temp?`<span class="meta">♨ ${escapeHtml(r.temp)}</span>`:''}</div><div class="detail-actions"><button class="btn ${selected?'selected':''}" data-action="bag-add" data-id="${r.id}">${selected?'✓ Tillagd i inköpslistan':'+ Lägg till i inköpslistan'}</button><button class="btn secondary" data-action="favorite" data-id="${r.id}">${favs.has(r.id)?'♥ Sparat':'♡ Spara recept'}</button><button class="btn secondary" data-action="print">⎙ Skriv ut</button></div></div><div class="recipe-layout"><aside class="ingredients-panel"><div class="panel-heading"><h2>Ingredienser</h2><small>${escapeHtml(yieldText(r,m))}</small><div class="servings" role="group" aria-label="Ändra satsstorlek">${[.5,1,2].map(v=>`<button class="${m===v?'active':''}" data-action="scale" data-id="${r.id}" data-value="${v}" aria-pressed="${m===v}">${v===.5?'½ sats':v===1?'1 sats':'2 satser'}</button>`).join('')}</div></div>${r.groups.map((g,gi)=>`<div class="ing-group"><h3>${escapeHtml(g.title)}</h3>${g.items.map((i,ii)=>{let key=r.id+'/'+gi+'/'+ii;return `<label class="ingredient ${checks[key]?'checked':''}"><input type="checkbox" data-action="check" data-key="${key}" ${checks[key]?'checked':''}/><span class="ing-name">${escapeHtml(i.name)}</span><span class="ing-amount">${amount(i,m)}</span></label>`}).join('')}</div>`).join('')}<div class="ingredient-foot">Bocka av ingredienser medan du lagar. ${m!==1?'Mängderna är proportionellt omräknade. Delade ägg kan behöva vispas upp och vägas.':''}</div>${shoppingHtml(r,m)}</aside><div class="method"><h2>Gör så här</h2><ol class="steps">${r.steps.map((s,i)=>`<li class="step"><div class="step-index">${i+1}</div><div><h3>${escapeHtml(s.title)}</h3><p>${escapeHtml(s.body)}</p></div></li>`).join('')}</ol><section class="tips"><h2>Tips som gör skillnad</h2>${r.tips.map(t=>`<div class="tip"><span class="tip-icon">✓</span><div><strong>${escapeHtml(t.title)}</strong><p>${escapeHtml(t.body)}</p></div></div>`).join('')}</section>${nutritionHtml(r,m)}<section class="source-box"><strong>Om receptet</strong><p>${escapeHtml(r.origin)}</p><div class="source-links">${r.sources.map(s=>`<a href="${escapeHtml(s[1])}" target="_blank" rel="noopener noreferrer">${escapeHtml(s[0])} ↗</a>`).join('')}</div><div class="note-chip">Originalkällorna används som referenser. Egenanpassade versioner är inte automatiskt smaktestade eller verifierade som bäst i ett blindtest.</div></section></div></div></article>`}
function bagView(){setNav('bag');const chosen=data.filter(r=>bag.has(r.id));$('#content').innerHTML=`<div class="wrap"><div class="bag-header"><div class="eyebrow">Allt samlat inför handlingen</div><h1>Inköpslistan</h1><p>Välj de recept du vill laga. Ingredienserna listas per recept så att mängderna inte blandas ihop.</p></div><div class="bag-layout"><aside class="bag-panel"><h2>Välj recept</h2>${data.map(r=>`<label class="bag-choice"><input type="checkbox" data-action="bag-toggle" data-id="${r.id}" ${bag.has(r.id)?'checked':''}/><span>${r.emoji} ${escapeHtml(r.name)}</span></label>`).join('')}</aside><div class="bag-panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2 style="margin:0">${chosen.length} ${chosen.length===1?'recept':'recept'} valda</h2><button class="btn" data-action="copy-bag" ${!chosen.length?'disabled':''}>⎘ Kopiera listan</button></div>${chosen.length?chosen.map(r=>`<section class="bag-recipe"><h3>${r.emoji} ${escapeHtml(r.name)} <small style="font:12px sans-serif;color:var(--muted)">(${escapeHtml(yieldText(r,multiplier(r.id)))})</small></h3><ul>${r.groups.flatMap(g=>g.items.map(i=>`<li>□ ${escapeHtml(i.name)} – ${amount(i,multiplier(r.id))}</li>`)).join('')}</ul>${r.shoppingTips?.length?`<p class="bag-shopping-tip">🛒 ${escapeHtml(r.shoppingTips.join(' '))}${multiplier(r.id)!==1?' (Råden avser 1 sats.)':''}</p>`:''}</section>`).join(''):`<div class="empty" style="margin-top:16px"><div class="big">🧺</div><h3>Din lista är tom</h3><p>Markera recept till vänster, eller lägg till dem direkt från receptsidorna.</p></div>`}</div></div></div>`}
function bagText(){return data.filter(r=>bag.has(r.id)).map(r=>r.name+' ('+yieldText(r,multiplier(r.id))+')\n'+r.groups.flatMap(g=>g.items.map(i=>'☐ '+i.name+' – '+(i.fixed||formatAmount(i.qty*multiplier(r.id))+' '+i.unit))).join('\n')+(r.shoppingTips?.length?'\nInköpstips (grundsats): '+r.shoppingTips.join(' '):'')).join('\n\n')}
async function copyBag(){const txt=bagText();if(!txt)return;try{await navigator.clipboard.writeText(txt);toast('Inköpslistan kopierad')}catch(e){const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;left:-10000px';document.body.append(ta);ta.select();const ok=document.execCommand('copy');ta.remove();toast(ok?'Inköpslistan kopierad':'Kopiering stöds inte i den här webbläsaren')}}
function route(){const h=decodeURIComponent(location.hash);window.scrollTo({top:0});if(h.startsWith('#recept/')){let id=h.slice(8);let r=data.find(r=>r.id===id);r?detail(r):home()}else if(h==='#inkopslista')bagView();else home()}
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;renderCards()}});
document.addEventListener('change',e=>{if(e.target.id==='tag-filter'){activeTag=e.target.value;renderCards();return}if(e.target.id==='country-filter'){activeCountry=e.target.value;renderCards();return}const a=e.target.dataset.action;if(a==='check'){checks[e.target.dataset.key]=e.target.checked;store('checks',checks);e.target.closest('.ingredient').classList.toggle('checked',e.target.checked)}if(a==='bag-toggle'){e.target.checked?bag.add(e.target.dataset.id):bag.delete(e.target.dataset.id);store('bag',[...bag]);bagView()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;const id=b.dataset.id;if(a==='filter'){category=b.dataset.value;renderCards()}else if(a==='favorites'){onlyFavs=!onlyFavs;renderCards()}else if(a==='favorite'){favs.has(id)?favs.delete(id):favs.add(id);store('favs',[...favs]);if(location.hash.startsWith('#recept/'))detail(data.find(r=>r.id===id));else renderCards()}else if(a==='clear-filter'){category='Alla';activeTag='Alla';activeCountry='Alla';onlyFavs=false;query='';home()}else if(a==='back'){location.hash='#samling'}else if(a==='bag-add'){bag.has(id)?bag.delete(id):bag.add(id);store('bag',[...bag]);detail(data.find(r=>r.id===id));toast(bag.has(id)?'Tillagt i inköpslistan':'Borttaget från inköpslistan')}else if(a==='scale'){scales[id]=Number(b.dataset.value);store('scales',scales);detail(data.find(r=>r.id===id))}else if(a==='print'){window.print()}else if(a==='copy-bag'){copyBag()}});
window.addEventListener('hashchange',route);
route();
</script></body></html>
