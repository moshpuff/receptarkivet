 prästost","qty":150,"unit":"g","extra":"","fixed":""},{"name":"Körsbärstomater","qty":150,"unit":"g","extra":"","fixed":""},{"name":"Inlagda jalapeños","qty":2,"unit":"msk","extra":"valfritt","fixed":""}]},{"title":"Till servering","items":[{"name":"Isbergssallad","qty":0.5,"unit":"huvud","extra":"","fixed":""},{"name":"Gurka","qty":0.5,"unit":"st","extra":"","fixed":""},{"name":"Majskorn","qty":125,"unit":"g","extra":"valfritt","fixed":""},{"name":"Nachochips","qty":100,"unit":"g","extra":"valfritt","fixed":""}]}],"steps":[{"title":"Gör och kyl degen","body":"Nyp snabbt ihop mjöl, salt, paprika och kallt smör. Tillsätt iskallt vatten och arbeta ihop precis till en deg. Tryck ut i 26 cm pajform, nagga och kyl 20–30 minuter."},{"title":"Förgrädda pajskalet","body":"Värm ugnen till 225°C. Förgrädda skalet 12–15 minuter tills det är torrt och lätt gyllene. Sänk ugnen till 200°C."},{"title":"Bryn köttfärsen","body":"Fräs hackad lök 3 minuter, tillsätt färs och bryn 5–7 minuter till genomstekt med stekyta."},{"title":"Smaksätt","body":"Fräs tomatpuré 1 minut. Rör ner tacokrydda och vatten och sjud utan lock 5–8 minuter tills nästan all fri vätska har försvunnit."},{"title":"Bygg pajen","body":"Lägg färsen i pajskalet. Rör ihop båda crème fraîche-sorterna och bred över. Toppa med halverade körsbärstomater, eventuell jalapeño och riven ost."},{"title":"Gratinera","body":"Grädda i 200°C cirka 20–25 minuter tills osten är gyllene och fyllningen genomvarm. Skydda kanterna om de mörknar för mycket."},{"title":"Vila och servera","body":"Låt pajen vila 10 minuter för en fastare fyllning. Servera med sallad, gurka och eventuellt nachos."}],"tips":[{"title":"Förgrädda för krisp","body":"Vätska från färs och crème fraîche kan annars mjuka upp pajskalet."},{"title":"En påse tacokrydda","body":"500 g färs behöver tydlig kryddning; smaka innan extra salt tillsätts."},{"title":"Reducera färsen","body":"Ingen lös tacosås ska hällas i pajen."},{"title":"Crème fraîche i stället för äggstanning","body":"Ger den mjuka, syrliga klassiska svenska tacopajstoppingen."}],"sources":[["Arla – Tacopaj","https://www.arla.se/recept/tacopaj/"],["ICA – Krämig tacopaj","https://www.ica.se/recept/kramig-tacopaj-713200/"]],"tags":["Köttfärs","Ost","Ugn"],"countryCode":"SE","countryName":"Sverige","countryFlag":"🇸🇪","countryNote":"Svensk Tex-Mex-inspirerad tacopaj, inte en traditionell mexikansk paj.","nutrition":{"kcal":1120,"protein":42,"carbs":44,"fat":86,"per":"portion","servings":4,"estimated":true},"shoppingTips":["Nötfärsen är 500 g och tacokryddan 28 g ungefär en påse. Resterande körsbärstomater från en större ask kan serveras som sallad."]},{"id":"tonfisksallad","name":"Tonfisksallad","subtitle":"Matig salade niçoise-inspirerad sallad med dijonvinägrett","category":"Världens kök","emoji":"🥗","tone":"sage","badge":"Fräsch lunchklassiker","yieldBase":"4 portioner","yields":[2,0,4,0,8,0],"time":"30–35 min","difficulty":"Enkel","temp":"Spis","intro":"Matig tonfisksallad med mjuk potatis, ägg, haricots verts, tomater, oliver och kapris, med en fräsch dijondressing.","origin":"Inspirerad av Good Food Salade Niçoise och ICAs svenska tonfisksallad. Varm potatis vänds med vinägrett och övriga ingredienser läggs på försiktigt. Sammanvägd anpassning, ej separat provlagad.","groups":[{"title":"Tonfisksallad","items":[{"name":"Fast potatis","qty":600,"unit":"g","extra":"","fixed":""},{"name":"Tonfisk i olja","qty":2,"unit":"burkar","extra":"à 185–200 g, väl avrunnen","fixed":""},{"name":"Ägg","qty":4,"unit":"st","extra":"","fixed":""},{"name":"Haricots verts","qty":150,"unit":"g","extra":"","fixed":""},{"name":"Körsbärstomater","qty":250,"unit":"g","extra":"","fixed":""},{"name":"Rödlök","qty":0.5,"unit":"st","extra":"","fixed":""},{"name":"Romansallad eller krispsallad","qty":100,"unit":"g","extra":"","fixed":""},{"name":"Svarta urkärnade oliver","qty":1,"unit":"dl","extra":"","fixed":""},{"name":"Kapris","qty":2,"unit":"msk","extra":"","fixed":""},{"name":"Bladpersilja","qty":1,"unit":"msk","extra":"valfritt","fixed":""}]},{"title":"Dijonvinägrett","items":[{"name":"Olivolja","qty":4,"unit":"msk","extra":"gärna en del av tonfiskoljan om den är god","fixed":""},{"name":"Vitvinsvinäger","qty":1.5,"unit":"msk","extra":"","fixed":""},{"name":"Dijonsenap","qty":2,"unit":"tsk","extra":"","fixed":""},{"name":"Vatten","qty":1,"unit":"msk","extra":"","fixed":""},{"name":"Vitlöksklyfta","qty":0.5,"unit":"st","extra":"valfritt, finriven","fixed":""},{"name":"Salt","qty":0.5,"unit":"tsk","extra":"smaka av","fixed":""},{"name":"Svartpeppar","qty":null,"unit":"","extra":"","fixed":"Efter smak"}]}],"steps":[{"title":"Koka potatisen","body":"Koka skrubbad potatis mjuk i lättsaltat vatten, cirka 15–20 minuter. Dela den medan den fortfarande är varm."},{"title":"Koka äggen","body":"Koka äggen cirka åtta minuter, kyl snabbt, skala och skär i halvor eller klyftor."},{"title":"Förväll bönorna","body":"Koka haricots verts i saltat vatten 3–5 minuter tills de är mjuka men lite spänstiga. Kyl i kallt vatten."},{"title":"Förbered grönsaker och tonfisk","body":"Halvera tomaterna, skiva rödlöken tunt och torka salladen. Låt tonfisken rinna av och dela den försiktigt i stora bitar."},{"title":"Vispa vinägrett","body":"Rör ihop dijon, vinäger, vatten och eventuell vitlök. Vispa ner olja och krydda med salt och peppar."},{"title":"Dressa varm potatis","body":"Vänd den varma potatisen med ungefär en tredjedel av vinägretten. Låt dra en stund. Vänd sedan försiktigt i bönor, tomat och rödlök med ytterligare lite dressing."},{"title":"Lägg upp","body":"Lägg sallad på ett fat. Fördela potatisblandning, tonfisk i bitar, ägg, oliver och kapris. Toppa med resterande dressing och eventuellt persilja. Servera direkt."}],"tips":[{"title":"Varm potatis tar smak","body":"Vänd gärna ner en del av dressingen direkt efter kokning."},{"title":"Välj tonfisk av god kvalitet","body":"Tonfisk i olja ger fyllighet; låt den rinna av så salladen inte blir oljig."},{"title":"Koka bönor kort","body":"Lätt spänst ger kontrast till potatis och ägg."},{"title":"Kapris och oliver","body":"Ger sälta och syra som lyfter tonfiskens smak."},{"title":"Blanda försiktigt","body":"Lägg på ägg och tonfisk sist så de håller ihop."}],"sources":[["Good Food – Salade niçoise","https://www.bbcgoodfood.com/recipes/salade-nicoise"],["ICA – Sallad niçoise","https://www.ica.se/recept/sallad-nicoise-5116/"],["ICA – Tonfisksallad","https://www.ica.se/recept/tonfisksallad-729832/"]],"tags":["Fisk & skaldjur","Potatis"],"countryCode":"FR","countryName":"Frankrike","countryFlag":"🇫🇷","countryNote":"Fransk salade-niçoise-tradition i en svensk vardagsanpassning.","nutrition":{"kcal":515,"protein":31,"carbs":39,"fat":26,"per":"portion","servings":4,"estimated":true},"shoppingTips":["Tonfisken anges som två hela burkar före avrinning. Kontrollera nettovikt och avrunnen vikt – mängden kan variera mellan märken."]},{"id":"gnocchi-tomatsas","name":"Gnocchi i tomatsås","subtitle":"Gnocchi alla Sorrentina med mozzarella, parmesan och basilika","category":"Pasta & pizza","emoji":"🍅","tone":"ragu","badge":"Italiensk klassiker","yieldBase":"4 portioner","yields":[2,0,4,0,8,0],"time":"35–40 min","difficulty":"Enkel","temp":"225°C","intro":"Italienska mjuka potatisgnocchi i tomatsås med vitlök och basilika, gratinerade med mozzarella och parmesan.","origin":"Huvudkälla The Pasta Projects Gnocchi alla Sorrentina. Tillgänglig svensk färdig potatisgnocchi samt passerade tomater används. Kort gratinering håller gnocchin mjuk. Egna proportioner, ej separat provlagade.","groups":[{"title":"Gnocchi och tomatsås","items":[{"name":"Färdig potatisgnocchi","qty":800,"unit":"g","extra":"helst kyld","fixed":""},{"name":"Passerade tomater","qty":800,"unit":"g","extra":"","fixed":""},{"name":"Vitlöksklyftor","qty":2,"unit":"st","extra":"","fixed":""},{"name":"Extra virgin olivolja","qty":2,"unit":"msk","extra":"","fixed":""},{"name":"Färsk basilika","qty":1,"unit":"kruka","extra":"","fixed":""},{"name":"Salt","qty":0.75,"unit":"tsk","extra":"smaka av","fixed":""},{"name":"Svartpeppar","qty":null,"unit":"","extra":"","fixed":"Efter smak"},{"name":"Socker","qty":0.5,"unit":"tsk","extra":"valfritt om tomaterna är mycket syrliga","fixed":""}]},{"title":"Osttäcke","items":[{"name":"Mozzarella","qty":250,"unit":"g","extra":"två vanliga bollar, låt rinna av","fixed":""},{"name":"Parmesan, finriven","qty":40,"unit":"g","extra":"","fixed":""}]},{"title":"Till servering","items":[{"name":"Grönsallad","qty":100,"unit":"g","extra":"valfritt","fixed":""},{"name":"Balsamvinäger","qty":1,"unit":"msk","extra":"valfritt","fixed":""}]}],"steps":[{"title":"Låt mozzarellan rinna av","body":"Sätt ugnen till 225°C. Riv mozzarellan i bitar och låt dem rinna av 10–15 minuter på hushållspapper så gratängen inte blir för blöt."},{"title":"Fräs vitlök","body":"Finhacka vitlök och fräs försiktigt i olivolja 30–60 sekunder utan att den får färg."},{"title":"Koka tomatsås","body":"Häll i passerade tomater, salt, peppar och halva basilikan. Låt puttra utan lock 12–15 minuter tills såsen tjocknar. Smaka av med eventuellt lite socker."},{"title":"Koka gnocchin kort","body":"Koka färsk gnocchi enligt förpackningen, ofta cirka 2–3 minuter eller tills den flyter. Häll av försiktigt och spara någon matsked kokvatten."},{"title":"Vänd ihop","body":"Vänd försiktigt ner gnocchi och hälften av parmesanen i tomatsåsen. Tillsätt en liten skvätt kokvatten om såsen behöver bli lite lösare."},{"title":"Gratinera","body":"Lägg i ugnsform cirka 20 × 30 cm. Toppa med mozzarella och återstående parmesan. Gratinera 8–12 minuter tills osten smält och allt bubblar lätt."},{"title":"Servera","body":"Låt vila 2–3 minuter och toppa med färsk basilika. Servera gärna med en grönsallad."}],"tips":[{"title":"Kvalitativa tomater","body":"Med så få ingredienser märks tomatsmaken mycket tydligt."},{"title":"Använd färsk basilika","body":"Tillsätt en del på slutet för tydlig doft och färg."},{"title":"Överkoka inte gnocchi","body":"De tillagas även kort under gratinering."},{"title":"Torka mozzarella","body":"Undviker utspädd tomatsås och vattnig gratäng."},{"title":"Ingen grädde behövs","body":"Mozzarella och parmesan ger redan rätt krämighet."}],"sources":[["The Pasta Project – Gnocchi alla Sorrentina","https://www.the-pasta-project.com/gnocchi-alla-sorrentina/"],["Great Italian Chefs – Gnocchi alla Sorrentina","https://www.greatitalianchefs.com/recipes/gnocchi-alla-sorrentina-recipe"]],"tags":["Vegetariskt","Ost","Ugn"],"countryCode":"IT","countryName":"Italien","countryFlag":"🇮🇹","countryNote":"Italien – huvudsaklig mattradition för denna version.","nutrition":{"kcal":640,"protein":27,"carbs":80,"fat":23,"per":"portion","servings":4,"estimated":true},"shoppingTips":["800 g gnocchi passar 2 × 400 g. Passatan 800 g passar exempelvis 2 × 400 g, och mozzarellan 250 g är 2 × 125 g."]},{"id":"tiramisu","name":"Tiramisu","subtitle":"Italiensk klassiker med mascarpone, espresso och savoiardikex","category":"Efterrätter","emoji":"☕","tone":"cocoa","badge":"Klassisk italiensk dessert","yieldBase":"8 portioner","yields":[4,0,8,0,16,0],"time":"35 min + 8 tim kyl","difficulty":"Enkel–medel","temp":"Ingen ugn","intro":"Luftig mascarponekräm på ägg, stark espresso och savoiardikex. En italiensk dessert som görs dagen före servering.","origin":"Inspirerad av RecipeTin Eats, Roy Fares och GialloZafferano. Traditionell mascarponekräm på separerade ägg utan grädde. Svenska/nordiska ägg och kylförvaring är viktigt eftersom äggen inte upphettas.","groups":[{"title":"Mascarponekräm","items":[{"name":"Mascarpone","qty":500,"unit":"g","extra":"","fixed":""},{"name":"Ägg, svenska eller nordiska","qty":4,"unit":"st","extra":"använd pastöriserade ägg om råa ägg behöver undvikas","fixed":""},{"name":"Strösocker","qty":90,"unit":"g","extra":"cirka 1 dl","fixed":""}]},{"title":"Kaffelager","items":[{"name":"Savoiardikex / ladyfingers","qty":200,"unit":"g","extra":"","fixed":""},{"name":"Starkt bryggkaffe eller espresso","qty":2.5,"unit":"dl","extra":"helt avsvalnat","fixed":""}]},{"title":"Till garnering","items":[{"name":"Osötat kakaopulver","qty":2,"unit":"msk","extra":"","fixed":""}]}],"steps":[{"title":"Brygg kaffet","body":"Brygg 2–2½ dl starkt kaffe och låt det bli helt kallt."},{"title":"Vispa gulor och socker","body":"Separera fyra ägg. Vispa äggulorna med 60 g av sockret 4–6 minuter tills blekgula, tjocka och luftiga."},{"title":"Blanda med mascarpone","body":"Rör mascarponen mycket kort mjuk om den är fast. Vänd ner i äggulesmeten i omgångar tills jämn. Undvik övervispning."},{"title":"Vispa äggvitor","body":"Vispa äggvitorna i ren bunke tills de skummar. Tillsätt resterande 30 g socker gradvis och vispa till stadigt, blankt skum."},{"title":"Vänd ihop krämen","body":"Blanda först ner en tredjedel av äggvitorna för att lätta mascarponen. Vänd sedan försiktigt ner resten för att behålla luften."},{"title":"Doppa kexen","body":"Doppa savoiardi i kallt kaffe i högst cirka en sekund per sida. De ska hålla ihop och mjuknar sedan ytterligare i kylen."},{"title":"Varva och kyl","body":"Lägg ett lager kaffedoppade kex i en form 20 × 25 cm, bred på halva krämen och upprepa med kex och resterande kräm. Täck och kyl minst 5–6 timmar, helst över natten."},{"title":"Pudra och servera","body":"Sikta på kakao precis före servering. Skär i åtta bitar med ren kniv."}],"tips":[{"title":"Råa ägg kräver eftertanke","body":"Använd färska ägg från Sverige, Norge, Finland eller Danmark; personer som behöver undvika råa ägg väljer en version med pastöriserade ägg."},{"title":"Doppa kex snabbt","body":"De suger snabbt vätska; för lång blötläggning ger blöt dessert."},{"title":"Övervispa inte mascarpone","body":"Den kan bli för lös om den bearbetas onödigt mycket."},{"title":"Kyl över natten","body":"Ger jämn smak och fastare, mer skärbar kräm."},{"title":"Kakao sist","body":"Ytan blir snyggast och mindre fuktig om den pudras strax före servering."}],"sources":[["RecipeTin Eats – Tiramisu","https://www.recipetineats.com/easy-tiramisu/"],["Köket – Roys klassiska tiramisu","https://www.koket.se/roys-klassiska-tiramisu"],["GialloZafferano – Tiramisù","https://ricette.giallozafferano.it/Tiramisu.html"]],"tags":["Festmat"],"countryCode":"IT","countryName":"Italien","countryFlag":"🇮🇹","countryNote":"Italiensk tiramisu.","nutrition":{"kcal":445,"protein":9,"carbs":33,"fat":31,"per":"portion","servings":8,"estimated":true},"shoppingTips":["500 g mascarpone passar 2 × 250 g. Savoiardikexen är 200 g – kontrollera förpackningens vikt."]},{"id":"croque-monsieur","name":"Croque Monsieur","subtitle":"Fransk bistromacka med skinka, Grevé, dijon och béchamelsås","category":"Smörgåsar","emoji":"🥪","tone":"fries","badge":"Fransk bistroklassiker","yieldBase":"4 portioner","yields":[2,0,4,0,8,0],"time":"35–40 min","difficulty":"Enkel","temp":"200°C","intro":"Smörstekt bröd, skinka och smält ost med ett extra lager tjock, gratinerad béchamelsås – precis som på en fransk bistro.","origin":"RecipeTin Eats och Arla är huvudkällor för smörstekt bröd och fast béchamelsås. Grevé ersätter importerad Gruyère och ger samma tillgängliga nötiga karaktär. Egna mängder, ej separat provlagade.","groups":[{"title":"Béchamelsås","items":[{"name":"Smör","qty":25,"unit":"g","extra":"","fixed":""},{"name":"Vetemjöl","qty":25,"unit":"g","extra":"cirka 2½ msk","fixed":""},{"name":"Standardmjölk 3 %","qty":2.5,"unit":"dl","extra":"","fixed":""},{"name":"Muskot","qty":1,"unit":"krm","extra":"","fixed":""},{"name":"Vitpeppar","qty":1,"unit":"krm","extra":"","fixed":""},{"name":"Salt","qty":null,"unit":"","extra":"","fixed":"Efter smak"}]},{"title":"Smörgåsar","items":[{"name":"Vitt surdegsbröd eller formfranska","qty":8,"unit":"skivor","extra":"1–1½ cm tjocka","fixed":""},{"name":"Rökt skinka","qty":200,"unit":"g","extra":"","fixed":""},{"name":"Grevé, finriven","qty":200,"unit":"g","extra":"","fixed":""},{"name":"Dijonsenap","qty":4,"unit":"tsk","extra":"","fixed":""},{"name":"Smör till stekning","qty":40,"unit":"g","extra":"","fixed":""}]},{"title":"Till servering","items":[{"name":"Blandad sallad","qty":100,"unit":"g","extra":"valfritt","fixed":""},{"name":"Olivolja","qty":1,"unit":"msk","extra":"valfritt","fixed":""},{"name":"Vitvinsvinäger","qty":1,"unit":"tsk","extra":"valfritt","fixed":""}]}],"steps":[{"title":"Gör tjock béchamel","body":"Sätt ugnen på 200°C. Smält 25 g smör, vispa ner mjöl och fräs 1–2 minuter utan färg. Vispa gradvis ner mjölk och sjud 3–5 minuter till bredbar sås. Krydda med muskot, vitpeppar och lite salt."},{"title":"Fördela ost och senap","body":"Riv 200 g ost och dela i 120 g fyllning och 80 g topping. Bred 1 tsk dijon på insidan av fyra brödskivor. Bred ungefär 1 msk béchamel på fyra andra skivor."},{"title":"Bygg mackorna","body":"Lägg skinka och de 120 g osten på senapssidorna. Lägg på resterande skivor med béchamelsidan inåt."},{"title":"Smörstek","body":"Stek i smör i omgångar på medelvärme cirka 2 minuter per sida tills brödet är gyllene. Flytta till bakpappersklädd plåt."},{"title":"Toppa med sås och ost","body":"Fördela resten av béchamelsåsen på ovansidan av de redan rostade mackorna. Strö på återstående 80 g ost."},{"title":"Gratinera","body":"Gratinera högt upp i 200°C cirka 8–10 minuter tills osten smält och mackorna är genomvarma. Avsluta ev. kort under grill för färg."},{"title":"Servera","body":"Vila 1–2 minuter och skär gärna diagonalt. Servera varmt med lätt syrlig sallad. Ett stekt ägg på varje macka gör den till Croque Madame."}],"tips":[{"title":"Stek före gratinering","body":"Minskar risken att brödet blir blött under såsen."},{"title":"Fast sås","body":"Béchamel som kan bredas ut stannar där den ska."},{"title":"Grevé ger en nötig smak","body":"Bra svensk ersättare för fransk Gruyère."},{"title":"Dijon balanserar","body":"Ger skärpa till smör, ost och skinka."},{"title":"Ät direkt","body":"Krispigheten försvinner gradvis när mackorna står."}],"sources":[["RecipeTin Eats – Croque Monsieur","https://www.recipetineats.com/croque-monsieur-french-ham-cheese-sandwich/"],["Arla – Croque Monsieur","https://www.arla.se/recept/croque-monsieur/"]],"tags":["Ost","Fläsk & korv"],"countryCode":"FR","countryName":"Frankrike","countryFlag":"🇫🇷","countryNote":"Frankrike – huvudsaklig mattradition för denna version.","nutrition":{"kcal":630,"protein":33,"carbs":48,"fat":34,"per":"portion","servings":4,"estimated":true},"shoppingTips":["Åtta skivor bröd kan tas från en limpa. Skinkan är 200 g; köp gärna en 200 g-förpackning eller samma mängd över disk."]},{"id":"tuna-melt","name":"Tuna Melt","subtitle":"Amerikansk tonfiskmacka med smält cheddar, saltgurka och krispigt bröd","category":"Smörgåsar","emoji":"🥪","tone":"fries","badge":"Amerikansk dinerklassiker","yieldBase":"4 portioner","yields":[2,0,4,0,8,0],"time":"20–25 min","difficulty":"Enkel","temp":"Stekpanna","intro":"Smörstekt amerikansk diner-toast med välavrunnen tonfiskröra, syrlig saltgurka och selleri och rikligt med smält cheddar.","origin":"Huvudkällor Bon Appétit (2026), The Modern Proper och Little Spoon Farm, jämförda med ICA Hot Tuna Melt och Serious Eats teknikguide. Torrlagd tonfisk i vatten, finhackad syrlig fyllning, två skivor ost per macka och varsam stekning ger mindre blött bröd. Exakta svenska proportioner ej separat provlagade.","groups":[{"title":"Tonfiskröra","items":[{"name":"Tonfisk i vatten","qty":2,"unit":"burkar","extra":"à cirka 170–185 g före avrinning","fixed":""},{"name":"Majonnäs","qty":1,"unit":"dl","extra":"","fixed":""},{"name":"Selleristjälk","qty":1,"unit":"st","extra":"finhackad","fixed":""},{"name":"Rödlök","qty":0.5,"unit":"st","extra":"liten, finhackad","fixed":""},{"name":"Saltgurka","qty":2,"unit":"st","extra":"små, finhackade och avrunna","fixed":""},{"name":"Dijonsenap","qty":2,"unit":"tsk","extra":"","fixed":""},{"name":"Citronjuice","qty":2,"unit":"tsk","extra":"","fixed":""},{"name":"Svartpeppar","qty":null,"unit":"","extra":"","fixed":"Efter smak"},{"name":"Salt","qty":null,"unit":"","extra":"","fixed":"Efter smak; kontrollera sältan först"}]},{"title":"Smörgåsar","items":[{"name":"Stadigt vitt surdegsbröd","qty":8,"unit":"skivor","extra":"gärna cirka 1–1½ cm tjocka","fixed":""},{"name":"Lagrad cheddar, skivad","qty":8,"unit":"skivor","extra":"cirka 140–160 g totalt","fixed":""},{"name":"Smör, mjukt","qty":35,"unit":"g","extra":"","fixed":""}]},{"title":"Till servering","items":[{"name":"Saltgurka","qty":4,"unit":"st","extra":"valfritt","fixed":""},{"name":"Potatischips","qty":100,"unit":"g","extra":"valfritt","fixed":""},{"name":"Grönsallad","qty":100,"unit":"g","extra":"valfritt","fixed":""}]}],"steps":[{"title":"Låt tonfisken rinna av","body":"Häll av tonfisken i sil och tryck försiktigt ut vätskan. Väldigt blöt tonfisk ger en rinnig röra och mjukt bröd."},{"title":"Hacka grönsaker","body":"Finhacka selleri, rödlök och saltgurka. Låt saltgurkan rinna av eller klappa den lätt torr om den är väldigt saftig."},{"title":"Blanda tonfiskröra","body":"Blanda tonfisk med majonnäs, selleri, lök, gurka, dijon, citron och peppar. Smaka av; salta bara om det behövs. Röran ska vara krämig men inte blöt."},{"title":"Bygg mackorna","body":"Smöra utsidan av alla åtta brödskivor tunt. Lägg en cheddarostskiva på insidan av fyra skivor, fördela tonfiskröran, lägg ytterligare en ostskiva över varje och stäng med resten av brödet, smörsidan utåt."},{"title":"Stek på medellåg värme","body":"Stek två mackor i taget i torr nonstick-panna på medellåg värme ungefär 3–5 minuter per sida. Lägg eventuellt på lock kort för att smälta osten, men lyft av det på slutet så att brödet förblir frasigt."},{"title":"Servera direkt","body":"Låt stå cirka en minut och skär diagonalt. Servera med extra saltgurka, chips eller grönsallad. Fyllningen ska vara varm och osten ordentligt smält."}],"tips":[{"title":"Torr tonfisk är nyckeln","body":"Tonfisk i vatten, noggrant avrunnen, ger en tydlig tonfisksmak utan oljig och blöt fyllning."},{"title":"Små bitar grönsaker","body"  gärna en bunke en stund. Rör kalvfärs, salt och vitpeppar tills färsen börjar binda; tillsätt kalla äggulor."},{"title":"Tillsätt grädde","body":"Arbeta ner iskall grädde lite i taget i tre–fyra omgångar. Smeten ska vara slät och ganska lös. Kyl 10–15 minuter."},{"title":"Forma och panera","body":"Dela i fyra portioner, forma varsamt biffar cirka 1,5–2 cm tjocka med fuktade händer och vänd försiktigt i fint ströbröd."},{"title":"Stek och tillaga färdigt","body":"Stek varsamt i smör på medelvärme cirka 3–5 minuter per sida tills ljust gyllene. Låt eftersteka på låg värme eller kort i 150°C ugn så de blir ordentligt genomstekta; sikta på cirka 70°C i kärnan."},{"title":"Gör purén","body":"Pressa potatisen. Rör ner smör och sedan uppvärmd mjölk och grädde lite i taget. Smaka av med salt, vitpeppar och eventuellt muskot. Ingen stavmixer."},{"title":"Värm ärtorna","body":"Värm gröna ärtor med lite vatten, 10 g smör och salt tills genomvarma."},{"title":"Bryn smöret","body":"Värm 60 g smör i ljus kastrull tills det doftar nötigt och mjölkproteinet är gyllenbrunt. Ta genast från värmen."},{"title":"Servera","body":"Lägg upp Wallenbergare med puré, ärtor och lingon. Skeda över brynt smör precis vid serveringen."}],"tips":[{"title":"Finmalen kalvfärs","body":"Ger en mjukare konsistens än vanlig pannbiff."},{"title":"Iskall grädde","body":"Hjälper färsen att binda en jämn emulsion."},{"title":"Tunt panerad","body":"Ger spröd yta utan hård skorpa."},{"title":"Varsam värme","body":"Stek inte så hårt att biffarna blir torra."}],"sources":[["ICA – Wallenbergare","https://www.ica.se/recept/wallenbergare-725375/"],["Werner Vögeli – Wallenbergare","https://www.koket.se/nyhetsmorgon/werner-vogeli/wallenbergare"],["Stefan Ekengren – Wallenbergare","https://www.koket.se/wallenbergare-med-lingon-smorkokta-artor-och-potatispure"]],"tags":["Köttfärs","Potatis","Festmat"],"countryCode":"SE","countryName":"Sverige","countryFlag":"🇸🇪","countryNote":"Svensk restaurang- och husmanskost.","nut
